function generateSchedule(){
  const subjects = [];
  document.querySelectorAll('.pl-subject-input').forEach(inp=>{
    const name = inp.value.trim();
    if(name){
      const priority = parseInt(inp.parentElement.querySelector('.pl-priority-select').value);
      subjects.push({name, priority});
    }
  });

  if(subjects.length === 0){ toast('请至少输入一个科目'); return; }

  const weekdayHours = parseInt(document.getElementById('plWeekdayHours').value) || 3;
  const weekendHours = parseInt(document.getElementById('plWeekendHours').value) || 6;
  const sessionMin = parseInt(document.getElementById('plSessionMin').value) || 45;
  const breakMin = parseInt(document.getElementById('plBreakMin').value) || 10;

  const days = ['周一','周二','周三','周四','周五','周六','周日'];
  const hoursPerDay = [weekdayHours, weekdayHours, weekdayHours, weekdayHours, weekdayHours, weekendHours, weekendHours];

  // 计算每周总可用时间（分钟）
  const totalWeeklyMin = hoursPerDay.reduce((s,h)=>s+h*60, 0);
  const sessionTotal = sessionMin + breakMin;

  // 按优先级分配权重
  const totalPriority = subjects.reduce((s,sub)=>s+sub.priority, 0);
  subjects.forEach(sub=>{
    sub.weeklyMin = Math.round(totalWeeklyMin * (sub.priority / totalPriority));
    sub.sessionsPerWeek = Math.max(1, Math.floor(sub.weeklyMin / sessionTotal));
  });

  // 生成每天的安排
  const schedule = {};
  days.forEach((day, i)=>{
    const dayMin = hoursPerDay[i] * 60;
    const sessions = Math.floor(dayMin / sessionTotal);
    schedule[day] = [];
    for(let s=0; s<sessions; s++){
      schedule[day].push({slot: s, subject: null, startMin: s * sessionTotal});
    }
  });

  // 轮转分配科目到各时段
  let subjectIdx = 0;
  const subjectQueue = [];
  // 生成一个打乱的科目队列，按优先级重复
  subjects.sort((a,b)=>b.priority - a.priority);
  subjects.forEach(sub=>{
    for(let i=0; i<sub.sessionsPerWeek; i++) subjectQueue.push(sub);
  });

  // 填充时段
  for(const day of days){
    for(const slot of schedule[day]){
      if(subjectQueue.length === 0){
        // 重新填充队列
        subjects.forEach(sub=>{
          for(let i=0; i<Math.ceil(sub.sessionsPerWeek/2); i++) subjectQueue.push(sub);
        });
      }
      if(subjectQueue.length > 0){
        slot.subject = subjectQueue.shift().name;
      }
    }
  }

  // 确保同一天同一科目不超过2次
  for(const day of days){
    const counts = {};
    schedule[day].forEach(slot=>{
      if(slot.subject){
        counts[slot.subject] = (counts[slot.subject]||0) + 1;
        if(counts[slot.subject] > 2){
          // 尝试换一个科目
          const alt = subjects.find(s=>s.name !== slot.subject && (!counts[s.name] || counts[s.name] < 2));
          if(alt) slot.subject = alt.name;
        }
      }
    });
  }

  const generated = {
    subjects, days, schedule, hoursPerDay, sessionMin, breakMin,
    createdAt: new Date().toISOString(),
    completedTasks: Store.get('planGen',{})?.completedTasks || {}
  };
  Store.set('planGen', generated);
  renderGeneratedSchedule();
  toast('📅 学习计划已生成！', 3000);
}

function renderGeneratedSchedule(){
  const el = document.getElementById('generatedSchedule');
  if(!el) return;
  const gen = Store.get('planGen', null);
  if(!gen){
    el.innerHTML = '';
    return;
  }

  const days = gen.days || ['周一','周二','周三','周四','周五','周六','周日'];
  const completed = gen.completedTasks || {};

  let totalTasks = 0, doneTasks = 0;
  days.forEach(day=>{
    (gen.schedule[day]||[]).forEach(slot=>{
      if(slot.subject){
        totalTasks++;
        const key = `${day}-${slot.slot}`;
        if(completed[key]) doneTasks++;
      }
    });
  });

  const progress = totalTasks > 0 ? Math.round(doneTasks/totalTasks*100) : 0;

  let html = `
    <div style="font-size:14px;font-weight:700;margin-bottom:8px;">📋 本周学习日程</div>
    <div class="pl-progress-bar"><div class="pl-progress-fill" style="width:${progress}%"></div></div>
    <div style="font-size:12px;opacity:.7;margin-bottom:12px;text-align:center;">已完成 ${doneTasks}/${totalTasks} 个学习时段 (${progress}%)</div>
    <div class="pl-schedule">
  `;

  for(const day of days){
    const slots = gen.schedule[day] || [];
    const hasTasks = slots.some(s=>s.subject);
    if(!hasTasks) continue;

    html += `<div class="pl-day-block">`;
    html += `<div class="pl-day-header">${day}</div>`;

    slots.forEach(slot=>{
      if(!slot.subject) return;
      const key = `${day}-${slot.slot}`;
      const isDone = completed[key];
      const startHour = Math.floor(slot.startMin / 60) + 9; // 从9点开始
      const startMin = slot.startMin % 60;
      const endMin = slot.startMin + gen.sessionMin;
      const endHour = Math.floor(endMin / 60) + 9;
      const endMinRem = endMin % 60;
      const timeStr = `${String(startHour).padStart(2,'0')}:${String(startMin).padStart(2,'0')}-${String(endHour).padStart(2,'0')}:${String(endMinRem).padStart(2,'0')}`;

      html += `<div class="pl-task-row${isDone?' done':''}">
        <button class="pl-done-btn" onclick="togglePlanGenTask('${key}')">${isDone?'✅':'⬜'}</button>
        <span class="pl-time">${timeStr}</span>
        <span class="pl-subject">${escapeHtml(slot.subject)}</span>
        <span class="pl-duration">${gen.sessionMin}min</span>
      </div>`;
    });
    html += `</div>`;
  }

  html += '</div>';
  el.innerHTML = html;
}

function togglePlanGenTask(key){
  const gen = Store.get('planGen', {});
  if(!gen.completedTasks) gen.completedTasks = {};
  gen.completedTasks[key] = !gen.completedTasks[key];
  Store.set('planGen', gen);
  renderGeneratedSchedule();
}

        <button class="pomo-btn reset" onclick="resetPomo()">重置</button>
      </div>
      <div class="pomodoro-progress"><div class="pomodoro-progress-bar" id="pomoBar"></div></div>
    </div>
  `);
}

function setPomoMode(mode){
  pomoMode = mode;
  pomoTimeLeft = pomoModes[mode];
  pomoRunning = false;
  clearInterval(pomoTimer);
  document.querySelectorAll('.pomodoro-mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  updatePomoDisplay();
  const btn = document.getElementById('pomoStartBtn');
  if(btn) btn.textContent = '开始';
}

function togglePomo(){
  if(pomoRunning){
    pomoRunning = false;
    clearInterval(pomoTimer);
    document.getElementById('pomoStartBtn').textContent = '继续';
  } else {
    pomoRunning = true;
    document.getElementById('pomoStartBtn').textContent = '暂停';
    pomoTimer = setInterval(()=>{
      pomoTimeLeft--;
      if(pomoTimeLeft <= 0){
        clearInterval(pomoTimer);
        pomoRunning = false;
        document.getElementById('pomoStartBtn').textContent = '开始';
        if(pomoMode === 'focus'){
          const count = Store.get('pomodoroCount',0)+1;
          Store.set('pomodoroCount', count);
          checkReward('pomodoro');
          // 低压提醒：小猫伸懒腰
          showPomoCat('专注结束啦～小猫提醒你：该站起来活动 5 分钟了 🐱', count);
        } else {
          showPomoCat('休息结束啦～小猫拍了拍你：准备好了就继续吧 🐱', null);
        }
        setPomoMode(pomoMode==='focus'?'short':'focus');
      }
      updatePomoDisplay();
    }, 1000);
  }
}

function resetPomo(){
  pomoRunning = false;
  clearInterval(pomoTimer); pomoTimer = null;
  pomoTimeLeft = pomoModes[pomoMode];
  updatePomoDisplay();
  const btn = document.getElementById('pomoStartBtn');
  if(btn) btn.textContent = '开始';
}

function stopPomoAll(){
  pomoRunning = false;
  if(pomoTimer){ clearInterval(pomoTimer); pomoTimer = null; }
}

function updatePomoDisplay(){
  const el = document.getElementById('pomoTimerDisplay');
  if(el){
    const m = Math.floor(pomoTimeLeft/60);
    const s = pomoTimeLeft%60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  const bar = document.getElementById('pomoBar');
  if(bar){
    const total = pomoModes[pomoMode];
    bar.style.width = (pomoTimeLeft/total*100)+'%';
  }
}

// 低压提醒：小猫在屏幕角落伸懒腰
function showPomoCat(message, count){
  // 移除已有的
  const existing = document.querySelector('.pomo-cat-overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'pomo-cat-overlay';
  overlay.innerHTML = `
    <div class="pomo-cat-bubble">${message}${count!==null?`<br><span style="font-size:12px;color:var(--text-sub);">已完成 ${count} 个番茄 🍅</span>`:''}</div>
    <div class="pomo-cat-emoji" title="点我可以关闭">🐱</div>
  `;
  document.body.appendChild(overlay);
  // 弹出动画
  requestAnimationFrame(()=>overlay.classList.add('show'));
  // 温柔的音效：轻柔的"喵"声 + 小铃铛
  try{
    const ctx = getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();
    // 柔和的上升音（类似风铃）
    [523.25, 659.25, 783.99].forEach((freq, i)=>{
      const t = ctx.currentTime + i*0.15;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.1, t+0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t+1.5);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+1.5);
    });
  }catch(e){}
  // 点击小猫关闭
  overlay.querySelector('.pomo-cat-emoji').addEventListener('click', ()=>{
    overlay.classList.remove('show');
    setTimeout(()=>overlay.remove(), 800);
  });
  // 30秒后自动收回
  setTimeout(()=>{
    if(overlay.parentNode){
      overlay.classList.remove('show');
      setTimeout(()=>overlay.remove(), 800);
    }
  }, 30000);
}

/* ============================================================
   声学生态系统 — 7 轨道水平混音台
   雨幕 / 海浪 / 森林 / 篝火 / 咖啡馆 / 溪流 / 猫咪呼噜
   ============================================================ */
const noiseTypes = [
  {id:'rain', icon:'🌧️', name:'雨幕'},
  {id:'ocean', icon:'🌊', name:'海浪'},
  {id:'forest', icon:'🌲', name:'森林'},
  {id:'fire', icon:'🔥', name:'篝火'},
  {id:'cafe', icon:'☕', name:'咖啡馆'},
  {id:'stream', icon:'💧', name:'溪流'},
  {id:'cat', icon:'🐱', name:'猫咪呼噜'},
];

// 混音预设
const noisePresets = [
  {id:'rainy-cafe', name:'☕ 雨天咖啡馆', sounds:['rain','cafe']},
  {id:'cozy-night', name:'🐱 温暖夜晚', sounds:['rain','fire','cat']},
  {id:'deep-forest', name:'🌲 深林漫步', sounds:['forest','stream']},
  {id:'ocean-waves', name:'🌊 海边听涛', sounds:['ocean']},
  {id:'focus-mode', name:'📚 专注模式', sounds:['rain','cafe']},
  {id:'sleep-mode', name:'😴 助眠模式', sounds:['rain','cat']},
];
let activePreset = null;

let audioCtx = null;
let noiseNodes = {}; // {type: {src, gain, filter, analyser, interval}}
let mixerMeterRAF = null;
let noiseMasterGain = null;

function getAudioCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    noiseMasterGain = audioCtx.createGain();
    noiseMasterGain.gain.value = 0.8;
    noiseMasterGain.connect(audioCtx.destination);
  }
  return audioCtx;
}

function stopAllNoise(){
  Object.keys(noiseNodes).forEach(type=>{
    const n = noiseNodes[type];
    if(n.interval) clearInterval(n.interval);
    try{ n.src.stop(); }catch(e){}
    try{ n.gain.disconnect(); }catch(e){}
    try{ n.chain.disconnect(); }catch(e){}
  });
  noiseNodes = {};
  if(mixerMeterRAF){ cancelAnimationFrame(mixerMeterRAF); mixerMeterRAF = null; }
  document.querySelectorAll('.noise-card').forEach(c=>c.classList.remove('playing'));
  activePreset = null;
  updateMixerNowPlaying();
  updateNoisePresetActive();
}

// === 噪声缓冲生成器 ===
function makeNoiseBuffer(ctx, duration, filterFn){
  const len = Math.floor(duration * ctx.sampleRate);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  if(filterFn) filterFn(d, len, ctx.sampleRate);
  return buf;
}

// === 7 个声学生态合成器 ===

// 雨幕：高频白噪 + 带通滤波，持续防护帘幕
function createRainSource(ctx){
  const buf = makeNoiseBuffer(ctx, 3, (d, len, sr)=>{
    for(let i=0;i<len;i++){
      d[i] = d[i] * 0.35;
      // 偶尔大雨滴
      if(Math.random() < 0.008){
        d[i] += (Math.random()*2-1) * 0.4;
      }
    }
  });
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=800;
  const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3500; bp.Q.value=0.5;
  const gain = ctx.createGain(); gain.gain.value=0;
  src.connect(hp); hp.connect(bp); bp.connect(gain);
  return {src, gain, chain: gain};
}

// 海浪：低频涌浪 + 10秒周期JS音量振荡
function createOceanSource(ctx){
  const buf = makeNoiseBuffer(ctx, 4, (d, len, sr)=>{
    for(let i=0;i<len;i++){
      d[i] = d[i] * 0.25;
    }
  });
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500;
  const gain = ctx.createGain(); gain.gain.value=0;
  src.connect(lp); lp.connect(gain);
  // 10秒周期音量振荡
  const interval = setInterval(()=>{
    const now = ctx.currentTime;
    // 一个完整周期 10s: 5s 渐强 + 5s 渐弱
    gain.gain.cancelScheduledValues(now);
    const baseVol = gain._userVol || 0.5;
    gain.gain.setValueAtTime(baseVol * 0.15, now);
    gain.gain.linearRampToValueAtTime(baseVol, now + 5);
    gain.gain.linearRampToValueAtTime(baseVol * 0.15, now + 10);
  }, 10000);
  // 立即触发第一次
  setTimeout(()=>{
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.05, now);
    gain.gain.linearRampToValueAtTime(gain._userVol||0.5, now + 5);
    gain.gain.linearRampToValueAtTime(0.05, now + 10);
  }, 50);
  return {src, gain, chain: gain, interval};
}

// 森林：背景风声 + 稀疏鸟鸣
function createForestSource(ctx){
  const buf = makeNoiseBuffer(ctx, 8, (d, len, sr)=>{
    for(let i=0;i<len;i++){
      // 风声基底
      d[i] = d[i] * 0.08 + Math.sin(i*0.0003)*0.04;
    }
    // 插入稀疏鸟鸣
    let i = 0;
    while(i < len){
      if(Math.random() < 0.012){
        // 鸟鸣：FM 合成
        const chirpLen = Math.floor(0.08 + Math.random()*0.15) * sr;
        const startFreq = 2500 + Math.random()*2500;
        for(let j=0; j<chirpLen && i+j<len; j++){
          const t = j/sr;
          const freq = startFreq + 800*Math.sin(2*Math.PI*15*t);
          const env = Math.sin(Math.PI*j/chirpLen);
          d[i+j] += Math.sin(2*Math.PI*freq*t) * env * 0.12;
        }
        // 有时连续两三声
        if(Math.random() > 0.5){
          i += chirpLen + Math.floor(0.03*sr);
          continue;
        }
        i += chirpLen;
      }
      i += Math.floor(0.02*sr);
    }
  });
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6000;
  const gain = ctx.createGain(); gain.gain.value=0;
  src.connect(lp); lp.connect(gain);
  return {src, gain, chain: gain};
}

// 篝火：前景火花四溅，清晰锐利
function createFireSource(ctx){
  const buf = makeNoiseBuffer(ctx, 4, (d, len, sr)=>{
    for(let i=0;i<len;i++){
      d[i] = d[i] * 0.04;
      // 火花 crackle
      if(Math.random() < 0.02){
        const crackleLen = Math.floor(20 + Math.random()*60);
        const amp = 0.3 + Math.random()*0.5;
        const freq = 1500 + Math.random()*3000;
        for(let j=0; j<crackleLen && i+j<len; j++){
          const env = Math.exp(-j/12);
          d[i+j] += Math.sin(2*Math.PI*freq*j/sr) * amp * env;
        }
        i += crackleLen;
      }
      // 偶尔大爆裂
      if(Math.random() < 0.002){
        const popLen = Math.floor(0.05*sr);
        for(let j=0; j<popLen && i+j<len; j++){
          const env = Math.exp(-j/15);
          d[i+j] += (Math.random()*2-1) * 0.6 * env;
        }
        i += popLen;
      }
    }
  });
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=300;
  const gain = ctx.createGain(); gain.gain.value=0;
  src.connect(hp); hp.connect(gain);
  return {src, gain, chain: gain};
}

// 咖啡馆：低沉低语，无辨识人声
function createCafeSource(ctx){
  const buf = makeNoiseBuffer(ctx, 6, (d, len, sr)=>{
    for(let i=0;i<len;i++){
      d[i] = d[i] * 0.06;
      // 偶尔低语
      if(Math.random() < 0.003){
        const murmurLen = Math.floor(0.15*sr);
        const freq = 200 + Math.random()*300;
        for(let j=0; j<murmurLen && i+j<len; j++){
          const env = Math.sin(Math.PI*j/murmurLen);
          const f = freq * (1 + 0.1*Math.sin(2*Math.PI*3*j/sr));
          d[i+j] += Math.sin(2*Math.PI*f*j/sr) * env * 0.08;
        }
        i += murmurLen;
      }
      // 偶尔杯具声
      if(Math.random() < 0.0008){
        const clinkLen = Math.floor(0.08*sr);
        for(let j=0; j<clinkLen && i+j<len; j++){
          const env = Math.exp(-j/8);
          d[i+j] += Math.sin(2*Math.PI*3000*j/sr) * 0.1 * env;
        }
        i += clinkLen;
      }
    }
  });
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=800;
  const gain = ctx.createGain(); gain.gain.value=0;
  src.connect(lp); lp.connect(gain);
  return {src, gain, chain: gain};
}

// 溪流：清澈中层流水
function createStreamSource(ctx){
  const buf = makeNoiseBuffer(ctx, 4, (d, len, sr)=>{
    for(let i=0;i<len;i++){
      const t = i/sr;
      d[i] = d[i] * 0.15;
      // 水流波动
      d[i] += Math.sin(2*Math.PI*0.5*t) * 0.05;
      d[i] += Math.sin(2*Math.PI*2.3*t + Math.sin(t*0.1)) * 0.03;
    }
  });
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=0.4;
  const gain = ctx.createGain(); gain.gain.value=0;
  src.connect(bp); bp.connect(gain);
  return {src, gain, chain: gain};
}

// 猫咪呼噜：深沉低通滤波的结构振动
function createCatSource(ctx){
  const buf = makeNoiseBuffer(ctx, 4, (d, len, sr)=>{
    for(let i=0;i<len;i++){
      const t = i/sr;
      // 25Hz 锯齿波喉音
      const throat = ((t*25)%1)*2-1;
      // 0.8秒呼噜周期
      const purrCycle = (t%0.8)/0.8;
      let env;
      if(purrCycle < 0.42) env = Math.sin(purrCycle/0.42*Math.PI);
      else if(purrCycle < 0.52) env = 0.05;
      else env = Math.sin((purrCycle-0.52)/0.48*Math.PI);
      // 20Hz 颤抖
      const tremolo = 0.6 + 0.4*Math.sin(2*Math.PI*20*t);
      d[i] = throat * env * tremolo * 0.3;
      // 50Hz 泛音
      d[i] += Math.sin(2*Math.PI*50*t) * env * tremolo * 0.1;
      // 白噪底
      d[i] += (Math.random()*2-1) * 0.015 * env;
    }
  });
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  // 深沉低通
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200; lp.Q.value=0.7;
  const gain = ctx.createGain(); gain.gain.value=0;
  src.connect(lp); lp.connect(gain);
  return {src, gain, chain: gain};
}

const noiseCreators = {
  rain: createRainSource,
  ocean: createOceanSource,
  forest: createForestSource,
  fire: createFireSource,
  cafe: createCafeSource,
  stream: createStreamSource,
  cat: createCatSource,
};

function toggleNoiseMix(type){
  const ctx = getAudioCtx();
  if(ctx.state === 'suspended') ctx.resume();
  if(noiseNodes[type]){
    // 停止该轨道
    const n = noiseNodes[type];
    if(n.interval) clearInterval(n.interval);
    try{ n.src.stop(); }catch(e){}
    try{ n.gain.disconnect(); }catch(e){}
    try{ n.chain.disconnect(); }catch(e){}
    delete noiseNodes[type];
    document.querySelectorAll(`.noise-card[data-type="${type}"]`).forEach(c=>c.classList.remove('playing'));
  } else {
    // 启动该轨道
    const creator = noiseCreators[type];
    if(!creator) return;
    const node = creator(ctx);
    // analyser for level meter
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    node.chain.connect(analyser);
    analyser.connect(noiseMasterGain);
    // 淡入
    node.gain._userVol = 0.5;
    node.gain.gain.setValueAtTime(0, ctx.currentTime);
    node.gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.5);
    node.src.start();
    noiseNodes[type] = {...node, analyser};
    document.querySelectorAll(`.noise-card[data-type="${type}"]`).forEach(c=>c.classList.add('playing'));
    // 重置音量滑块
    const volSlider = document.querySelector(`.noise-card[data-type="${type}"] .noise-vol input`);
    if(volSlider) volSlider.value = 50;
  }
  updateMixerNowPlaying();
  updateNoisePresetActive();
  if(Object.keys(noiseNodes).length > 0 && !mixerMeterRAF){
    startMixerMeters();
  } else if(Object.keys(noiseNodes).length === 0 && mixerMeterRAF){
    cancelAnimationFrame(mixerMeterRAF); mixerMeterRAF = null;
  }
}

function setNoiseVolPer(type, val){
  const node = noiseNodes[type];
  if(node){
    node.gain._userVol = val/100;
    node.gain.gain.value = val/100;
  }
}

function setNoiseVol(val){
  Object.values(noiseNodes).forEach(n=>{
    n.gain._userVol = val/100;
    n.gain.gain.value = val/100;
  });
  if(noiseMasterGain) noiseMasterGain.gain.value = val/100;
}

function setMixerMaster(val){
  if(noiseMasterGain) noiseMasterGain.gain.value = val/100;
}

function updateMixerNowPlaying(){
  const el = document.getElementById('noiseNowPlaying');
  if(!el) return;
  const types = Object.keys(noiseNodes);
  if(types.length === 0){
    el.querySelector('.chips').innerHTML = '<span class="empty">未播放</span>';
    return;
  }
  el.querySelector('.chips').innerHTML = types.map(t=>{
    const info = noiseTypes.find(x=>x.id===t);
    return `<span class="chip">${info?info.icon:''} ${info?info.name:t}</span>`;
  }).join('');
}

function updateNoisePresetActive(){
  const currentSounds = Object.keys(noiseNodes).sort().join(',');
  const matched = noisePresets.find(p => p.sounds.slice().sort().join(',') === currentSounds);
  activePreset = matched ? matched.id : null;
  document.querySelectorAll('.noise-preset').forEach(el=>{
    el.classList.toggle('active', el.dataset.id === activePreset);
  });
}

function applyNoisePreset(presetId){
  const preset = noisePresets.find(p=>p.id===presetId);
  if(!preset) return;
  // 停止不在预设中的音效
  const toRemove = Object.keys(noiseNodes).filter(t=>!preset.sounds.includes(t));
  toRemove.forEach(type=>{
    const n = noiseNodes[type];
    if(n.interval) clearInterval(n.interval);
    try{ n.src.stop(); }catch(e){}
    try{ n.gain.disconnect(); }catch(e){}
    try{ n.chain.disconnect(); }catch(e){}
    delete noiseNodes[type];
    document.querySelectorAll(`.noise-card[data-type="${type}"]`).forEach(c=>c.classList.remove('playing'));
  });
  // 开启预设中但还没播放的音效
  const ctx = getAudioCtx();
  if(ctx.state === 'suspended') ctx.resume();
  preset.sounds.forEach(type=>{
    if(noiseNodes[type]) return;
    const creator = noiseCreators[type];
    if(!creator) return;
    const node = creator(ctx);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    node.chain.connect(analyser);
    analyser.connect(noiseMasterGain);
    node.gain._userVol = 0.5;
    node.gain.gain.setValueAtTime(0, ctx.currentTime);
    node.gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.5);
    node.src.start();
    noiseNodes[type] = {...node, analyser};
    document.querySelectorAll(`.noise-card[data-type="${type}"]`).forEach(c=>c.classList.add('playing'));
    const volSlider = document.querySelector(`.noise-card[data-type="${type}"] .noise-vol input`);
    if(volSlider) volSlider.value = 50;
  });
  activePreset = presetId;
  updateMixerNowPlaying();
  updateNoisePresetActive();
}

function startMixerMeters(){
  function loop(){
    if(!mixerMeterRAF) return;
    Object.keys(noiseNodes).forEach(type=>{
      const node = noiseNodes[type];
      if(!node.analyser) return;
      const data = new Uint8Array(node.analyser.frequencyBinCount);
      node.analyser.getByteFrequencyData(data);
      let sum = 0;
      for(let i=0;i<data.length;i++) sum += data[i];
      const avg = sum / data.length;
      // Could add visual feedback on cards here
    });
    mixerMeterRAF = requestAnimationFrame(loop);
  }
  mixerMeterRAF = requestAnimationFrame(loop);
}

function openNoise(){
  openModal(`
    <div class="modal-title"><span class="emoji">🎵</span>白噪音专注</div>
    <div class="modal-desc">沉浸式环境音效，帮助你专注学习或安然入睡。可以同时开启多个音效混合播放，每个都有独立音量调节。</div>
    <div class="noise-presets">
      ${noisePresets.map(p=>`<div class="noise-preset" data-id="${p.id}" onclick="applyNoisePreset('${p.id}')">${p.name}</div>`).join('')}
    </div>
    <div class="noise-now-playing" id="noiseNowPlaying">
      <span class="label">🎧 正在播放：</span>
      <div class="chips"><span class="empty">未播放</span></div>

function switchStressTab(tab){
  document.querySelectorAll('.stress-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.stress-content').forEach(c=>c.classList.remove('active'));
  const tabs = ['doodle','woodfish','smash','bubble','blackhole','bottle','burn','shred'];
  const idx = tabs.indexOf(tab);
  if(idx >= 0) document.querySelectorAll('.stress-tab')[idx].classList.add('active');
  const tabIds = {doodle:'stressDoodle',woodfish:'stressWoodfish',smash:'stressSmash',bubble:'stressBubble',blackhole:'stressBlackHole',bottle:'stressBottle',burn:'stressBurn',shred:'stressShred'};
  const el = document.getElementById(tabIds[tab]);
  if(el) el.classList.add('active');
  if(tab==='doodle') initDoodle();
  else if(tab==='burn') initBurn();
  else if(tab==='shred') initShredder();
  else if(tab==='woodfish'){ woodfishCount=0; woodfishCombo=0; }
  else if(tab==='smash'){ initSmashCanvas(); }
  else if(tab==='bubble'){ initBubbleWrap(); }
  else if(tab==='blackhole'){ initBlackHoleStress(); }
}

function setDoodleMode(mode){
  doodleMode = mode;
  document.getElementById('modeDrawBtn')?.classList.toggle('active', mode==='draw');
  document.getElementById('modeTextBtn')?.classList.toggle('active', mode==='text');
  const ti = document.getElementById('doodleTextInput');
  if(ti) ti.style.display = mode==='text' ? 'flex' : 'none';
  if(mode==='text') setTimeout(()=>document.getElementById('doodleTextValue')?.focus(),100);
}

function initDoodle(){
  const canvas = document.getElementById('doodleCanvas');
  if(!canvas) return;
  if(doodleAnimId){ cancelAnimationFrame(doodleAnimId); doodleAnimId = null; }
  const dpr = window.devicePixelRatio||1;
  canvas.width = canvas.clientWidth*dpr;
  canvas.height = canvas.clientHeight*dpr;
  doodleCtx = canvas.getContext('2d');
  doodleCtx.scale(dpr,dpr);
  doodleCtx.lineCap = 'round'; doodleCtx.lineJoin = 'round';
  let lastX=0, lastY=0;
  let curStroke = null;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches?e.touches[0]:e;
    return {x:(t.clientX-rect.left), y:(t.clientY-rect.top)};
  }
  function start(e){
    e.preventDefault();
    const p = getPos(e);
    if(doodleMode === 'text'){
      const textVal = document.getElementById('doodleTextValue')?.value.trim();
      if(textVal){
        doodleTexts.push({text:textVal, x:p.x, y:p.y, color:doodleColor, size:doodleSize*4+12});
        document.getElementById('doodleTextValue').value = '';
        renderDoodleCanvas();
      }
      return;
    }
    doodleDrawing = true;
    lastX = p.x; lastY = p.y;
    curStroke = {points:[{x:p.x,y:p.y}], color:doodleColor, size:doodleSize};
    doodleStrokes.push(curStroke);
  }
  function move(e){
    if(!doodleDrawing) return;
    e.preventDefault();
    const p = getPos(e);
    curStroke.points.push({x:p.x, y:p.y});
    renderDoodleCanvas();
  }
  function end(){ doodleDrawing = false; curStroke = null; }
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
  renderDoodleCanvas();
}

function renderDoodleCanvas(){
  if(!doodleCtx) return;
  const canvas = document.getElementById('doodleCanvas');
  if(!canvas) return;
  doodleCtx.clearRect(0,0,canvas.width,canvas.height);
  // Draw strokes
  doodleStrokes.forEach(s=>{
    if(s.points.length < 2) return;
    doodleCtx.strokeStyle = s.color;
    doodleCtx.lineWidth = s.size;
    doodleCtx.beginPath();
    doodleCtx.moveTo(s.points[0].x, s.points[0].y);
    s.points.forEach(p=>doodleCtx.lineTo(p.x, p.y));
    doodleCtx.stroke();
  });
  // Draw texts
  doodleTexts.forEach(t=>{
    doodleCtx.fillStyle = t.color;
    doodleCtx.font = `${t.size}px 'PingFang SC','Microsoft YaHei',sans-serif`;
    doodleCtx.textAlign = 'center';
    doodleCtx.textBaseline = 'middle';
    doodleCtx.fillText(t.text, t.x, t.y);
  });
}

function setDoodleColor(c,i){
  doodleColor = c;
  document.querySelectorAll('.color-swatch').forEach((s,idx)=>s.classList.toggle('active',idx===i));
}
function setDoodleSize(s){ doodleSize = s; }
function clearDoodle(){
  doodleStrokes = []; doodleTexts = [];
  renderDoodleCanvas();
}

// 手榴弹爆炸 → 烟花
function explodeDoodle(){
  const canvas = document.getElementById('doodleCanvas');
  if(!canvas || !doodleCtx || doodleExploding) return;
  doodleExploding = true;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const cx = w/2, cy = h/2;
  const dpr = window.devicePixelRatio || 1;

  // 阶段1: 手榴弹出现在中心，3-2-1倒计时
  let phase = 'grenade';
  let countdown = 3;
  const fwColors = ['#fc8181','#f6ad55','#6c8eef','#68d391','#4fd1c5','#ffd700','#ff6b6b','#8ba5f5'];

  function drawGrenade(){
    doodleCtx.clearRect(0,0,canvas.width,canvas.height);
    // 先保留已有内容
    renderDoodleCanvas();
    // 画手榴弹
    doodleCtx.save();
    doodleCtx.font = '48px sans-serif';
    doodleCtx.textAlign = 'center';
    doodleCtx.textBaseline = 'middle';
    const pulse = 1 + Math.sin(Date.now()/100)*0.1;
    doodleCtx.translate(cx, cy);
    doodleCtx.scale(pulse, pulse);
    doodleCtx.fillText('💣', 0, 0);
    doodleCtx.restore();
    // 倒计时数字
    doodleCtx.fillStyle = '#ff6b6b';
    doodleCtx.font = 'bold 32px sans-serif';
    doodleCtx.textAlign = 'center';
    doodleCtx.textBaseline = 'middle';
    doodleCtx.fillText(countdown, cx, cy+50);
  }

  const grenadeTimer = setInterval(()=>{
    countdown--;
    if(countdown <= 0){
      clearInterval(grenadeTimer); doodleGrenadeTimer = null;
      doExplosion();
    } else {
      drawGrenade();
    }
  }, 700);
  doodleGrenadeTimer = grenadeTimer;
  drawGrenade();

  function doExplosion(){
    // 阶段2: 白色闪光
    doodleCtx.fillStyle = 'rgba(255,255,255,0.9)';
    doodleCtx.fillRect(0,0,canvas.width,canvas.height);
    // 爆炸音效
    try{
      const ctx = getAudioCtx();
      if(ctx.state==='suspended') ctx.resume();
      // 低频爆炸声
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime+0.5);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime+0.6);
      // 高频碎裂声
      const noise = ctx.createBufferSource();
      const nbuf = ctx.createBuffer(1, ctx.sampleRate*0.3, ctx.sampleRate);
      const ndata = nbuf.getChannelData(0);
      for(let i=0;i<ndata.length;i++) ndata[i] = (Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.1));
      noise.buffer = nbuf;
      const ngain = ctx.createGain(); ngain.gain.value = 0.15;
      const nfilter = ctx.createBiquadFilter(); nfilter.type='highpass'; nfilter.frequency.value=1000;
      noise.connect(nfilter); nfilter.connect(ngain); ngain.connect(ctx.destination);
      noise.start();
    }catch(e){}

    // 收集所有文字 → 生成字母碎片
    const shrapnel = [];
    doodleTexts.forEach(t=>{
      const chars = t.text.split('');
      chars.forEach(ch=>{
        shrapnel.push({
          type:'text', char:ch, x:t.x, y:t.y,
          vx:(Math.random()-0.5)*12, vy:(Math.random()-0.5)*12-4,
          color:t.color, size:t.size, life:1, rot:0, vrot:(Math.random()-0.5)*0.3
        });
      });
    });
    // 收集涂鸦 → 碎片粒子
    doodleStrokes.forEach(s=>{
      s.points.forEach((p,idx)=>{
        if(idx % 3 !== 0) return; // 采样
        shrapnel.push({
          type:'dot', x:p.x, y:p.y,
          vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10-3,
          color:s.color, size:s.size, life:1
        });
      });
    });
    // 中心爆炸碎片
    for(let i=0;i<40;i++){
      shrapnel.push({
        type:'dot', x:cx, y:cy,
        vx:(Math.random()-0.5)*16, vy:(Math.random()-0.5)*16-5,
        color:fwColors[Math.floor(Math.random()*fwColors.length)],
        size:Math.random()*5+2, life:1
      });
    }

    // 多处烟花
    const fireworks = [];
    const fwCount = 5;
    for(let f=0; f<fwCount; f++){
      fireworks.push({
        x: Math.random()*w*0.7+w*0.15,
        y: Math.random()*h*0.5+h*0.2,
        delay: f*15,  // 帧延迟
        triggered: false,
        particles: []
      });
    }

    let frame = 0;
    function animate(){
      doodleCtx.clearRect(0,0,canvas.width,canvas.height);
      let alive = false;

      // 更新碎片
      shrapnel.forEach(p=>{
        if(p.life > 0){
          alive = true;
          p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.015;
          if(p.type === 'text'){
            p.rot += p.vrot;
            doodleCtx.save();
            doodleCtx.globalAlpha = Math.max(0, p.life);
            doodleCtx.fillStyle = p.color;
            doodleCtx.font = `${p.size}px 'PingFang SC','Microsoft YaHei',sans-serif`;
            doodleCtx.textAlign = 'center';
            doodleCtx.textBaseline = 'middle';
            doodleCtx.translate(p.x, p.y);
            doodleCtx.rotate(p.rot);
            doodleCtx.fillText(p.char, 0, 0);
            doodleCtx.restore();
          } else {
            doodleCtx.globalAlpha = Math.max(0, p.life);
            doodleCtx.fillStyle = p.color;
            doodleCtx.beginPath();
            doodleCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            doodleCtx.fill();
            // 拖尾
            doodleCtx.globalAlpha = Math.max(0, p.life*0.3);
            doodleCtx.beginPath();
            doodleCtx.arc(p.x-p.vx*0.5, p.y-p.vy*0.5, p.size*0.7, 0, Math.PI*2);
            doodleCtx.fill();
          }
        }
      });

      // 触发烟花
      fireworks.forEach(fw=>{
        if(!fw.triggered && frame >= fw.delay){
          fw.triggered = true;
          const pcount = 30 + Math.floor(Math.random()*20);
          const c1 = fwColors[Math.floor(Math.random()*fwColors.length)];
          const c2 = fwColors[Math.floor(Math.random()*fwColors.length)];
          for(let i=0;i<pcount;i++){
            const angle = (Math.PI*2/pcount)*i + Math.random()*0.3;
            const speed = Math.random()*5+3;
            fw.particles.push({
              x:fw.x, y:fw.y,
              vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
              c: Math.random()>0.5 ? c1 : c2,
              size: Math.random()*3+1.5, life:1, trail:[]
            });
          }
          // 烟花爆炸音
          try{
            const ctx2 = getAudioCtx();
            const o = ctx2.createOscillator();
            const g = ctx2.createGain();
            o.type='sine';
            o.frequency.setValueAtTime(800+Math.random()*400, ctx2.currentTime);
            o.frequency.exponentialRampToValueAtTime(100, ctx2.currentTime+0.3);
            g.gain.setValueAtTime(0.08, ctx2.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime+0.4);
            o.connect(g); g.connect(ctx2.destination);
            o.start(); o.stop(ctx2.currentTime+0.4);
          }catch(e){}
        }
        // 更新烟花粒子
        fw.particles.forEach(p=>{
          if(p.life > 0){
            alive = true;
            p.trail.push({x:p.x, y:p.y});
            if(p.trail.length > 8) p.trail.shift();
            p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.98; p.life -= 0.012;
            // 拖尾
            p.trail.forEach((tp,ti)=>{
              doodleCtx.globalAlpha = Math.max(0, p.life * ti/p.trail.length * 0.5);
              doodleCtx.fillStyle = p.c;
              doodleCtx.beginPath();
              doodleCtx.arc(tp.x, tp.y, p.size*0.6, 0, Math.PI*2);
              doodleCtx.fill();
            });
            // 粒子主体
            doodleCtx.globalAlpha = Math.max(0, p.life);
            doodleCtx.fillStyle = p.c;
            doodleCtx.beginPath();
            doodleCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            doodleCtx.fill();
            // 发光
            doodleCtx.globalAlpha = Math.max(0, p.life*0.3);
            doodleCtx.beginPath();
            doodleCtx.arc(p.x, p.y, p.size*2, 0, Math.PI*2);
            doodleCtx.fill();
          }
        });
      });

      doodleCtx.globalAlpha = 1;
      frame++;
      if(alive){
        doodleAnimId = requestAnimationFrame(animate);
      } else {
        doodleExploding = false;
        doodleStrokes = []; doodleTexts = [];
        toast('💥 烦恼已炸成烟花！释放的感觉真好～');
      }
    }
    animate();
  }
}

// 海浪漂流瓶：投入大海后玻璃瓶随浪漂远 + 治愈反馈
function sendBottle(){
  const text = document.getElementById('bottleText').value.trim();
  if(!text){ toast('写点什么再投出去吧～'); return; }
  const sendBtn = document.getElementById('bottleSendBtn');
  const textarea = document.getElementById('bottleText');
  const bottleAnim = document.getElementById('oceanBottleAnim');
  const feedback = document.getElementById('oceanFeedback');
  const recv = document.getElementById('bottleReceived');

  if(sendBtn) sendBtn.disabled = true;
  if(textarea) textarea.value = '';
  if(textarea) textarea.style.opacity = '0.35';
  if(recv) recv.innerHTML = '';

  // 玻璃瓶漂远动画
  if(bottleAnim){
    bottleAnim.classList.remove('show');
    void bottleAnim.offsetWidth;
    bottleAnim.classList.add('show');
  }

  // 海浪音效
  try{
    const ctx = getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(420, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime+2);
    gain.gain.setValueAtTime(0.07, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+2);
    const filter = ctx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=500;
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+2);
  }catch(e){}

  // 瓶子消失后浮现治愈文案
  setTimeout(()=>{
    if(feedback) feedback.classList.add('show');
  }, 5500);

  // 恢复
  setTimeout(()=>{
    if(bottleAnim) bottleAnim.classList.remove('show');
    if(feedback) feedback.classList.remove('show');
    if(sendBtn) sendBtn.disabled = false;
    if(textarea) textarea.style.opacity = '';
  }, 9000);
}

/* ============================================================
   虚拟烧纸 — 书写 → 点燃 → 蔓延 → 燃尽
   4阶段互动：暗色背景 + 发黄纸张 + 手写钢笔字 → 火苗鼠标 → 火焰蔓延 + 碎屑飘散 → 全黑浮现治愈文案
   音效：沙沙手写声 / 擦火柴声 / 噼啪燃烧声 + 微风
   ============================================================ */

// 烧纸状态
let burnState = 'idle';      // idle | igniting | burning | burnt
let burnCtx = null;           // AudioContext
let burnNodes = [];            // 当前活跃的音频节点
let burnIntervalId = null;     // 火焰蔓延循环 interval
let burnSoundIntervalId = null; // 噼啪声循环 interval
let burnAshInterval = null;     // 余烬生成 interval
let burnFadeTimeout = null;     // 渐隐超时
let burnMouseHandler = null;  // 鼠标移动 handler
let burnClickHandler = null;   // 点击 handler
let burnTouchHandler = null;   // 触摸移动 handler
let burnTouchClickHandler = null; // 触摸点击 handler
let burnFlames = [];           // 活跃火焰元素
let burnIgnited = false;       // 是否已点燃
let burnTimeouts = [];         // 追踪所有火焰相关 setTimeout，便于统一清理

function initBurn(){
  // 重置状态
  burnState = 'idle';
  burnIgnited = false;
  burnFlames = [];
  stopBurnAllSound();
  if(burnIntervalId){ clearInterval(burnIntervalId); burnIntervalId = null; }
  // 重置 DOM
  const paper = document.getElementById('burnPaper');
  const wrap = document.getElementById('burnPaperWrap');
  const controls = document.getElementById('burnControls');
  const stage = document.getElementById('burnStage');
  const msg = document.getElementById('burnMsg');
  const cursor = document.getElementById('burnFireCursor');
  if(paper){ paper.innerHTML=''; paper.classList.remove('burning','typing'); }
  if(wrap){ wrap.classList.remove('fading'); wrap.style.opacity=''; }
  if(controls){ controls.style.display='block'; const btn=document.getElementById('burnBtn'); if(btn){btn.disabled=false;btn.textContent='🔥 烧毁';} }
  if(stage){ stage.classList.remove('burn-igniting','burn-burning'); }
  if(msg){ msg.textContent=''; msg.style.opacity='0'; }
  if(cursor){ cursor.classList.remove('active'); }
  // 清除残留火焰和灰烬
  document.querySelectorAll('.burn-flame,.burn-ash,.burn-edge').forEach(el=>el.remove());
}

// --- 音效：沙沙手写声 ---
let burnTypeOsc = null, burnTypeGain = null;
function startBurnTypeSound(){
  if(!burnCtx) burnCtx = new (window.AudioContext||window.webkitAudioContext)();
  stopBurnTypeSound();
  // 白噪声
  const bufferSize = burnCtx.sampleRate * 0.3;
  const buffer = burnCtx.createBuffer(1, bufferSize, burnCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
  const noise = burnCtx.createBufferSource();
  noise.buffer = buffer; noise.loop = true;
  // 带通滤波 → 沙沙声
  const bp = burnCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 0.5;
  const gain = burnCtx.createGain();
  gain.gain.value = 0;
  noise.connect(bp); bp.connect(gain); gain.connect(burnCtx.destination);
  noise.start();
  burnTypeOsc = noise; burnTypeGain = gain;
  burnNodes.push(noise, gain);
}
function stopBurnTypeSound(){
  if(burnTypeOsc){ try{ burnTypeOsc.stop(); }catch(e){} burnTypeOsc=null; }
  burnTypeGain = null;
}
// 打字时短暂播放沙沙声
function onBurnType(){
  const paper = document.getElementById('burnPaper');
  if(paper) paper.classList.add('typing');
  if(!burnCtx) burnCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(burnCtx.state === 'suspended') burnCtx.resume();
  if(burnTypeGain){
    burnTypeGain.gain.cancelScheduledValues(burnCtx.currentTime);
    burnTypeGain.gain.setTargetAtTime(0.04, burnCtx.currentTime, 0.02);
    burnTypeGain.gain.setTargetAtTime(0, burnCtx.currentTime + 0.08, 0.05);
  }
  clearTimeout(window._burnTypeT);
  window._burnTypeT = setTimeout(()=>{
    if(paper) paper.classList.remove('typing');
  }, 400);
}

// --- 音效：擦火柴声 ---
function playMatchSound(){
  if(!burnCtx) burnCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(burnCtx.state === 'suspended') burnCtx.resume();
  const now = burnCtx.currentTime;
  // 高频白噪声短脉冲
  const buf = burnCtx.createBuffer(1, burnCtx.sampleRate * 0.15, burnCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const t = i / burnCtx.sampleRate;
    const env = Math.exp(-t * 20);
    d[i] = (Math.random()*2-1) * env;
  }
  const src = burnCtx.createBufferSource(); src.buffer = buf;
  const hp = burnCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 2000;
  const gain = burnCtx.createGain(); gain.gain.value = 0.15;
  src.connect(hp); hp.connect(gain); gain.connect(burnCtx.destination);
  src.start(now);
}

// --- 音效：纸张燃烧噼啪声 + 微风 ---
function startBurnSound(){
  if(!burnCtx) burnCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(burnCtx.state === 'suspended') burnCtx.resume();
  stopBurnAllSound();
  // 1. 低频白噪声底噪 → 火焰呼呼声
  const bufSize = burnCtx.sampleRate * 2;
  const buf = burnCtx.createBuffer(1, bufSize, burnCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) d[i] = Math.random()*2-1;
  const noise = burnCtx.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  const lp = burnCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 400; lp.Q.value = 0.3;
  const noiseGain = burnCtx.createGain();
  noiseGain.gain.value = 0.08;
  noise.connect(lp); lp.connect(noiseGain); noiseGain.connect(burnCtx.destination);
  noise.start();
  burnNodes.push(noise, noiseGain);
  // 2. 随机噼啪声
  burnSoundIntervalId = setInterval(()=>{
    if(!burnCtx) return;
    const t = burnCtx.currentTime;
    // 噼啪
    const osc = burnCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = 800 + Math.random()*2000;
    const g = burnCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.03 + Math.random()*0.04);
    const bp = burnCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 2;
    osc.connect(bp); bp.connect(g); g.connect(burnCtx.destination);
    osc.start(t); osc.stop(t + 0.1);
  }, 120 + Math.random()*100);
  // 3. 微风：低频调制
  const windOsc = burnCtx.createOscillator();
  windOsc.type = 'sine'; windOsc.frequency.value = 0.3;
  const windGain = burnCtx.createGain();
  windGain.gain.value = 0.03;
  // LFO 调制噪声增益
  windOsc.connect(windGain);
  windGain.connect(noiseGain.gain);
  windOsc.start();
  burnNodes.push(windOsc, windGain);
}

function stopBurnAllSound(){
  if(burnSoundIntervalId){ clearInterval(burnSoundIntervalId); burnSoundIntervalId = null; }
  if(burnIntervalId){ clearInterval(burnIntervalId); burnIntervalId = null; }
  if(burnAshInterval){ clearInterval(burnAshInterval); burnAshInterval = null; }
  if(burnFadeTimeout){ clearTimeout(burnFadeTimeout); burnFadeTimeout = null; }
  // 清理所有追踪的 setTimeout
  burnTimeouts.forEach(t=>clearTimeout(t));
  burnTimeouts = [];
  // 移除 document 上的事件监听器（防止关闭弹窗后仍跟随鼠标）
  if(burnMouseHandler){ document.removeEventListener('mousemove', burnMouseHandler); burnMouseHandler = null; }
  if(burnClickHandler){ document.removeEventListener('click', burnClickHandler); burnClickHandler = null; }
  if(burnTouchHandler){ document.removeEventListener('touchmove', burnTouchHandler); burnTouchHandler = null; }
  if(burnTouchClickHandler){ document.removeEventListener('touchstart', burnTouchClickHandler); burnTouchClickHandler = null; }
  // 隐藏火苗光标
  const cursor = document.getElementById('burnFireCursor');
  if(cursor) cursor.classList.remove('active');
  burnNodes.forEach(n=>{ try{ if(n.stop) n.stop(); }catch(e){} try{ if(n.disconnect) n.disconnect(); }catch(e){} });
  burnNodes = [];
  stopBurnTypeSound();
}

// --- 阶段1→2：点击烧毁 → 鼠标变火苗 → 拖拽碰触纸张 ---
function startBurn(){
  const paper = document.getElementById('burnPaper');
  if(!paper || !paper.textContent.trim()){
    toast('先写下你的烦恼，再烧掉它');
    return;
  }
  burnState = 'igniting';
  const stage = document.getElementById('burnStage');
  const controls = document.getElementById('burnControls');
  const cursor = document.getElementById('burnFireCursor');
  const btn = document.getElementById('burnBtn');
  if(stage) stage.classList.add('burn-igniting');
  if(controls) controls.style.display = 'none';
  if(cursor) cursor.classList.add('active');
  if(btn) btn.disabled = true;
  // 播放擦火柴声
  if(burnCtx && burnCtx.state === 'suspended') burnCtx.resume();
  playMatchSound();
  // 启动 AudioContext（用户手势触发）
  if(!burnCtx) burnCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(burnCtx.state === 'suspended') burnCtx.resume();
  startBurnTypeSound();  // 保持沙沙声节点
  toast('🔥 用火苗碰触纸张边缘来点燃');
  // 鼠标移动 → 火苗跟随
  burnMouseHandler = (e)=>{
    if(cursor){
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    }
  };
  document.addEventListener('mousemove', burnMouseHandler);
  burnTouchHandler = (e)=>{
    if(e.touches.length > 0){
      const t = e.touches[0];
      if(cursor){
        cursor.style.left = t.clientX + 'px';
        cursor.style.top = t.clientY + 'px';
      }
    }
  };
  document.addEventListener('touchmove', burnTouchHandler, {passive:false});
  // 点击 → 检测是否在纸张上
  burnClickHandler = (e)=>{
    const rect = paper.getBoundingClientRect();
    const x = e.clientX, y = e.clientY;
    // 在纸张范围内或边缘附近
    if(x >= rect.left - 20 && x <= rect.right + 20 && y >= rect.top - 20 && y <= rect.bottom + 20){
      ignitePaper(x, y);
    }
  };
  document.addEventListener('click', burnClickHandler);
  burnTouchClickHandler = (e)=>{
    if(e.touches.length > 0){
      const t = e.touches[0];
      const paperEl = document.getElementById('burnPaper');
      if(!paperEl) return;
      const rect = paperEl.getBoundingClientRect();
      if(t.clientX >= rect.left - 20 && t.clientX <= rect.right + 20 && t.clientY >= rect.top - 20 && t.clientY <= rect.bottom + 20){
        e.preventDefault();
        ignitePaper(t.clientX, t.clientY);
      }
    }
  };
  document.addEventListener('touchstart', burnTouchClickHandler, {passive:false});
}

// --- 阶段2→3：点燃 → 火焰从边缘向中心蔓延 ---
function ignitePaper(x, y){
  if(burnIgnited) return;
  burnIgnited = true;
  burnState = 'burning';
  // 移除鼠标监听
  if(burnMouseHandler){ document.removeEventListener('mousemove', burnMouseHandler); burnMouseHandler = null; }
  if(burnClickHandler){ document.removeEventListener('click', burnClickHandler); burnClickHandler = null; }
  if(burnTouchHandler){ document.removeEventListener('touchmove', burnTouchHandler); burnTouchHandler = null; }
  if(burnTouchClickHandler){ document.removeEventListener('touchstart', burnTouchClickHandler); burnTouchClickHandler = null; }
  const stage = document.getElementById('burnStage');
  const cursor = document.getElementById('burnFireCursor');
  if(stage){ stage.classList.remove('burn-igniting'); stage.classList.add('burn-burning'); }
  if(cursor) cursor.classList.remove('active');
  const paper = document.getElementById('burnPaper');
  const wrap = document.getElementById('burnPaperWrap');
  if(paper) paper.classList.add('burning');
  // 启动燃烧音效
  stopBurnTypeSound();
  startBurnSound();
  // 计算纸张在 stage 中的位置
  const paperRect = paper.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const pW = paperRect.width, pH = paperRect.height;
  const pL = paperRect.left - stageRect.left;
  const pT = paperRect.top - stageRect.top;
  const pR = pL + pW, pB = pT + pH;
  // 点击位置最近的边缘
  const distLeft = Math.abs(x - pL), distRight = Math.abs(x - pR);
  const distTop = Math.abs(y - pT), distBottom = Math.abs(y - pB);
  const minDist = Math.min(distLeft, distRight, distTop, distBottom);
  let startEdge = 'bottom';
  if(minDist === distLeft) startEdge = 'left';
  else if(minDist === distRight) startEdge = 'right';
  else if(minDist === distTop) startEdge = 'top';
  // 火焰前沿：每条边的进度 0~1（表示从该边向中心推进的比例）
  const fronts = {
    left:   startEdge==='left'   ? 0.02 : 0,
    right:  startEdge==='right'  ? 0.02 : 0,
    top:    startEdge==='top'     ? 0.02 : 0,
    bottom: startEdge==='bottom' ? 0.02 : 0,
  };
  // 不规则性：每条边推进速度略有不同
  const speeds = {
    left:   0.006 + Math.random()*0.004,
    right:  0.006 + Math.random()*0.004,
    top:    0.005 + Math.random()*0.004,
    bottom: 0.007 + Math.random()*0.004,
  };
  let lastFlameTime = 0;
  burnIntervalId = setInterval(()=>{
    const now = Date.now();
    // 推进各火焰前沿
    Object.keys(fronts).forEach(edge=>{
      if(fronts[edge] < 1) fronts[edge] = Math.min(1, fronts[edge] + speeds[edge]);
    });
    // 每条边的火焰前沿位置（在纸张坐标系中）
    // left 前沿 x = pL + pW * fronts.left
    // right 前沿 x = pR - pW * fronts.right
    // top 前沿 y = pT + pH * fronts.top
    // bottom 前沿 y = pB - pH * fronts.bottom
    // 沿前沿生成火焰（间隔控制）
    if(now - lastFlameTime > 100){
      lastFlameTime = now;
      // 左前沿
      if(fronts.left < 1){
        const fx = pL + pW * fronts.left;
        const fy = pT + Math.random() * pH;
        spawnFlame(stage, fx, fy);
      }
      // 右前沿
      if(fronts.right < 1){
        const fx = pR - pW * fronts.right;
        const fy = pT + Math.random() * pH;
        spawnFlame(stage, fx, fy);
      }
      // 上前沿
      if(fronts.top < 1){
        const fx = pL + Math.random() * pW;
        const fy = pT + pH * fronts.top;
        spawnFlame(stage, fx, fy);
      }
      // 下前沿
      if(fronts.bottom < 1){
        const fx = pL + Math.random() * pW;
        const fy = pB - pH * fronts.bottom;
        spawnFlame(stage, fx, fy);
      }
    }
    // 用 clip-path 切掉已烧区域（从边缘向内）
    const cl = pW * fronts.left;
    const cr = pW * fronts.right;
    const ct = pH * fronts.top;
    const cb = pH * fronts.bottom;
    // clip-path 使用百分比（相对于元素自身）
    // paper 的左上角是 0%,0% 右下角是 100%,100%
    const clPct = (fronts.left * 100).toFixed(1);
    const crPct = (100 - fronts.right * 100).toFixed(1);
    const ctPct = (fronts.top * 100).toFixed(1);
    const cbPct = (100 - fronts.bottom * 100).toFixed(1);
    // 用多边形不规则切割（边缘有锯齿感）
    const jag = 3; // 锯齿幅度 %
    const yMid = ((parseFloat(ctPct) + parseFloat(cbPct)) / 2).toFixed(1);
    const xMid = ((parseFloat(clPct) + parseFloat(crPct)) / 2).toFixed(1);
    if(paper){
      paper.style.clipPath = `polygon(
        ${clPct+jag}% ${ctPct+jag}%,
        ${xMid}% ${(parseFloat(ctPct)-jag).toFixed(1)}%,
        ${crPct-jag}% ${ctPct+jag}%,
        ${(parseFloat(crPct)+jag).toFixed(1)}% ${yMid}%,
        ${crPct-jag}% ${cbPct-jag}%,
        ${xMid}% ${(parseFloat(cbPct)+jag).toFixed(1)}%,
        ${clPct+jag}% ${cbPct-jag}%,
        ${(parseFloat(clPct)-jag).toFixed(1)}% ${yMid}%
      )`;
      // 文字逐渐褪色
      const overall = Math.min((fronts.left + fronts.right + fronts.top + fronts.bottom) / 4, 1);
      paper.style.color = `rgba(74,58,42,${Math.max(1 - overall * 2.5, 0)})`;
    }
    // 沿前沿生成灰烬
    if(Math.random() < 0.5){
      const edges = [];
      if(fronts.left < 1) edges.push([pL + pW * fronts.left, pT + Math.random()*pH]);
      if(fronts.right < 1) edges.push([pR - pW * fronts.right, pT + Math.random()*pH]);
      if(fronts.top < 1) edges.push([pL + Math.random()*pW, pT + pH * fronts.top]);
      if(fronts.bottom < 1) edges.push([pL + Math.random()*pW, pB - pH * fronts.bottom]);
      if(edges.length > 0){
        const [ax, ay] = edges[Math.floor(Math.random()*edges.length)];
        spawnAsh(stage, ax, ay);
      }
    }
    // 判断是否全部烧完
    const allDone = fronts.left >= 0.92 && fronts.right >= 0.92 && fronts.top >= 0.92 && fronts.bottom >= 0.92;
    if(allDone){
      clearInterval(burnIntervalId); burnIntervalId = null;
      finishBurn();
    }
  }, 60);
}

function spawnAsh(container, x, y){

  ash.animate([

  ], { duration: dur * 1000, easing: 'ease-out' });
  setTimeout(()=>ash.remove(), dur * 1000);
}

// --- 阶段3→4：燃尽 → 全黑 → 治愈文案 ---
function finishBurn(){
  const stage = document.getElementById('burnStage');
  const wrap = document.getElementById('burnPaperWrap');
  const msg = document.getElementById('burnMsg');
  // 立即停止燃烧音效
  stopBurnAllSound();
  burnState = 'burnt';
  // 渐隐纸张
  if(wrap) wrap.classList.add('fading');
  // 清除所有火焰
  burnFlames.forEach(f=>{ f.style.transition='opacity 0.8s ease'; f.style.opacity='0'; setTimeout(()=>f.remove(),800); });
  burnFlames = [];
  // 继续生成余烬
  let ashCount = 0;
  if(burnAshInterval){ clearInterval(burnAshInterval); }
  burnAshInterval = setInterval(()=>{
    const rect = stage.getBoundingClientRect();
    spawnAsh(stage, rect.width/2 + (Math.random()-0.5)*100, rect.height/2);
    ashCount++;
    if(ashCount > 20){ clearInterval(burnAshInterval); burnAshInterval = null; }
  }, 150);
  // 背景变全黑
  setTimeout(()=>{
    if(stage){ stage.style.transition = 'background 1.5s ease'; stage.style.background = '#000'; }
  }, 1000);
  // 浮现治愈文案
  const msgs = ['已随风而去','灰飞烟灭，心也轻了','烦恼化为灰烬，你自由了'];
  if(msg){
    msg.textContent = msgs[Math.floor(Math.random()*msgs.length)];
    setTimeout(()=>{
      msg.style.opacity = '1';
    }, 2500);
  }
  // 显示重新开始按钮
  setTimeout(()=>{
    if(msg){
      msg.innerHTML += '<br><br><button class="burn-btn" onclick="initBurn()" style="font-size:13px;padding:8px 20px;">再来一次</button>';
    }
  }, 5000);
}

/* ============================================================
   烦恼碎纸机 — 文本框输入 → 纸张滑入碎纸机 → 细丝掉落
   ============================================================ */
let shredStripInterval = null;
let shredFeedTimeout = null;

function stopShredderAll(){
  if(shredStripInterval){ clearInterval(shredStripInterval); shredStripInterval = null; }
  if(shredFeedTimeout){ clearTimeout(shredFeedTimeout); shredFeedTimeout = null; }
}

function initShredder(){
  // 填充碎纸机牙齿
  const teeth = document.querySelector('.shredder-teeth');
  if(teeth && teeth.children.length === 0){
    for(let i=0;i<40;i++) teeth.appendChild(document.createElement('span'));
  }
  // 重置
  const machine = document.getElementById('shredderMachine');
  if(machine){ machine.style.display = 'none'; }
  const btn = document.getElementById('shredderBtn');
  if(btn){ btn.textContent = '🚮 销毁'; btn.style.pointerEvents = ''; }
}

function runShredder(){
  const input = document.getElementById('shredderInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text){ toast('写下要销毁的烦恼吧～'); return; }
  const btn = document.getElementById('shredderBtn');
  const stage = document.getElementById('shredderStage');
  const machine = document.getElementById('shredderMachine');
  if(btn) btn.style.pointerEvents = 'none';
  if(btn) btn.textContent = '销毁中...';
  // 显示碎纸机
  if(machine) machine.style.display = 'block';
  // 创建纸张
  const paper = document.createElement('div');
  paper.className = 'shred-paper';
  paper.textContent = text;
  // 限制显示长度
  if(text.length > 80) paper.textContent = text.substring(0, 80) + '...';
  stage.appendChild(paper);
  // 碎纸机音效
  try{
    const ctx = getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();
    // 机械嗡嗡声
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(80, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(60, ctx.currentTime+2.5);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime+0.1);
    gain.gain.setValueAtTime(0.12, ctx.currentTime+2);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+2.6);
    const filter = ctx.createBiquadFilter();
    filter.type='bandpass'; filter.frequency.value=100; filter.Q.value=5;
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+2.6);
    // 齿轮咔嗒声
    for(let i=0;i<20;i++){
      const t = ctx.currentTime + i*0.12 + 0.2;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type='square'; o.frequency.value=200+Math.random()*100;
      g.gain.setValueAtTime(0.04, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.03);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+0.03);
    }
  }catch(e){}
  // 开始进纸动画
  shredFeedTimeout = setTimeout(()=>{
    paper.classList.add('feeding');
    // 同时生成掉落的纸条
    const colors = ['#fafafa','#f0f0f0','#fff8e8','#e8f0ff'];
    let stripCount = 0;
    shredStripInterval = setInterval(()=>{
      // 从纸张被切碎的位置生成纸条
      const strip = document.createElement('div');
      strip.className = 'shred-strip';
      strip.style.background = colors[Math.floor(Math.random()*colors.length)];
      strip.style.height = (Math.random()*60+30)+'px';
      strip.style.left = (50 + (Math.random()-0.5)*30) + '%';
      strip.style.setProperty('--drift', ((Math.random()-0.5)*200)+'px');
      strip.style.setProperty('--rot', ((Math.random()-0.5)*720)+'deg');
      strip.style.animationDelay = '0s';
      machine.appendChild(strip);
      requestAnimationFrame(()=>strip.classList.add('falling'));
      stripCount++;
      if(stripCount > 25){
        clearInterval(shredStripInterval); shredStripInterval = null;
        // 完成
        setTimeout(()=>{
          if(btn){ btn.textContent = '🚮 再来一次'; btn.style.pointerEvents = ''; }
          toast('🗑️ 烦恼已被彻底销毁！');
        }, 2000);
      }
    }, 80);
  }, 200);
}

    <div class="ab-stage">
      <div class="ab-input-area">
        <input type="text" id="abQuestion" placeholder="写下你当下的烦恼或问题（也可不写，凭直觉翻书）">
      </div>
      <div class="ab-book-wrap" id="abBookWrap" onclick="flipAnswerBook()">
        <div class="ab-glow-ring" id="abGlowRing"></div>
        <div class="ab-book" id="abBook">
          <div class="ab-book-cover front">
            <div class="ab-book-icon">📜</div>
            <div class="ab-book-title">答案之书</div>
            <div class="ab-book-subtitle">THE BOOK OF ANSWERS</div>

        </div>
      </div>

      <div class="ab-history" id="abHistory" style="display:none;">
        <div class="ab-history-title">📜 翻阅记录</div>
        <div id="abHistoryList"></div>
      </div>
    </div>
  `);

let abFlipping = false;

function flipAnswerBook(){
  if(abFlipping) return;
  abFlipping = true;

  const book = document.getElementById('abBook');
  const reveal = document.getElementById('abReveal');
  const glow = document.getElementById('abGlowRing');
  const hint = document.getElementById('abHint');
  const answerText = document.getElementById('abAnswerText');
  const qInput = document.getElementById('abQuestion');

  // 重置
  reveal.classList.remove('show');
  glow.classList.remove('active');
  book.classList.remove('flipping');
  book.classList.remove('revealed');

  // 随机抽取答案（避免连续抽到同一个）
  let answer;
  const lastAnswer = Store.get('abLastAnswer', '');
  do {
    answer = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
  } while(answer === lastAnswer && ANSWERS.length > 1);
  Store.set('abLastAnswer', answer);

  const question = qInput.value.trim();

  // 触发翻页动画
  void book.offsetWidth; // 强制重排
  book.classList.add('flipping');
  glow.classList.add('active');

  // 动画进行中隐藏提示
  hint.style.opacity = '0';

  // 翻页动画结束后显示答案
  setTimeout(()=>{
    book.classList.remove('flipping');
    book.classList.add('revealed');
    answerText.textContent = answer;
    reveal.classList.add('show');
    hint.style.opacity = '.5';
    hint.textContent = '再次点击 → 换一个答案';

    // 记录历史
    const history = Store.get('abHistory', []);
    history.unshift({question: question || '（无问题，凭直觉翻书）', answer, date: new Date().toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});
    if(history.length > 20) history.pop();
    Store.set('abHistory', history);
    renderAnswerHistory();

    abFlipping = false;
  }, 700);
}

function renderAnswerHistory(){
  const historyEl = document.getElementById('abHistory');
  const listEl = document.getElementById('abHistoryList');
  if(!historyEl) return;
  const history = Store.get('abHistory', []);
  if(history.length === 0){
    historyEl.style.display = 'none';
    return;
  }
  historyEl.style.display = 'block';
  listEl.innerHTML = history.map(h=>`
    <div class="ab-history-item">
      <div class="ab-h-q">❓ ${escapeHtml(h.question)}</div>
      <div class="ab-h-a">📖 ${escapeHtml(h.answer)}</div>
      <div style="font-size:10px;opacity:.4;margin-top:2px;">${h.date}</div>
    </div>
  `).join('');
}

/* ============================================================
   明日盒子 — 把暂时无法解决的担忧存起来，明天再处理
   存入 → 隔天变"待处理"(金色) → 标记已解决/再延一天
   ============================================================ */
function openTomorrow(){
  const data = getTomorrowBox();
  const today = new Date().toDateString();
  const ready = data.items.filter(i=>!i.resolved && new Date(i.readyDate).toDateString() === today);
  const waiting = data.items.filter(i=>!i.resolved && new Date(i.readyDate).toDateString() !== today);
  const resolved = data.items.filter(i=>i.resolved);

  openModal(`
    <div class="modal-title"><span class="emoji">📦</span>明日盒子</div>
    <div class="modal-desc">有些事现在想不通，不是你不行，是时机不对。把它装进盒子，明天再来打开。那时候的你，可能已经有了新的答案。</div>

    <div class="tb-stage">
      <div class="tb-input-area">
        <textarea id="tbInput" placeholder="写下现在困扰你的事，明天再来看它..."></textarea>
        <button class="tb-store-btn" onclick="storeTomorrow()">📦 存进明日盒子</button>
      </div>

      <div class="tb-stats">
        <div class="tb-stat"><div class="num" style="color:var(--accent-gold)">${ready.length}</div><div class="label">今日待处理</div></div>
        <div class="tb-stat"><div class="num" style="color:var(--primary)">${waiting.length}</div><div class="label">等待中</div></div>
        <div class="tb-stat"><div class="num" style="color:var(--accent-mint)">${resolved.length}</div><div class="label">已解决</div></div>
      </div>

      ${ready.length > 0 ? `<div class="tb-section-title">🌅 今日待处理</div>` + ready.map(i=>tomorrowItemHTML(i)).join('') : ''}
      ${waiting.length > 0 ? `<div class="tb-section-title" style="margin-top:16px;">⏳ 还在等待</div>` + waiting.map(i=>tomorrowItemHTML(i)).join('') : ''}
      ${resolved.length > 0 ? `<div class="tb-section-title" style="margin-top:16px;opacity:.6;">✅ 已解决</div>` + resolved.slice(-5).map(i=>tomorrowItemHTML(i)).join('') : ''}
      ${data.items.length === 0 ? '<div class="tb-empty">📦 盒子是空的。如果有什么事今晚想不通，试着把它存起来。</div>' : ''}
    </div>
  `);
}

function getTomorrowBox(){
  return Store.get('tomorrowBox', {items:[]});
}

function setTomorrowBox(data){
  Store.set('tomorrowBox', data);
}

function tomorrowItemHTML(i){
  const today = new Date().toDateString();
  const isReady = !i.resolved && new Date(i.readyDate).toDateString() === today;
  const cls = i.resolved ? 'resolved' : (isReady ? 'ready' : '');
  const dateLabel = i.resolved ? `解决于 ${i.resolvedDate||''}` : `存入于 ${i.storedDate}`;
  let actions = '';
  if(!i.resolved){
    if(isReady){
      actions = `<div class="tb-item-actions">
        <button class="tb-action-btn resolve" onclick="resolveTomorrow(${i.id})">✅ 已解决</button>
        <button class="tb-action-btn delay" onclick="delayTomorrow(${i.id})">📦 再存一天</button>
        <button class="tb-action-btn" onclick="delTomorrow(${i.id})" style="color:var(--accent-pink);">删除</button>
      </div>`;
    } else {
      actions = `<div class="tb-item-actions">
        <button class="tb-action-btn" onclick="resolveTomorrow(${i.id})">✅ 提前解决</button>
        <button class="tb-action-btn" onclick="delTomorrow(${i.id})" style="color:var(--accent-pink);">删除</button>
      </div>`;
    }
  }
  return `<div class="tb-item ${cls}">
    <div class="tb-item-text">${escapeHtml(i.text)}</div>
    <div class="tb-item-date">${dateLabel}</div>
    ${actions}
  </div>`;
}

function storeTomorrow(){
  const input = document.getElementById('tbInput');
  const text = input.value.trim();
  if(!text){ toast('写点什么再存起来吧～'); return; }
  const data = getTomorrowBox();
  const now = new Date();
  const tomorrow = new Date(now);
  tomorrow.setDate(tomorrow.getDate() + 1);
  tomorrow.setHours(8, 0, 0, 0);
  data.items.push({
    id: Date.now(),
    text,
    storedDate: `${now.getMonth()+1}月${now.getDate()}日`,
    readyDate: tomorrow.toISOString(),
    resolved: false,
    resolvedDate: null
  });
  setTomorrowBox(data);
  toast('📦 已存进明日盒子。明早8点后可以打开看。');
  openTomorrow();
  checkReward('tomorrow');
}

function resolveTomorrow(id){
  const data = getTomorrowBox();
  const item = data.items.find(i=>i.id===id);
  if(item){
    item.resolved = true;
    const now = new Date();
    item.resolvedDate = `${now.getMonth()+1}月${now.getDate()}日`;
    setTomorrowBox(data);
    toast('✅ 太好了，这件事过去了。');
    openTomorrow();
  }
}

function delayTomorrow(id){
  const data = getTomorrowBox();
  const item = data.items.find(i=>i.id===id);
  if(item){
    const d = new Date(item.readyDate);
    d.setDate(d.getDate() + 1);
    item.readyDate = d.toISOString();
    setTomorrowBox(data);
    toast('📦 再存一天。不急，慢慢来。');
    openTomorrow();
  }
}

function delTomorrow(id){
  const data = getTomorrowBox();
  data.items = data.items.filter(i=>i.id!==id);
  setTomorrowBox(data);
  openTomorrow();
}

  document.querySelectorAll('.db-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.db-tab-content').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='throw') document.getElementById('dbThrow').classList.add('active');
  if(tab==='pickup') document.getElementById('dbPickup').classList.add('active');

function throwDriftBottle(){
  const text = document.getElementById('dbThrowText').value.trim();
  if(!text){ toast('写点什么再投出去吧～'); return; }

  const btn = document.getElementById('dbThrowBtn');
  const textarea = document.getElementById('dbThrowText');
  const bottleAnim = document.getElementById('dbBottleAnim');
  const replyOverlay = document.getElementById('dbReplyOverlay');
  const replyText = document.getElementById('dbReplyText');

  btn.disabled = true;
  textarea.value = '';
  textarea.style.opacity = '0.3';
  replyOverlay.classList.remove('show');

  // 瓶子漂远动画
  bottleAnim.classList.remove('show');
  void bottleAnim.offsetWidth;
  bottleAnim.classList.add('show');

  // 海浪音效
  try{
    const ctx = getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(420, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime+2);
    gain.gain.setValueAtTime(0.07, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+2);
    const filter = ctx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=500;
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+2);
  }catch(e){}

  // 记录投放
  const data = getDriftData();
  data.thrown.push({text, date: new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}), id:Date.now()});
  if(data.thrown.length > 20) data.thrown = data.thrown.slice(-20);
  setDriftData(data);

  // 瓶子漂远后浮现远方回信
  setTimeout(()=>{
    const reply = DRIFT_REPLIES[Math.floor(Math.random()*DRIFT_REPLIES.length)];
    replyText.textContent = reply;
    replyOverlay.classList.add('show');

    // 记录回信
    const d2 = getDriftData();
    d2.replies.push({text:reply, date: new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});
    if(d2.replies.length > 20) d2.replies = d2.replies.slice(-20);
    setDriftData(d2);
    renderDbHistory();
    checkReward('driftbottle');
  }, 5000);

  // 恢复
  setTimeout(()=>{
    bottleAnim.classList.remove('show');
    replyOverlay.classList.remove('show');
    btn.disabled = false;
    textarea.style.opacity = '';
  }, 10000);
}

function renderDbHistory(){
  const el = document.getElementById('dbHistory');
  if(!el) return;
  const data = getDriftData();
  if(data.thrown.length === 0 && data.replies.length === 0 && data.picked.length === 0 && data.replied.length === 0){
    el.innerHTML = '';
    return;
  }
  let html = '<div class="db-history-title">📜 漂流记录</div>';

  if(data.replies.length > 0){
    html += '<div style="font-size:12px;font-weight:600;color:var(--accent-sky);margin-bottom:6px;">📮 收到的回信</div>';
    html += data.replies.slice(-3).reverse().map(r=>`

        <div class="db-h-label">📮 远方回信</div>
        <div>${escapeHtml(r.text)}</div>
        <div style="font-size:10px;opacity:.4;margin-top:2px;">${r.date}</div>
      </div>

    html += data.picked.slice(-3).reverse().map(p=>`
      <div class="db-history-item">
        <div class="db-h-label">📮 别人的心事</div>
        <div>${escapeHtml(p.msg)}</div>
        <div style="font-size:10px;opacity:.4;margin-top:2px;">${p.date}</div>
      </div>
    `).join('');
  }

  if(data.replied.length > 0){
    html += '<div style="font-size:12px;font-weight:600;color:var(--accent-mint);margin:10px 0 6px;">🌊 我送出的回信</div>';
    html += data.replied.slice(-3).reverse().map(r=>`
      <div class="db-history-item">
        <div class="db-h-label">🌊 我的回信</div>
        <div>${escapeHtml(r.reply)}</div>
        <div style="font-size:10px;opacity:.4;margin-top:2px;">${r.date}</div>
      </div>
    `).join('');
  }

  el.innerHTML = html;
}

/* ============================================================
   压力变形记 — CBT 认知改写：0%灾难化 → 50%客观化 → 100%成长型
   滑块控制三态切换：视觉+音效+文字重组
   ============================================================ */
let tfTimer = null;
let tfSoundNodes = [];

function stopTfAll(){
  if(tfTimer){ clearInterval(tfTimer); tfTimer = null; }
  tfSoundNodes.forEach(n=>{ try{n.stop&&n.stop();}catch(e){} try{n.disconnect&&n.disconnect();}catch(e){} });
  tfSoundNodes = [];
}

function openTransformer(){
  stopTfAll();
  openModal(`
    <div class="modal-title"><span class="emoji">🔄</span>压力变形记</div>
    <div class="modal-desc">写下你的压力，然后拖动滑块，看着它从灾难化思维一步步被改写为建设性思维。这是认知行为疗法（CBT）的核心：改变想法，就能改变感受。</div>
    <input type="text" class="tf-input" id="tfInput" placeholder="例如：明天数学考不及格怎么办" maxlength="60">
    <button class="tf-start-btn" onclick="startTransformer()">开始改写 →</button>
    <div id="tfContent" style="display:none;">
      <div class="tf-stage" id="tfStage" data-level="0">
        <div class="tf-particles" id="tfParticles"></div>
        <div class="tf-text" id="tfText"></div>
      </div>
      <div class="tf-slider-wrap">
        <input type="range" id="tfSlider" min="0" max="100" value="0" step="1" oninput="onTfSlider(this.value)">
        <div class="tf-labels">
          <span>0% 灾难化</span>
          <span>50% 客观化</span>
          <span>100% 成长型</span>
        </div>
      </div>
      <button class="tf-restart" onclick="openTransformer()">重新开始</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('tfInput')?.focus(), 350);
}

function startTransformer(){
  const input = document.getElementById('tfInput');
  const text = input.value.trim();
  if(!text){ toast('写下你的压力再开始～'); return; }
  document.getElementById('tfInput').style.display = 'none';
  document.querySelector('.tf-start-btn').style.display = 'none';
  document.getElementById('tfContent').style.display = 'block';
  // 初始文字（灾难化版本）
  const t0 = text.replace(/[?？!！。.,，]$/,'') + '，我太差劲了，一切都完了。';
  document.getElementById('tfText').textContent = t0;
  // 存储
  window._tfBaseText = text;
  window._tfLevel = 0;
  updateTfStage(0);
  startTfSound(0);
}

function onTfSlider(val){
  const v = parseInt(val);
  const base = window._tfBaseText || '';
  // 从用户输入中提取核心事件描述
  const baseClean = base.replace(/[?？!！。.,，]$/,'');
  // 去掉结尾的疑问/感叹语气词，得到纯粹的事件描述
  let event = baseClean
    .replace(/怎么办$/,'')
    .replace(/(会不会|会不会|是不是|能不能)$/,'')
    .replace(/(了吧|的了|了呢|了吗|吗|呢|吧|啊|呀|嘛)$/,'')
    .replace(/我/g,'')
    .trim();
  if(!event) event = baseClean;  // fallback
  let level = 0;
  if(v <= 20) level = 0;
  else if(v <= 70) level = 1;
  else level = 2;
  // 基于用户输入内容生成各阶段改写文字
  let displayText = '';
  if(v <= 20){
    // 0% 灾难化：直接显示用户原文
    displayText = baseClean + '。';
  } else if(v < 45){
    // 过渡：灾难化 → 客观化（自我质疑）
    displayText = baseClean + '...不过，真的会那么糟吗？';
  } else if(v < 60){
    // 50% 客观化：把灾难化表达变为客观陈述
    displayText = '客观地说，' + event + '这件事确实有难度，紧张是合理的反应。';
  } else if(v < 85){
    // 过渡：客观化 → 成长型
    displayText = event + '让我焦虑，但我已经挺过了很多比这更难的事，这次也不会例外。';
  } else {
    // 100% 成长型：把困难重新定义为成长机会
    displayText = '说到底，' + event + '会过去的。留下的不是这件事本身，而是我从中获得的成长。';
  }
  // 更新文字（带过渡动画）
  const textEl = document.getElementById('tfText');
  const stage = document.getElementById('tfStage');
  if(level !== window._tfLevel){
    // 等级变化 → 切换音效
    window._tfLevel = level;
    updateTfStage(level);
    stopTfAll();
    startTfSound(level);
    // 文字粒子化重组
    textEl.style.opacity = '0';
    textEl.style.transform = 'scale(0.8)';
    setTimeout(()=>{
      textEl.textContent = displayText;
      textEl.style.opacity = '1';
      textEl.style.transform = 'scale(1)';
    }, 300);
    // 粒子效果
    tfBurstParticles(stage, level);
  } else {
    // 同等级内文字微调
    textEl.style.opacity = '0';
    setTimeout(()=>{
      textEl.textContent = displayText;
      textEl.style.opacity = '1';
    }, 200);
  }
}

function updateTfStage(level){
  const stage = document.getElementById('tfStage');
  if(!stage) return;
  stage.setAttribute('data-level', level);
}

// 等级切换时的粒子爆发
function tfBurstParticles(stage, level){
  const container = document.getElementById('tfParticles');
  if(!container) return;
  const count = level === 0 ? 15 : level === 1 ? 30 : 40;
  const colors = level === 0
    ? ['#666','#555','#444','#aaa']
    : level === 1
    ? ['#718096','#4fd1c5','#a0c4dd','#b0c4de']
    : ['#ffd700','#f6ad55','#fc8181','#ffe8aa','#98fb98'];
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'tf-particle';
    const size = Math.random()*6+3;
    p.style.width = size+'px'; p.style.height = size+'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.left = (Math.random()*100)+'%';
    p.style.top = (Math.random()*60+20)+'%';
    p.style.opacity = '0';
    p.style.transition = 'all 1.5s ease';
    container.appendChild(p);
    requestAnimationFrame(()=>{
      p.style.opacity = '0.8';
      p.style.transform = `translate(${(Math.random()-0.5)*200}px, ${-Math.random()*150-50}px) scale(0.3)`;
    });
    setTimeout(()=>p.remove(), 1600);
  }
}

// 不同等级的背景音效
function startTfSound(level){
  try{
    const ctx = getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();
    if(level === 0){
      // 沉闷的低频心跳声
      let beat = 0;
      tfTimer = setInterval(()=>{
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(60, t);
        o.frequency.exponentialRampToValueAtTime(30, t+0.15);
        g.gain.setValueAtTime(0.25, t);
        g.gain.exponentialRampToValueAtTime(0.001, t+0.3);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(t+0.3);
        beat++;
        if(beat % 2 === 1){
          // 第二次心跳
          const o2 = ctx.createOscillator();
          const g2 = ctx.createGain();
          o2.type='sine'; o2.frequency.setValueAtTime(50,t+0.15);
          g2.gain.setValueAtTime(0.15, t+0.15);
          g2.gain.exponentialRampToValueAtTime(0.001, t+0.35);
          o2.connect(g2); g2.connect(ctx.destination);
          o2.start(t+0.15); o2.stop(t+0.35);
        }
      }, 1200);
    } else if(level === 1){
      // 冰块融化 / 水滴声
      let drop = 0;
      tfTimer = setInterval(()=>{
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type='sine';
        const freq = 600 + Math.random()*400;
        o.frequency.setValueAtTime(freq, t);
        o.frequency.exponentialRampToValueAtTime(freq*0.5, t+0.08);
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(t+0.15);
        drop++;
      }, 800);
    } else if(level === 2){
      // 清脆风铃声
      const notes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5]; // C5 D5 E5 G5 A5 C6
      let idx = 0;
      tfTimer = setInterval(()=>{
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type='sine';
        o.frequency.value = notes[idx % notes.length];
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.15, t+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t+1.5);
        const filter = ctx.createBiquadFilter();
        filter.type='lowpass'; filter.frequency.value=3000;
        o.connect(filter); filter.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(t+1.5);
        // 谐波
        const o2 = ctx.createOscillator();
        const g2 = ctx.createGain();
        o2.type='sine'; o2.frequency.value = notes[idx % notes.length]*3;
        g2.gain.setValueAtTime(0, t);
        g2.gain.linearRampToValueAtTime(0.03, t+0.02);
        g2.gain.exponentialRampToValueAtTime(0.001, t+0.8);
        o2.connect(g2); g2.connect(ctx.destination);
        o2.start(); o2.stop(t+0.8);
        idx++;
      }, 700);
    }
  }catch(e){}
}
