function openTarot(){
  tarotRevealed = false;
  // Create overlay
  if(tarotOverlayEl) tarotOverlayEl.remove();
  tarotOverlayEl = document.createElement('div');
  tarotOverlayEl.className = 'tarot-overlay';
  // Generate stars
  let starsHtml = '';
  for(let i=0; i<60; i++){
    const x = Math.random()*100, y = Math.random()*100;
    const dur = 2 + Math.random()*4;
    const delay = Math.random()*3;
    starsHtml += `<div class="tarot-star" style="left:${x}%;top:${y}%;--dur:${dur}s;animation-delay:${delay}s;"></div>`;
  }
  // Shuffle texts and pick 3
  const shuffled = [...tarotTexts].sort(()=>Math.random()-0.5);
  const picked = shuffled.slice(0, 3);
  const symbols = ['🌙','⭐','🔮','💫','🪐','✨','🌊','🌠','🗝️','🦋'];
  tarotOverlayEl.innerHTML = `
    <div class="tarot-bg-glow">
      <div class="tarot-aurora tarot-aurora-1"></div>
      <div class="tarot-aurora tarot-aurora-2"></div>
      <div class="tarot-aurora tarot-aurora-3"></div>
    </div>
    <div class="tarot-stars">${starsHtml}</div>
    <div class="tarot-particles" id="tarotParticles"></div>
    <button class="tarot-close" onclick="closeTarot()">✕</button>
    <div class="tarot-title">解忧塔罗</div>
    <div class="tarot-subtitle">静心凝视三张牌，选一张翻开 — 宇宙有话对你说</div>
    <div class="tarot-cards" id="tarotCards">
      ${picked.map((text, i) => {
        const sym = symbols[Math.floor(Math.random()*symbols.length)];
        return `<div class="tarot-card" data-idx="${i}" onclick="flipTarotCard(${i})">
          <div class="tarot-card-face tarot-card-back">
            <div class="tarot-card-back-glow"></div>
            <div class="tarot-card-back-symbol">${sym}</div>
            <div class="tarot-card-back-text">COSMIC ORACLE</div>
          </div>
          <div class="tarot-card-face tarot-card-front">
            <div class="tarot-card-front-text">${text}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="tarot-reveal-text" id="tarotReveal"></div>
  `;
  document.body.appendChild(tarotOverlayEl);
  requestAnimationFrame(()=>tarotOverlayEl.classList.add('active'));
  // Store picked texts
  tarotOverlayEl.dataset.texts = JSON.stringify(picked);
}

function flipTarotCard(idx){
  if(tarotRevealed) return;
  tarotRevealed = true;
  const cards = tarotOverlayEl.querySelectorAll('.tarot-card');
  cards.forEach((c, i) => {
    if(i === idx){
      c.classList.add('flipped');
      // Spawn stardust particles
      spawnTarotParticles(c);
    } else {
      c.classList.add('faded');
    }
  });
  // Show reveal text
  const texts = JSON.parse(tarotOverlayEl.dataset.texts);
  const reveal = document.getElementById('tarotReveal');
  if(reveal){
    reveal.innerHTML = `<p>${texts[idx]}</p><button class="tarot-restart" onclick="resetTarot()">再抽一次</button>`;
    setTimeout(()=>reveal.classList.add('show'), 600);
  }
}

function spawnTarotParticles(card){
  const container = document.getElementById('tarotParticles');
  if(!container || !card) return;
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  for(let i=0; i<30; i++){
    const p = document.createElement('div');
    p.className = 'tarot-particle';
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.position = 'fixed';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 100;
    p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
    p.style.setProperty('--dur', (1 + Math.random()*1.5) + 's');
    p.style.width = (2 + Math.random()*3) + 'px';
    p.style.height = p.style.width;
    p.style.background = ['rgba(180,200,255,0.8)','rgba(200,180,255,0.7)','rgba(255,220,180,0.6)'][Math.floor(Math.random()*3)];
    container.appendChild(p);
    setTimeout(()=>{ if(p.parentNode) p.remove(); }, 2500);
  }
}

function resetTarot(){
  tarotRevealed = false;
  if(tarotOverlayEl) tarotOverlayEl.remove();
  tarotOverlayEl = null;
  openTarot();
}

function closeTarot(){
  if(tarotOverlayEl){
    tarotOverlayEl.classList.remove('active');
    setTimeout(()=>{
      if(tarotOverlayEl){ tarotOverlayEl.remove(); tarotOverlayEl = null; }
    }, 600);
  }
  tarotRevealed = false;
}

function stopTarotAll(){
  if(tarotOverlayEl){ tarotOverlayEl.remove(); tarotOverlayEl = null; }
  tarotRevealed = false;
}

const REDEEM_CODES = {

function applyRedeemCode(){
  const input = document.getElementById('redeemInput');
  if(!input) return;
  const code = input.value.trim().toLowerCase();
  if(!code){ toast('请输入兑换码'); return; }

  // 检查是否已经用过
  const used = Store.get('usedRedeemCodes', []);
  if(used.includes(code)){ toast('这个兑换码已经用过啦～'); return; }

  const item = REDEEM_CODES[code];
  if(!item){ toast('兑换码无效，再检查一下吧'); return; }

  if(item.type === 'unlock-all'){
    // 只标记为已拥有（在商店显示"已拥有"），不自动激活任何主题/特效
    // 让用户自己选择想用哪个，保持界面原样不变，也不额外送星
    const owned = getOwned();
    shopItems.forEach(s => {
      if(!owned.includes(s.id)) owned.push(s.id);
    });
    setOwned(owned);

    // 标记已使用
    used.push(code);
    Store.set('usedRedeemCodes', used);

    toast(`🎉 兑换成功！全部商品已解锁，去商店挑选想用的吧～`, 4000);
  }

  input.value = '';
  renderShop();
  renderRewards();
  updateStarDisplay();
}

function getStars(){ return Store.get('checkin',{}).total || 0; }
function getOwned(){ return Store.get('ownedItems', []); }
function setOwned(arr){ Store.set('ownedItems', arr); }

function isOwned(id){
  const owned = getOwned();
  if(owned.includes(id)) return true;
  // 全面升级后自动拥有所有
  if(owned.includes('upgrade-full')){
    const item = shopItems.find(s=>s.id===id);
    return item && item.cat !== 'function'; // 功能性商品不自动解锁
  }
  return false;
}

function buyItem(id){
  const item = shopItems.find(s=>s.id===id);
  if(!item) return;
  const owned = getOwned();
  if(isOwned(id)){ toast('已经拥有啦～'); return; }
  const stars = getStars();
  if(stars < item.price){ toast(`星星不够哦，还差${item.price - stars}⭐`); return; }

  // 扣星
  const checkinData = Store.get('checkin', {});
  checkinData.total -= item.price;
  Store.set('checkin', checkinData);

  // 记录已购买
  owned.push(id);
  setOwned(owned);

  toast(`购买成功！「${item.name}」已解锁 ✨`, 3000);
  applyShopEffect(id);
  renderShop();
  renderRewards();
}

// 粒子特效
let particleCanvas = null;
let particleAnimId = null;
function applyEffect(effectId){
  Store.set('activeEffect', effectId);
  startParticleEffect();
}

function stopParticleEffect(){
  if(particleAnimId){ cancelAnimationFrame(particleAnimId); particleAnimId = null; }
  if(particleCanvas){ particleCanvas.remove(); particleCanvas = null; }
}

function startParticleEffect(){
  stopParticleEffect();
  const effectId = Store.get('activeEffect', null);
  if(!effectId) return;

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;opacity:.6;';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  particleCanvas = canvas;

  const ctx = canvas.getContext('2d');
  const particles = [];
  const count = 40;

  const configs = {
    'fx-firefly': {color:'#fbbf24', size:2, speed:0.3, drift:0.1, glow:true, shape:'circle'},
    'fx-sakura': {color:'#fb7185', size:4, speed:1, drift:0.5, glow:false, shape:'petal'},
    'fx-snow': {color:'#ffffff', size:3, speed:0.8, drift:0.3, glow:false, shape:'circle'},
    'fx-bubble': {color:'rgba(255,255,255,0.3)', size:8, speed:0.5, drift:0.2, glow:false, shape:'circle'},
    'fx-starfall': {color:'#fbbf24', size:2, speed:3, drift:0, glow:true, shape:'line', rare:true},
  };
  const cfg = configs[effectId] || configs['fx-firefly'];

  function spawn(){
    return {
      x: Math.random() * canvas.width,
      y: cfg.rare ? -20 : Math.random() * canvas.height,
      vx: (Math.random()-0.5) * cfg.drift,
      vy: cfg.speed * (0.5 + Math.random()*0.8),
      size: cfg.size * (0.5 + Math.random()),
      alpha: Math.random() * 0.5 + 0.3,
      life: 0,
    };
  }

  for(let i=0; i<count; i++) particles.push(spawn());

  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(let i=particles.length-1; i>=0; i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life++;

      if(p.y > canvas.height + 20 || p.x < -20 || p.x > canvas.width + 20){
        if(cfg.rare && Math.random() > 0.02){ particles.splice(i,1); continue; }
        particles[i] = spawn();
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.alpha;

      if(cfg.glow){
        ctx.shadowBlur = 8;
        ctx.shadowColor = cfg.color;
      }

      ctx.fillStyle = cfg.color;

      if(cfg.shape === 'line'){
        // 流星
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx*8, p.y - p.vy*8);
        ctx.stroke();
      } else if(cfg.shape === 'petal'){
        // 花瓣
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.life*0.02, 0, Math.PI*2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    particleAnimId = requestAnimationFrame(draw);
  }
  draw();

  window.addEventListener('resize', ()=>{
    if(particleCanvas){ particleCanvas.width = window.innerWidth; particleCanvas.height = window.innerHeight; }
  });
}

      <div id="checkinInfo"></div>
    </div>
  `);
  renderRewards();
  renderShop();
  renderCheckinInfo();
}

function switchRewardTab(tab, btn){
  document.querySelectorAll('.reward-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.reward-tab-content').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='achievements') document.getElementById('tabAchievements').classList.add('active');
  if(tab==='shop') document.getElementById('tabShop').classList.add('active');
  if(tab==='checkin') { document.getElementById('tabCheckin').classList.add('active'); renderCheckinInfo(); }
}

function renderRewards(){
  const el = document.getElementById('rewardGrid');
  if(!el) return;
  const achieved = rewards.filter(r=>r.check()).length;
  el.innerHTML = rewards.map(r=>{
    const done = r.check();
    return `<div class="reward-item${done?' achieved':' locked'}">
      ${done?'<span class="check">✅</span>':''}
      <div class="icon">${r.icon}</div>
      <div class="name">${r.name}</div>
      <div class="desc">${r.desc}</div>
    </div>`;
  }).join('');
  const desc = document.querySelector('.modal-desc');
  const balance = document.querySelector('.reward-balance');
  if(balance){
    balance.innerHTML = `⭐ ${getStars()} 颗星 | 成就解锁 ${achieved}/${rewards.length} | 🛍️ 已解锁 ${getOwned().length} 件商品`;
  }
}

function renderShop(){
  const el = document.getElementById('shopGrid');
  if(!el) return;
  const stars = getStars();

  // 分类标签
  const cats = [
    {id:'theme', label:'🎨 主题皮肤'},
    {id:'effect', label:'✨ 粒子特效'},
    {id:'avatar', label:'😊 头像'},
    {id:'function', label:'⚡ 功能增强'},
  ];

  let html = '';

  // 全面升级卡（置顶）
  const upgradeItem = shopItems.find(s=>s.isUpgrade);
  const upgradeOwned = isOwned(upgradeItem.id);
  html += `<div class="shop-item upgrade">
    <div class="shop-icon">${upgradeItem.icon}</div>
    <div class="shop-info">
      <div class="shop-name">${upgradeItem.name}</div>
      <div class="shop-desc">${upgradeItem.desc}</div>
      <div class="shop-preview-bar">
        ${shopItems.filter(s=>s.cat==='theme').map(s=>`<span class="${isOwned(s.id)||upgradeOwned?'on':''}">${s.icon}</span>`).join('')}
        ${shopItems.filter(s=>s.cat==='effect').map(s=>`<span class="${isOwned(s.id)||upgradeOwned?'on':''}">${s.icon}</span>`).join('')}
        ${shopItems.filter(s=>s.cat==='avatar').map(s=>`<span class="${isOwned(s.id)||upgradeOwned?'on':''}">${s.icon}</span>`).join('')}
      </div>
    </div>
    <div>
      <div class="shop-price">${upgradeItem.price}⭐</div>
      <button class="shop-buy-btn" onclick="buyItem('${upgradeItem.id}')" ${upgradeOwned?'disabled':''}>${upgradeOwned?'已解锁 ✓':'购买'}</button>
    </div>
  </div>`;

  // 分类商品
  const activeMap = {'theme':Store.get('activeTheme',null),'effect':Store.get('activeEffect',null),'avatar':Store.get('activeAvatar',null)};
  for(const cat of cats){
    const items = shopItems.filter(s=>s.cat===cat.id && !s.isUpgrade);
    if(items.length === 0) continue;
    html += `<div style="grid-column:1/-1;font-size:14px;font-weight:700;margin:8px 0 4px;opacity:.8;">${cat.label}</div>`;
    for(const item of items){
      const owned = isOwned(item.id);
      const canAfford = stars >= item.price;
      const isUsing = owned && activeMap[item.cat] === item.id;
      let btn;
      if(!owned){
        btn = `<button class="shop-buy-btn" onclick="buyItem('${item.id}')" ${canAfford?'':'disabled'}>${canAfford?'购买':'星星不足'}</button>`;
      } else if(item.cat==='theme' || item.cat==='effect' || item.cat==='avatar'){
        btn = isUsing
          ? `<button class="shop-buy-btn using" disabled>已使用 ✓</button>`
          : `<button class="shop-buy-btn equip" onclick="equipItem('${item.id}')">使用</button>`;
      } else {
        btn = `<button class="shop-buy-btn" disabled>已拥有 ✓</button>`;
      }
      html += `<div class="shop-item${owned?' owned':''}${isUsing?' using':''}">
        <div class="shop-icon">${item.icon}</div>
        <div class="shop-name">${item.name}</div>
        <div class="shop-desc">${item.desc}</div>
        <div class="shop-price">${item.price}⭐</div>
        ${btn}
      </div>`;
    }
  }
  el.innerHTML = html;
}

function renderCheckinInfo(){
  const el = document.getElementById('checkinInfo');
  if(!el) return;
  const data = Store.get('checkin', {streak:0, total:0, bestStreak:0, totalDays:0});
  const milestones = [7, 14, 21, 30, 50, 100];
  const nextMilestone = milestones.find(m=>m > data.streak) || 100;
  const prevMilestone = milestones.filter(m=>m <= data.streak).pop() || 0;
  const progress = nextMilestone === prevMilestone ? 100 : Math.round(((data.streak - prevMilestone) / (nextMilestone - prevMilestone)) * 100);

  const bonusTable = [
    {day:7, bonus:20},
    {day:14, bonus:50},
    {day:21, bonus:60},
    {day:30, bonus:100},
    {day:50, bonus:200},
    {day:100, bonus:500},
  ];

  const todayBase = 5 + Math.min(data.streak, 10);
  const isDouble = Store.get('doubleStarsUntil', 0) > Date.now();

  el.innerHTML = `
    <div class="streak-progress">
      <div class="sp-row"><span>当前连签</span><span style="font-weight:700;color:var(--primary)">${data.streak} 天 🔥</span></div>
      <div class="sp-row"><span>历史最长</span><span>${data.bestStreak||0} 天</span></div>
      <div class="sp-row"><span>累计签到</span><span>${data.totalDays||0} 天</span></div>
      <div class="sp-bar"><div class="sp-fill" style="width:${progress}%"></div></div>
      <div class="streak-milestones">
        ${milestones.map(m=>`<span style="${m<=data.streak?'color:var(--primary);font-weight:700;':''}">${m}天</span>`).join('')}
      </div>
    </div>
    <div style="background:var(--bg-1);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;">🎁 连签奖励表</div>
      <div style="font-size:12px;line-height:2;">
        ${bonusTable.map(b=>`<div style="display:flex;justify-content:space-between;${b.day<=data.streak?'color:var(--primary);font-weight:600;':''}">
          <span>连签 ${b.day} 天</span><span>+${b.bonus}⭐ 额外奖励 ${b.day<=data.streak?'✓':''}</span>
        </div>`).join('')}
      </div>
    </div>
    <div style="background:var(--bg-1);border-radius:var(--radius-sm);padding:16px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;">📊 今日预览</div>
      <div style="font-size:13px;line-height:1.8;">
        基础奖励：<b>${todayBase}⭐</b><br>
        ${isDouble ? `<span style="color:var(--primary);">⚡ 双倍星星卡生效中！实际可获得 ${todayBase*2}⭐</span><br>` : ''}
        下个里程碑：连签 ${nextMilestone} 天 → 额外 +${bonusTable.find(b=>b.day===nextMilestone)?.bonus||0}⭐
      </div>
    </div>
  `;
}

/* ---------- Boot ---------- */
(function(){
  // 一次性清理：旧版兑换码曾错误激活了深色主题皮肤，这里检测并清除
  if(!Store.get('themeCleanup_v2', false)){
    Store.set('activeTheme', null);
    Store.set('themeCleanup_v2', true);
  }

  const visited = Store.get('visited', false);
  if(visited){
    // Re-apply mature theme if previously selected
    if(Store.get('matureTheme', false)){
      document.body.classList.add('mature-theme');
    }
    document.getElementById('welcomeLanding').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    initApp();
    updateThemeToggleBtn();
  }

  // ===== 全局点击涟漪效果 =====
  let rippleThrottle = 0;  // 节流，避免高频点击产生过多元素
  function spawnRipple(x, y){
    const ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.left = x+'px';
    ripple.style.top = y+'px';
    document.body.appendChild(ripple);
    // 涟漪声效
    try{
      const ctx = getAudioCtx();
      if(ctx.state==='suspended') ctx.resume();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(800, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(200, ctx.currentTime+0.15);
      g.gain.setValueAtTime(0.06, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.15);
      const filter = ctx.createBiquadFilter();
      filter.type='lowpass'; filter.frequency.value=2000;
      o.connect(filter); filter.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+0.15);
    }catch(e){}
    setTimeout(()=>ripple.remove(), 1500);
  }
  document.addEventListener('click', (e)=>{
    // 忽略表单元素、滑块、输入框内部的点击
    const tag = e.target.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
    if(e.target.type==='range') return;
    if(e.target.classList.contains('noise-vol')) return;
    // 节流：最多每 80ms 一个
    const now = Date.now();
    if(now - rippleThrottle < 80) return;
    rippleThrottle = now;
    spawnRipple(e.clientX, e.clientY);
  });
})();
</script>
<script>
/* ===== PWA：注册 Service Worker（支持离线与"添加到手机桌面"） =====
 * 注意：浏览器只会在 http://localhost 或 https 上注册 SW。
 * 若直接双击打开 HTML（file:// 协议）则不会注册，需通过本地服务或上线后生效。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js')
      .then(function (reg) { console.log('SW 注册成功，作用域：' + reg.scope + '，当前版本 v1'); })
      .catch(function (err) { console.warn('SW 注册失败：', err); });
  });
}

/* ===== PWA：安装到桌面 提示按钮 =====
 * 说明：安卓 Chrome / 桌面 Chrome 支持 beforeinstallprompt，字体满足后可弹"安装"；
 * iOS Safari 没有该事件，需引导用户用 分享 → 添加到主屏幕。 */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
let deferredPrompt = null;
function pwaShowBtn(){ const b = document.getElementById('pwaInstallBtn'); if(b) b.style.display = 'flex'; }
function pwaHideBtn(){ const b = document.getElementById('pwaInstallBtn'); if(b) b.style.display = 'none'; }
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredPrompt = e;
  pwaShowBtn();
});
function installPwa(){
  if (!deferredPrompt && isIOS) {
    // iOS 无程序化安装，给出引导
    alert('📲 请点击浏览器底部的「分享」图标，然后选择「添加到主屏幕」，即可像 App 一样使用解压星球。');
    return;
  }
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function (choice) {
      if (choice.outcome === 'accepted') { toast('已添加到桌面 🎉'); }
      else { toast('已取消安装'); }
      deferredPrompt = null;
      pwaHideBtn();
    });
  }
}
// iOS：页面加载后显示安装入口（点击则引导到分享菜单）
if (isIOS) {
  window.addEventListener('load', function () { setTimeout(pwaShowBtn, 800); });
}
</script>
