.chat-msg.self .c-avatar{background:rgba(255,255,255,.3);}
.chat-msg .c-body{display:flex;flex-direction:column;gap:4px;}
.chat-msg.self .c-body{align-items:flex-end;}
.chat-msg .c-name{font-size:11px;color:var(--text-sub);padding:0 6px;}
.chat-msg .c-bubble{padding:10px 14px;background:#fff;border-radius:14px;border-top-left-radius:4px;font-size:14px;line-height:1.5;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.chat-msg.self .c-bubble{background:var(--primary);color:#fff;border-top-left-radius:14px;border-top-right-radius:4px;}
.chat-msg.system{justify-content:center;max-width:100%;width:100%;}
.chat-msg.system .c-bubble{background:rgba(108,142,239,.1);color:var(--text-sub);font-size:12px;border-radius:12px;padding:6px 14px;}
.chat-input-area{padding:12px 16px;
  background:rgba(255,255,255,0.25);backdrop-filter:blur(15px) saturate(180%);-webkit-backdrop-filter:blur(15px) saturate(180%);
  border-top:1px solid rgba(255,255,255,0.35);display:flex;gap:10px;align-items:center;
}
.chat-input-area input{flex:1;padding:10px 16px;
  background:rgba(255,255,255,0.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.5);border-radius:24px;font-size:14px;outline:none;font-family:inherit;transition:var(--transition);color:var(--text-main);
}
.chat-input-area input:focus{border-color:rgba(108,142,239,0.5);box-shadow:0 0 0 4px rgba(108,142,239,0.1);background:rgba(255,255,255,0.55);}
.chat-input-area button{width:40px;height:40px;
  background:rgba(108,142,239,0.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(108,142,239,0.45);color:var(--primary-dark);border-radius:50%;font-size:18px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;
}
.chat-input-area button:hover{transform:scale(1.1);background:rgba(108,142,239,0.45);}
.chat-input-area button:active{transform:scale(0.95);}
.chat-input-area button:disabled{opacity:.5;transform:none;cursor:not-allowed;}

/* 在线用户 */
.online-users-bar{padding:8px 16px;
  background:rgba(255,255,255,0.2);backdrop-filter:blur(10px) saturate(180%);-webkit-backdrop-filter:blur(10px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,0.3);display:flex;gap:8px;overflow-x:auto;
}
.online-user{display:flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;
  background:rgba(255,255,255,0.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.5);border-radius:12px;white-space:nowrap;flex-shrink:0;
  color:var(--text-main);
}
.online-user .dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;}

/* 加载状态 */
.loading{text-align:center;padding:20px;color:var(--text-sub);font-size:14px;}
.loading::after{content:'...';animation:dots 1.5s infinite;}
@keyframes dots{0%,20%{content:'.';}40%{content:'..';}60%,100%{content:'...';}}

/* ===== Professional Help ===== */
.help-list{display:flex;flex-direction:column;gap:12px;}
.help-item{display:flex;align-items:center;gap:14px;padding:16px;
  background:rgba(255,255,255,0.25);backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);
  border:1px solid rgba(255,255,255,0.4);border-radius:16px;transition:var(--transition);
  box-shadow:0 2px 8px rgba(108,142,239,0.08), 0 1px 4px rgba(255,255,255,0.3) inset;
}
.help-item:hover{background:rgba(255,255,255,0.35);transform:translateX(4px);border-color:rgba(255,255,255,0.55);}
.help-item .icon{font-size:32px;flex-shrink:0;}
.help-item .info h4{font-size:15px;font-weight:700;margin-bottom:2px;}
.help-item .info p{font-size:13px;color:var(--text-sub);}
.help-item .phone{font-size:18px;font-weight:800;color:var(--primary);margin-left:auto;}

/* ===== Reward Center ===== */
.reward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.reward-item{
  background:rgba(255,255,255,0.25);backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);
  border:1px solid rgba(255,255,255,0.4);border-radius:20px;padding:20px 12px;text-align:center;
  transition:var(--transition);position:relative;
  box-shadow:0 4px 16px rgba(108,142,239,0.1), 0 1px 4px rgba(255,255,255,0.3) inset;
}
.reward-item.achieved{background:rgba(246,173,85,0.3);border-color:rgba(246,173,85,0.5);color:var(--text-main);}
.reward-item.locked{opacity:.5;}
.reward-item .icon{font-size:36px;margin-bottom:8px;}
.reward-item .name{font-size:13px;font-weight:600;margin-bottom:4px;}
.reward-item .desc{font-size:11px;opacity:.8;}
.reward-item .check{position:absolute;top:8px;right:8px;font-size:18px;}

/* ===== Reward Shop ===== */
.reward-tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:2px solid var(--border);}
.reward-tab{padding:10px 20px;border:none;background:none;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:var(--transition);border-radius:var(--radius-sm) var(--radius-sm) 0 0;}
.reward-tab.active{border-bottom-color:var(--primary);color:var(--primary);}
.reward-tab:hover{background:var(--bg-1);}
.reward-tab-content{display:none;}
.reward-tab-content.active{display:block;}
.reward-balance{display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.3);backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);
  border:1px solid rgba(255,255,255,0.5);color:var(--text-main);
  padding:10px 20px;border-radius:999px;font-weight:700;font-size:15px;margin-bottom:10px;justify-content:center;
  box-shadow:0 4px 16px rgba(251,191,36,0.15), 0 2px 8px rgba(255,255,255,0.4) inset;
}
.redeem-code-row{display:flex;gap:8px;margin-bottom:16px;align-items:center;}
.redeem-input{flex:1;padding:10px 14px;
  background:rgba(255,255,255,0.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.45);border-radius:50px;font-size:13px;outline:none;font-family:inherit;color:var(--text-main);transition:var(--transition);
}
.redeem-input:focus{border-color:rgba(108,142,239,0.5);box-shadow:0 0 0 4px rgba(108,142,239,0.1);background:rgba(255,255,255,0.5);}
.redeem-btn{padding:10px 18px;
  background:rgba(251,191,36,0.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(251,191,36,0.5);border-radius:50px;
  color:#b45309;font-weight:700;font-size:13px;cursor:pointer;transition:var(--transition);white-space:nowrap;
  box-shadow:0 2px 8px rgba(251,191,36,0.15), 0 1px 4px rgba(255,255,255,0.4) inset;
}
.redeem-btn:hover{transform:scale(1.05);background:rgba(251,191,36,0.45);box-shadow:0 4px 14px rgba(251,191,36,0.25);}
.redeem-btn:active{transform:scale(0.96);}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.shop-item{
  background:rgba(255,255,255,0.25);backdrop-filter:blur(15px) saturate(180%);-webkit-backdrop-filter:blur(15px) saturate(180%);
  border:1px solid rgba(255,255,255,0.4);border-radius:20px;padding:16px 12px;text-align:center;
  transition:var(--transition);position:relative;overflow:hidden;
  box-shadow:0 4px 16px rgba(108,142,239,0.1), 0 1px 4px rgba(255,255,255,0.3) inset;
}
.shop-item::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary);transform:scaleX(0);transition:transform .3s;border-radius:20px 20px 0 0;}
.shop-item:hover::before{transform:scaleX(1);}
.shop-item:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(108,142,239,0.18), 0 2px 8px rgba(255,255,255,0.4) inset;border-color:rgba(255,255,255,0.6);}
.shop-item .shop-icon{font-size:40px;margin-bottom:8px;line-height:1;}
.shop-item .shop-name{font-size:13px;font-weight:600;margin-bottom:4px;}
.shop-item .shop-desc{font-size:11px;opacity:.7;margin-bottom:8px;line-height:1.4;}
.shop-item .shop-price{font-size:15px;font-weight:800;color:var(--primary);margin-bottom:8px;}
.shop-item .shop-buy-btn{width:100%;padding:7px;
  background:rgba(108,142,239,0.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(108,142,239,0.4);border-radius:12px;
  color:var(--primary-dark);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);
  box-shadow:0 2px 8px rgba(108,142,239,0.1), 0 1px 4px rgba(255,255,255,0.4) inset;
}
.shop-item .shop-buy-btn:hover{transform:scale(1.05);background:rgba(108,142,239,0.4);box-shadow:0 4px 12px rgba(108,142,239,0.2);}
.shop-item .shop-buy-btn:active{transform:scale(0.96);}
.shop-item .shop-buy-btn:disabled{background:rgba(255,255,255,0.2);color:var(--text-light);opacity:.5;cursor:not-allowed;transform:none;border-color:rgba(255,255,255,0.3);}
.shop-item.owned{border:2px solid var(--accent-mint);}
.shop-item.using{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,142,239,0.15);}
.shop-item .shop-buy-btn.equip{width:100%;padding:7px;border:none;border-radius:16px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:var(--transition);background:rgba(108,142,239,0.3);color:var(--primary);border:1px solid rgba(108,142,239,0.4);}
.shop-item .shop-buy-btn.equip:hover{background:rgba(108,142,239,0.45);transform:scale(1.03);}
.shop-item .shop-buy-btn.using{background:rgba(104,211,145,0.3);border-color:rgba(104,211,145,0.5);color:#2f855a;}
.shop-item.owned .shop-buy-btn{background:rgba(104,211,145,0.35);border-color:rgba(104,211,145,0.5);color:#2f855a;}
.shop-item.upgrade{grid-column:1/-1;display:flex;align-items:center;gap:20px;text-align:left;padding:24px;
  background:rgba(252,219,135,0.15);backdrop-filter:blur(15px) saturate(180%);-webkit-backdrop-filter:blur(15px) saturate(180%);
  border:1px solid rgba(252,219,135,0.4);
}
.shop-item.upgrade .shop-icon{font-size:56px;margin-bottom:0;flex-shrink:0;}
.shop-item.upgrade .shop-info{flex:1;}
.shop-item.upgrade .shop-name{font-size:18px;margin-bottom:6px;}
.shop-item.upgrade .shop-desc{font-size:13px;line-height:1.6;margin-bottom:0;}
.shop-item.upgrade .shop-price{font-size:24px;margin-bottom:0;white-space:nowrap;}
.shop-item.upgrade .shop-buy-btn{width:auto;padding:12px 24px;font-size:14px;}
.shop-preview-bar{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
.shop-preview-bar span{font-size:20px;opacity:.5;transition:opacity .3s;}
.shop-preview-bar span.on{opacity:1;}
.streak-progress{
  background:rgba(255,255,255,0.25);backdrop-filter:blur(10px) saturate(180%);-webkit-backdrop-filter:blur(10px) saturate(180%);
  border:1px solid rgba(255,255,255,0.4);border-radius:16px;padding:12px 16px;margin-bottom:16px;
  box-shadow:0 2px 8px rgba(108,142,239,0.08), 0 1px 4px rgba(255,255,255,0.3) inset;
}
.streak-progress .sp-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;}
.streak-progress .sp-bar{height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden;}
.streak-progress .sp-fill{height:100%;background:linear-gradient(90deg,var(--accent-peach),var(--accent-pink));border-radius:4px;transition:width .5s;}
.streak-milestones{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;opacity:.6;}

/* ===== Ice Melt — 3D 冰块融化 ===== */
.ice-scene{
  position:relative;width:100%;max-width:480px;margin:0 auto;
  min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:30px 0 10px;perspective:900px;
}
.ice-stage{
  position:relative;width:200px;height:200px;
  transform-style:preserve-3d;margin-bottom:60px;
}
.ice-cube{
  position:relative;width:200px;height:200px;
  transform-style:preserve-3d;
  animation:iceRotate 18s linear infinite;
  transition:transform .3s ease,opacity .3s ease;
}
.ice-cube.paused{animation-play-state:paused;}
@keyframes iceRotate{
  from{transform:rotateY(0deg) rotateX(-12deg);}
  to{transform:rotateY(360deg) rotateX(-12deg);}
}
.ice-face{
  position:absolute;width:200px;height:200px;
  background:
    linear-gradient(135deg,rgba(220,240,255,0.55) 0%,rgba(160,210,255,0.25) 50%,rgba(200,230,255,0.4) 100%),
    radial-gradient(circle at 30% 30%,rgba(255,255,255,0.5) 0%,transparent 50%);
  border:1px solid rgba(255,255,255,0.5);
  box-shadow:inset 0 0 40px rgba(255,255,255,0.25),inset 0 0 8px rgba(140,190,255,0.15);
  backdrop-filter:blur(2px);
}
.ice-face.front{transform:translateZ(100px);}
.ice-face.back{transform:translateZ(-100px) rotateY(180deg);}
.ice-face.left{transform:rotateY(-90deg) translateZ(100px);}
.ice-face.right{transform:rotateY(90deg) translateZ(100px);}
.ice-face.top{transform:rotateX(90deg) translateZ(100px);}
.ice-face.bottom{transform:rotateX(-90deg) translateZ(100px);}
/* frost shimmer overlay */
.ice-face::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,0.35) 50%,transparent 70%);
  animation:iceShimmer 4s ease-in-out infinite;
}
@keyframes iceShimmer{0%,100%{opacity:0.3;transform:translateX(-10px);}50%{opacity:0.8;transform:translateX(10px);}}
/* water droplets */
.ice-droplets{position:absolute;top:0;left:0;width:200px;height:200px;pointer-events:none;}
.ice-droplet{
  position:absolute;width:6px;height:10px;
  background:linear-gradient(180deg,rgba(180,220,255,0.8),rgba(120,180,255,0.5));
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  box-shadow:0 0 4px rgba(140,190,255,0.4);
  animation:dropletFall var(--dur,2s) ease-in forwards;
}
@keyframes dropletFall{
  0%{transform:translateY(0) scale(1);opacity:0.85;}
  80%{opacity:0.7;}
  100%{transform:translateY(var(--fall,180px)) scale(0.4);opacity:0;}
}
/* puddle */
.ice-puddle{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  width:0;height:10px;
  background:radial-gradient(ellipse,rgba(140,190,255,0.35) 0%,rgba(100,160,255,0.15) 70%,transparent 100%);
  border-radius:50%;transition:all .4s ease;
}
/* timer */
.ice-timer{
  font-size:44px;font-weight:800;color:var(--primary);
  font-variant-numeric:tabular-nums;letter-spacing:2px;
  text-shadow:0 2px 12px rgba(79,209,197,0.25);
}
.ice-progress-text{font-size:13px;color:var(--text-sub);margin-top:4px;}
/* guidance */
.ice-guidance{
  margin-top:16px;padding:14px 20px;border-radius:var(--radius-sm);
  background:rgba(79,209,197,0.08);border:1px solid rgba(79,209,197,0.15);
  font-size:13px;color:var(--text-sub);text-align:center;line-height:1.7;
  min-height:48px;display:flex;align-items:center;justify-content:center;
  transition:all .4s ease;
}
/* controls */
.ice-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px;}
.ice-btn{
  padding:10px 28px;border-radius:50px;border:none;cursor:pointer;
  font-size:14px;font-weight:600;transition:var(--transition);
  background:linear-gradient(135deg,#4fd1c5,#6c8eef);color:#fff;
  box-shadow:0 4px 16px rgba(79,209,197,0.3);
}
.ice-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,209,197,0.4);}
.ice-btn.secondary{background:var(--card-bg);color:var(--text-main);border:1px solid var(--primary-light);box-shadow:none;}
.ice-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
/* speed slider */
.ice-speed-row{
  width:100%;max-width:320px;margin:14px auto 0;
  display:flex;align-items:center;gap:10px;
}
.ice-speed-row label{font-size:13px;color:var(--text-sub);white-space:nowrap;}
.ice-speed-row input[type=range]{flex:1;accent-color:var(--primary);}
.ice-speed-val{font-size:13px;color:var(--primary);font-weight:700;min-width:38px;text-align:right;}
/* complete message */
.ice-complete{
  display:none;text-align:center;margin-top:16px;
  animation:fadeIn .8s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.ice-complete .emoji{font-size:48px;display:block;margin-bottom:8px;}
.ice-complete p{color:var(--text-sub);font-size:13px;line-height:1.7;}

/* ===== 功德木鱼 ===== */
.woodfish-scene{
  display:flex;flex-direction:column;align-items:center;
  padding:10px 0 0;position:relative;min-height:320px;
}
.woodfish-stats{
  display:flex;gap:24px;margin-bottom:6px;
}
.woodfish-stat{text-align:center;}
.woodfish-stat .num{font-size:28px;font-weight:800;color:var(--primary);}
.woodfish-stat .label{font-size:11px;color:var(--text-sub);}
.woodfish-float-area{
  position:absolute;top:0;left:0;right:0;height:200px;
  pointer-events:none;overflow:hidden;z-index:5;
}
.woodfish-float{
  position:absolute;font-size:20px;font-weight:700;
  white-space:nowrap;animation:woodfishFloatUp 2.5s ease-out forwards;
}
@keyframes woodfishFloatUp{
  0%{transform:translateY(0) scale(0.5);opacity:0;}
  15%{transform:translateY(-10px) scale(1.1);opacity:1;}
  100%{transform:translateY(-180px) scale(1);opacity:0;}
}
.woodfish-body{
  position:relative;cursor:pointer;user-select:none;
  transition:transform .08s ease;
  width:200px;height:140px;margin:20px 0 0;
}
.woodfish-body:active{transform:scale(0.95);}
.woodfish-body.hit{animation:woodfishHit .15s ease;}
@keyframes woodfishHit{0%{transform:scale(1);}50%{transform:scale(0.92);}100%{transform:scale(1);}}
.woodfish-svg{width:100%;height:100%;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.15));}
.woodfish-ripple{
  position:absolute;top:50%;left:50%;
  width:20px;height:20px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.6);
  transform:translate(-50%,-50%);
  animation:woodfishRipple .6s ease-out forwards;
  pointer-events:none;
}
@keyframes woodfishRipple{
  0%{width:20px;height:20px;opacity:0.8;}
  100%{width:160px;height:160px;opacity:0;}
}
.woodfish-hint{font-size:13px;color:var(--text-sub);margin-top:8px;}
.woodfish-combo{
  position:absolute;top:8px;right:16px;
  font-size:14px;font-weight:700;color:var(--primary);
  opacity:0;transition:opacity .3s ease;
}
.woodfish-combo.active{opacity:1;}

/* ===== 疯狂砸碎（重构版） ===== */
.smash-scene{
  display:flex;flex-direction:column;align-items:center;
  padding:0;position:relative;min-height:480px;
  background:radial-gradient(ellipse at center,#2a2a2e 0%,#1a1a1e 50%,#121214 100%);
  border-radius:var(--radius-md);overflow:hidden;
}
.smash-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:2;pointer-events:none;
}
.smash-counter{
  position:relative;z-index:5;
  display:flex;align-items:center;gap:8px;margin-top:24px;margin-bottom:8px;
  font-size:13px;color:#888;letter-spacing:1px;
}
.smash-counter .count{font-size:24px;font-weight:200;color:#e0e0e0;font-variant-numeric:tabular-nums;}
.smash-counter .total{font-size:16px;color:#555;}
.smash-progress{
  position:relative;z-index:5;
  width:200px;height:2px;
  background:rgba(255,255,255,0.06);border-radius:1px;overflow:hidden;
  margin-bottom:20px;
}
.smash-progress-fill{
  height:100%;width:0%;border-radius:1px;
  background:linear-gradient(90deg,#666,#aaa,#fff);
  transition:width .15s ease;
}
.smash-stage{
  position:relative;z-index:5;
  width:240px;height:240px;
  display:flex;align-items:center;justify-content:center;
  cursor:crosshair;user-select:none;
}
.smash-stage.shaking{animation:smashScreenShake .12s ease;}
@keyframes smashScreenShake{
  0%{transform:translate(0,0);}
  15%{transform:translate(-7px,-3px) rotate(-0.5deg);}
  30%{transform:translate(6px,4px) rotate(0.5deg);}
  45%{transform:translate(-5px,2px) rotate(-0.3deg);}
  60%{transform:translate(4px,-3px) rotate(0.3deg);}
  75%{transform:translate(-2px,1px);}
  100%{transform:translate(0,0);}
}
.smash-scene.global-shake{animation:smashGlobalShake .15s ease;}
@keyframes smashGlobalShake{
  0%{transform:translate(0,0);}
  20%{transform:translate(-4px,2px);}
  40%{transform:translate(3px,-2px);}
  60%{transform:translate(-2px,1px);}
  80%{transform:translate(1px,-1px);}
  100%{transform:translate(0,0);}
}
.smash-item{
  width:200px;height:200px;position:relative;
  transition:transform .06s ease,filter .3s ease;
}
.smash-item.hit{animation:smashHitPulse .1s ease;}
@keyframes smashHitPulse{
  0%{transform:scale(1);}
  30%{transform:scale(0.94);}
  100%{transform:scale(1);}
}
.smash-item svg{width:100%;height:100%;filter:drop-shadow(0 12px 24px rgba(0,0,0,0.5));}
.smash-crack-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:6;
}
.smash-crack-overlay svg{width:100%;height:100%;position:absolute;inset:0;}
.smash-flash{
  position:absolute;inset:0;background:#fff;
  opacity:0;pointer-events:none;z-index:10;
}
.smash-flash.fire{animation:smashFlash .4s ease-out;}
@keyframes smashFlash{
  0%{opacity:0;}
  8%{opacity:0.85;}
  100%{opacity:0;}
}
.smash-complete{
  position:absolute;inset:0;z-index:12;
  display:none;flex-direction:column;align-items:center;justify-content:center;
}
.smash-complete.show{display:flex;animation:smashFadeIn 1.5s ease;}
@keyframes smashFadeIn{
  0%{opacity:0;}
  100%{opacity:1;}
}
.smash-complete-text{
  font-size:18px;font-weight:300;color:#c0c0c0;
  letter-spacing:0.4em;text-align:center;line-height:2;
  text-shadow:0 0 20px rgba(255,255,255,0.1);
  animation:smashLetterSpread 2.5s ease;
}
@keyframes smashLetterSpread{
  0%{letter-spacing:0.1em;opacity:0;}
  40%{opacity:0.4;}
  100%{letter-spacing:0.4em;opacity:1;}
}
.smash-reset-btn{
  margin-top:32px;padding:8px 28px;
  background:transparent;color:#666;
  border:1px solid #333;border-radius:50px;
  font-size:13px;letter-spacing:2px;cursor:pointer;
  transition:all .3s ease;
}
.smash-reset-btn:hover{border-color:#555;color:#999;}

/* ===== 冰块番茄钟（合并版） ===== */
.icepomo-scene{
  display:flex;flex-direction:column;align-items:center;
  padding:10px 0;position:relative;
}
.icepomo-stage{
  position:relative;width:240px;height:240px;margin:10px auto;
  display:flex;align-items:center;justify-content:center;
  perspective:600px;
}
.icepomo-block{
  position:relative;width:180px;height:180px;
  transform-style:preserve-3d;
  transform:rotateX(8deg) rotateY(-15deg);
  transition:transform .5s ease,opacity .5s ease,scale .5s ease;
}
.icepomo-body{
  width:100%;height:100%;
  background:
    radial-gradient(circle at 35% 30%,rgba(255,255,255,0.5) 0%,transparent 40%),
    linear-gradient(135deg,rgba(220,240,255,0.45) 0%,rgba(160,210,255,0.2) 50%,rgba(200,230,255,0.35) 100%);
  border:1px solid rgba(255,255,255,0.4);
  border-radius:28% 28% 30% 30% / 35% 35% 32% 32%;
  box-shadow:
    inset 0 0 50px rgba(255,255,255,0.2),
    inset 0 -10px 30px rgba(140,190,255,0.15),
    0 8px 30px rgba(79,209,197,0.2);
  backdrop-filter:blur(2px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.icepomo-body::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,0.3) 50%,transparent 70%);
  animation:iceShimmer 5s ease-in-out infinite;
  border-radius:inherit;
}
.icepomo-timer{
  font-size:38px;font-weight:800;color:#1a3a5a;
  font-variant-numeric:tabular-nums;letter-spacing:1px;
  text-shadow:0 2px 8px rgba(255,255,255,0.5);
  z-index:2;position:relative;
}
.icepomo-mode-label{
  font-size:12px;color:rgba(30,80,120,0.7);margin-top:2px;
  z-index:2;position:relative;
}
.icepomo-droplets{position:absolute;bottom:0;left:0;right:0;height:100%;pointer-events:none;z-index:3;}
.icepomo-droplet{
  position:absolute;width:5px;height:12px;
  background:linear-gradient(180deg,rgba(180,220,255,0.85),rgba(120,180,255,0.5));
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  box-shadow:0 0 4px rgba(140,190,255,0.4);
  animation:icepomoDrip var(--dur,2s) ease-in forwards;
}
@keyframes icepomoDrip{
  0%{transform:translateY(0) scale(1);opacity:0.85;}
  80%{opacity:0.7;}
  100%{transform:translateY(var(--fall,180px)) scale(0.3);opacity:0;}
}
.icepomo-puddle{
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:0;height:8px;
  background:radial-gradient(ellipse,rgba(140,190,255,0.3) 0%,rgba(100,160,255,0.1) 70%,transparent 100%);
  border-radius:50%;transition:all .5s ease;
}
.icepomo-controls{
  display:flex;gap:10px;align-items:center;justify-content:center;
  margin-top:16px;flex-wrap:wrap;
}
.icepomo-modes{
  display:flex;gap:8px;margin-bottom:14px;
}
.icepomo-mode-btn{
  padding:6px 16px;border-radius:50px;border:1px solid rgba(79,209,197,0.3);
  background:rgba(79,209,197,0.08);color:var(--text-sub);
  font-size:12px;cursor:pointer;transition:all .3s ease;
}
.icepomo-mode-btn.active{
  background:linear-gradient(135deg,#4fd1c5,#6c8eef);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(79,209,197,0.25);
}
.icepomo-hint{font-size:12px;color:var(--text-sub);margin-top:10px;text-align:center;max-width:320px;}

/* ===== 解忧塔罗 / 宇宙星签 ===== */
.tarot-overlay{
  position:fixed;inset:0;z-index:10000;
  background:#0B0D17;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .6s ease;
}
.tarot-overlay.active{opacity:1;pointer-events:auto;}
.tarot-bg-glow{
  position:absolute;inset:0;overflow:hidden;
}
.tarot-aurora{
  position:absolute;border-radius:50%;
  filter:blur(80px);opacity:0.25;
  animation:tarotAuroraFloat 12s ease-in-out infinite;
}
.tarot-aurora-1{width:500px;height:500px;background:#4a1a6e;top:-100px;left:-100px;}
.tarot-aurora-2{width:400px;height:400px;background:#1a4a8e;bottom:-80px;right:-50px;animation-delay:-4s;}
.tarot-aurora-3{width:350px;height:350px;background:#6e1a4a;top:40%;left:40%;animation-delay:-8s;}
@keyframes tarotAuroraFloat{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(30px,-20px) scale(1.1);}
  66%{transform:translate(-20px,30px) scale(0.95);}
}
.tarot-stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.tarot-star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff;opacity:0.5;
  animation:tarotStarTwinkle var(--dur,3s) ease-in-out infinite;
}
@keyframes tarotStarTwinkle{0%,100%{opacity:0.2;}50%{opacity:0.8;}}
.tarot-close{
  position:absolute;top:20px;right:24px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.6);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s ease;z-index:10;
}
.tarot-close:hover{background:rgba(255,255,255,0.15);color:#fff;}
.tarot-title{
  font-size:26px;font-weight:300;color:rgba(255,255,255,0.9);
  letter-spacing:4px;margin-bottom:6px;z-index:1;
}
.tarot-subtitle{
  font-size:13px;color:rgba(255,255,255,0.35);letter-spacing:2px;
  margin-bottom:40px;z-index:1;
}
.tarot-cards{
  display:flex;gap:20px;perspective:1000px;z-index:1;
}
.tarot-card{
  width:150px;height:230px;position:relative;
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(0.4,0.2,0.2,1),opacity .6s ease,filter .6s ease;
  cursor:pointer;
}
.tarot-card:hover{
  transform:translateY(-8px);
  filter:drop-shadow(0 0 20px rgba(120,180,255,0.4));
}
.tarot-card.flipped{transform:rotateY(180deg) translateY(-8px);}
.tarot-card.faded{opacity:0.15;pointer-events:none;filter:blur(4px);}
.tarot-card-face{
  position:absolute;inset:0;border-radius:12px;
  backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.tarot-card-back{
  background:
    linear-gradient(135deg,rgba(30,30,60,0.6),rgba(60,40,80,0.4)),
    radial-gradient(circle at 50% 40%,rgba(100,80,160,0.15),transparent 60%);
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(16px);
  box-shadow:
    inset 0 0 30px rgba(100,120,200,0.08),
    0 8px 30px rgba(0,0,0,0.4);
}
.tarot-card-back-glow{
  position:absolute;inset:0;border-radius:12px;
  background:radial-gradient(circle at 50% 50%,rgba(120,100,200,0.12),transparent 60%);
  animation:tarotBreath 3s ease-in-out infinite;
}
@keyframes tarotBreath{0%,100%{opacity:0.5;}50%{opacity:1;}}
.tarot-card-back-symbol{
  font-size:40px;color:rgba(255,255,255,0.25);
  text-shadow:0 0 15px rgba(120,180,255,0.2);
  z-index:1;
}
.tarot-card-back-text{
  font-size:9px;color:rgba(255,255,255,0.15);letter-spacing:3px;
  margin-top:8px;z-index:1;
}
.tarot-card-front{
  transform:rotateY(180deg);
  background:
    linear-gradient(135deg,rgba(20,20,40,0.85),rgba(40,30,60,0.8)),
    radial-gradient(circle at 50% 30%,rgba(80,60,140,0.1),transparent 60%);
  border:1px solid rgba(180,160,255,0.2);
  backdrop-filter:blur(16px);
  box-shadow:inset 0 0 40px rgba(80,60,140,0.06),0 8px 30px rgba(0,0,0,0.4);
  padding:20px;text-align:center;
}
.tarot-card-front-text{
  font-size:13px;line-height:1.9;color:rgba(255,255,255,0.8);
  letter-spacing:1px;writing-mode:vertical-rl;
  text-orientation:upright;
  max-height:190px;overflow:hidden;
  font-weight:300;
}
.tarot-reveal-text{
  position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
  width:80%;max-width:500px;text-align:center;
  opacity:0;transition:opacity .8s ease .4s;
  z-index:5;
}
.tarot-reveal-text.show{opacity:1;}
.tarot-reveal-text p{
  font-size:16px;line-height:2;color:rgba(255,255,255,0.85);
  letter-spacing:2px;font-weight:300;
}
.tarot-restart{
  margin-top:24px;padding:8px 28px;border-radius:50px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.2);
  color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;
  transition:all .3s ease;
}
.tarot-restart:hover{background:rgba(255,255,255,0.12);color:#fff;}
.tarot-particles{position:absolute;inset:0;pointer-events:none;z-index:3;}
.tarot-particle{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(180,200,255,0.8);
  animation:tarotParticleFloat var(--dur,2s) ease-out forwards;
}
@keyframes tarotParticleFloat{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--tx,0),var(--ty,-80px)) scale(0);opacity:0;}
}

/* ===== Toast ===== */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text-main);color:#fff;padding:12px 28px;border-radius:50px;font-size:14px;font-weight:600;
  z-index:2000;opacity:0;transition:var(--transition);box-shadow:0 8px 24px rgba(0,0,0,.2);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== Responsive ===== */
@media(max-width:680px){
  /* 平板/竖屏：奖励卡片与商店卡片适当缩窄，升级卡保持两列内容但收紧间距 */
  .reward-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .shop-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .reward-tabs{gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .reward-tabs::-webkit-scrollbar{display:none;}
  .reward-tab{padding:10px 14px;font-size:13px;white-space:nowrap;}
}
@media(max-width:600px){
  /* 手机：升级卡改为纵向堆叠，签名余额可换行居中 */
  .shop-item.upgrade{flex-direction:column;align-items:center;text-align:center;gap:12px;padding:20px 14px;}
  .shop-item.upgrade .shop-preview-bar{justify-content:center;}
  .shop-item.upgrade .shop-price{white-space:nowrap;margin-bottom:6px;}
  .reward-balance{flex-wrap:wrap;text-align:center;padding:10px 12px;font-size:13px;}
  .redeem-code-row{gap:6px;}
  .redeem-btn{flex-shrink:0;padding:10px 14px;}
}
@media(max-width:600px){
  .age-cards{flex-direction:column;}
  .age-card{width:100%;max-width:280px;}
  .welcome-header .greeting{font-size:22px;}
  .feature-grid{grid-template-columns:repeat(3,1fr);}
  .feature-card{padding:16px 8px;}
  .feature-card .icon{font-size:32px;}
  .feature-card .name{font-size:13px;}
  .pomodoro-timer{font-size:48px;}
  .checkin-card{padding:20px;text-align:center;}
}
@media(max-width:400px){
  .feature-grid{grid-template-columns:repeat(2,1fr);}
}

/* ===== 烦恼黑洞 ===== */
.bh-wrap{display:flex;flex-direction:column;gap:20px;padding:8px 4px;}
.bh-layout{display:flex;gap:24px;align-items:stretch;min-height:420px;}
@media(max-width:680px){
  .bh-layout{flex-direction:column;min-height:auto;}
}
.bh-left{flex:1;display:flex;flex-direction:column;gap:12px;}
.bh-hint{font-size:15px;color:rgba(255,255,255,.55);font-style:italic;}
.bh-textarea{
  width:100%;flex:1;min-height:220px;resize:none;border-radius:16px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  color:#e8e0ff;font-size:16px;line-height:1.8;padding:18px 20px;
  font-family:inherit;outline:none;transition:border-color .3s,box-shadow .3s;
}
.bh-textarea:focus{border-color:rgba(168,85,247,.5);box-shadow:0 0 24px rgba(168,85,247,.15);}
.bh-textarea::placeholder{color:rgba(255,255,255,.25);}
.bh-char-count{font-size:12px;color:rgba(255,255,255,.3);text-align:right;}
.bh-btn{
  align-self:flex-start;padding:12px 32px;border:none;border-radius:30px;
  background:linear-gradient(135deg,#6d28d9,#4c1d95);color:#fff;font-size:15px;
  font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .3s;
  box-shadow:0 4px 20px rgba(109,40,217,.4);
}
.bh-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(109,40,217,.6);}
.bh-btn:active{transform:scale(.97);}
.bh-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

.bh-right{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:320px;}
.bh-canvas-wrap{
  position:relative;width:320px;height:320px;
}
@media(max-width:680px){
  .bh-canvas-wrap{width:260px;height:260px;}
}
#bhCanvas{width:100%;height:100%;border-radius:50%;}
.bh-center-flash{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:60px;height:60px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff 0%,rgba(168,85,247,.8) 40%,transparent 70%);
  opacity:0;transition:none;
}
.bh-center-flash.active{animation:bhFlash .8s ease-out;}
@keyframes bhFlash{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.5);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(3);}
}
.bh-status{text-align:center;font-size:13px;color:rgba(255,255,255,.35);margin-top:8px;min-height:20px;}
.bh-count{text-align:center;font-size:13px;color:rgba(168,85,247,.6);margin-top:4px;}

/* 全屏粒子覆盖层 */
.bh-particle-overlay{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  pointer-events:none;z-index:10000;
}

/* ===== 减压气泡膜 ===== */
.bubble-wrap-scene{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:8px 0 4px;
}
.bubble-stats-bar{
  display:flex;gap:16px;font-size:13px;color:var(--text-sub);
}
.bubble-stats-bar .num{color:var(--accent,#a78bfa);font-weight:700;}
.bubble-float-area{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:9999;overflow:hidden;
}
.bubble-float-text{
  position:absolute;font-size:18px;font-weight:600;
  animation:bubbleFloatUp 2.5s ease-out forwards;
  text-shadow:0 0 10px currentColor;
  white-space:nowrap;
}
@keyframes bubbleFloatUp{
  0%{opacity:0;transform:translateY(0) scale(.5);}
  15%{opacity:1;transform:translateY(-20px) scale(1.1);}
  100%{opacity:0;transform:translateY(-200px) scale(.8);}
}
.bubble-grid{
  display:grid;gap:6px;padding:16px;border-radius:20px;
  background:linear-gradient(145deg,rgba(167,243,208,.15),rgba(196,181,253,.15));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 2px 20px rgba(255,255,255,.05);
  user-select:none;-webkit-user-select:none;
}
.bubble-cell{
  width:var(--bw,52px);height:var(--bw,52px);
  border-radius:50%;cursor:pointer;position:relative;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
}
.bubble-cell .bubble-dome{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,
    rgba(255,255,255,.7) 0%,
    rgba(255,255,255,.25) 18%,
    var(--bubble-color,#a7f3d0) 55%,
    var(--bubble-color-dark,#68d391) 100%);
  box-shadow:
    inset -3px -4px 8px rgba(0,0,0,.12),
    inset 3px 4px 10px rgba(255,255,255,.35),
    0 2px 6px rgba(0,0,0,.1),
    0 0 0 1px rgba(255,255,255,.08);
  transition:all .15s ease;
}
.bubble-cell:hover .bubble-dome{
  transform:scale(1.12);
  box-shadow:
    inset -3px -4px 8px rgba(0,0,0,.1),
    inset 3px 4px 12px rgba(255,255,255,.45),
    0 4px 12px rgba(0,0,0,.12),
    0 0 16px rgba(255,255,255,.15);
}
.bubble-cell.pop .bubble-dome{
  background:linear-gradient(145deg,
    rgba(200,200,200,.15),
    rgba(150,150,150,.08));
  box-shadow:
    inset 2px 2px 6px rgba(0,0,0,.2),
    inset -1px -1px 3px rgba(255,255,255,.05),
    0 0 0 1px rgba(0,0,0,.08);
  transform:scale(.82);
  opacity:.5;
  cursor:default;
}
.bubble-cell.pop:hover .bubble-dome{transform:scale(.82);}
.bubble-cell.gold .bubble-dome{
  background:radial-gradient(circle at 32% 28%,
    rgba(255,255,220,.9) 0%,
    rgba(255,255,255,.4) 15%,
    #ffd700 50%,
    #f59e0b 100%);
  box-shadow:
    inset -3px -4px 8px rgba(180,100,0,.2),
    inset 3px 4px 10px rgba(255,255,255,.5),
    0 2px 8px rgba(255,215,0,.5),
    0 0 20px rgba(255,215,0,.4);
  animation:goldPulse 1.5s ease-in-out infinite;
}
@keyframes goldPulse{
  0%,100%{filter:brightness(1);}
  50%{filter:brightness(1.2);}
}
.bubble-cell.gold.pop .bubble-dome{
  background:radial-gradient(circle,#fbbf24,#f59e0b);
  opacity:.3;animation:none;
}
.bubble-refresh-btn{
  padding:10px 28px;border:none;border-radius:30px;cursor:pointer;
  background:linear-gradient(135deg,#68d391,#34d399);color:#fff;
  font-size:14px;font-weight:600;transition:transform .2s,box-shadow .3s;
  box-shadow:0 4px 16px rgba(52,211,153,.35);
}
.bubble-refresh-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(52,211,153,.5);}
.bubble-refresh-btn:active{transform:scale(.95);}
.bubble-grid.refreshing{animation:bubbleRefresh .6s ease;}
@keyframes bubbleRefresh{
  0%{transform:scale(1);opacity:1;}
  40%{transform:scale(.85);opacity:.3;}
  100%{transform:scale(1);opacity:1;}
}
.confetti-overlay{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  pointer-events:none;z-index:10001;overflow:hidden;
}
.confetti-piece{
  position:absolute;width:10px;height:14px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotateZ(0deg);opacity:1;}
  100%{transform:translateY(105vh) rotateZ(720deg);opacity:.6;}
}

/* ===== 捕获星空 ===== */
.cs-wrap{position:relative;width:100%;height:560px;border-radius:20px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 80%,#1a1a3e 0%,#0d0d2b 40%,#050514 100%);}
.cs-canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;cursor:none;}
.cs-timer{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  font-size:42px;font-weight:200;color:rgba(255,255,255,.85);
  text-shadow:0 0 20px rgba(167,139,250,.5);z-index:5;
  font-variant-numeric:tabular-nums;letter-spacing:2px;}
.cs-timer .unit{font-size:16px;opacity:.5;margin-left:4px;}
.cs-caught{position:absolute;top:70px;left:50%;transform:translateX(-50%);
  font-size:14px;color:rgba(196,181,253,.6);z-index:5;}
.cs-whisper{position:absolute;top:130px;left:50%;transform:translateX(-50%);
  max-width:80%;text-align:center;font-size:16px;line-height:1.8;
  color:rgba(255,255,255,.55);z-index:5;pointer-events:none;
  opacity:0;transition:opacity 1.5s ease;text-shadow:0 0 12px rgba(167,139,250,.3);}
.cs-whisper.show{opacity:1;}
.cs-start-overlay{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:10;
  background:rgba(5,5,20,.7);backdrop-filter:blur(4px);}
.cs-start-overlay h3{font-size:22px;color:rgba(255,255,255,.85);font-weight:300;}
.cs-start-overlay p{font-size:14px;color:rgba(255,255,255,.4);text-align:center;max-width:320px;line-height:1.7;}
.cs-start-btn{padding:14px 40px;border:none;border-radius:30px;cursor:pointer;
  background:linear-gradient(135deg,#6d28d9,#4c1d95);color:#fff;font-size:16px;
  font-weight:600;transition:transform .2s,box-shadow .3s;
  box-shadow:0 4px 24px rgba(109,40,217,.4);}
.cs-start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 32px rgba(109,40,217,.6);}
.cs-end-overlay{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;z-index:10;
  background:radial-gradient(ellipse at center,rgba(30,30,70,.5),rgba(5,5,20,.9));}
.cs-end-overlay.active{display:flex;animation:csEndFadeIn 2s ease;}
@keyframes csEndFadeIn{from{opacity:0;}to{opacity:1;}}
.cs-moon{width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbeb,#fde68a 40%,#f59e0b 80%,#d97706);
  box-shadow:0 0 60px rgba(254,240,138,.4),0 0 120px rgba(251,191,36,.2);
  animation:csMoonGlow 4s ease-in-out infinite;}
@keyframes csMoonGlow{0%,100%{box-shadow:0 0 60px rgba(254,240,138,.4),0 0 120px rgba(251,191,36,.2);}
  50%{box-shadow:0 0 80px rgba(254,240,138,.5),0 0 160px rgba(251,191,36,.3);}}
.cs-end-text{font-size:17px;color:rgba(255,255,255,.65);text-align:center;
  max-width:340px;line-height:1.8;text-shadow:0 0 16px rgba(167,139,250,.3);}
.cs-restart-btn{padding:12px 36px;border:none;border-radius:30px;cursor:pointer;
  background:linear-gradient(135deg,#6d28d9,#4c1d95);color:#fff;font-size:15px;
  font-weight:600;transition:transform .2s,box-shadow .3s;
  box-shadow:0 4px 20px rgba(109,40,217,.4);margin-top:8px;}
.cs-restart-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(109,40,217,.6);}
.cs-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  font-size:12px;color:rgba(255,255,255,.25);z-index:5;pointer-events:none;}
@media(max-width:680px){
  .cs-wrap{height:480px;}
  .cs-timer{font-size:34px;}
  .cs-whisper{font-size:14px;top:110px;}
  .cs-start-overlay p{font-size:13px;}
}

/* ===== Onboarding Tutorial ===== */
.onboarding-overlay{

/* ============================================================
   解压星球 - Stress Relief Planet

/* ---------- Storage Helpers ---------- */
const Store = {
  get(key, def){ try{ const v = localStorage.getItem('srp_'+key); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(key, val){ try{ localStorage.setItem('srp_'+key, JSON.stringify(val)); }catch(e){} },
  del(key){ localStorage.removeItem('srp_'+key); }
};

/* ---------- Toast ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2500);
}

/* ---------- Welcome Landing ---------- */
let landingTheme = 'lively';

function selectLandingTheme(theme){
  landingTheme = theme;
  document.querySelectorAll('#landingThemeChoice button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
  document.body.classList.toggle('mature-theme', theme === 'mature');
}

function enterApp(){
  const isMature = (landingTheme === 'mature');
  document.body.classList.toggle('mature-theme', isMature);
  Store.set('matureTheme', isMature);
  Store.set('visited', true);
  document.getElementById('welcomeLanding').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  initApp();
  updateThemeToggleBtn();
  // First visit → show onboarding
  if(!Store.get('onboarded', false)){
    setTimeout(()=>startOnboarding(), 400);
  }
}

/* ---------- Onboarding Tutorial ---------- */

  },
  {

    desc:'每天记录你的情绪，看见自己的心情趋势。选一个表情代表今天，写下发生了什么。坚持记录，你会发现情绪的规律，也能更好地照顾自己。',
  },
  {
    icon:'🎮',
    title:'趣味解压',
    desc:'涂鸦炸毁、功德木鱼、疯狂砸碎、气泡膜、烦恼黑洞、海浪漂流瓶、虚拟烧纸、碎纸机、烦恼消散、捕获星空、明日盒子、答案之书、心事漂流瓶、解忧塔罗、压力变形记、未来邮箱、解忧信箱、情绪碎片盒——十八种趣味方式，点开「趣味解压」全部解锁。不知道玩哪个？还有随机抽选帮你决定。',

let onboardingStep = 0;

function startOnboarding(){
  onboardingStep = 0;
  renderOnboarding();
  document.getElementById('onboardingOverlay').classList.add('active');
}

function renderOnboarding(){
  const step = onboardingSteps[onboardingStep];
  document.getElementById('onboardingIcon').textContent = step.icon;
  document.getElementById('onboardingTitle').textContent = step.title;
  document.getElementById('onboardingDesc').textContent = step.desc;
  // Progress dots
  document.getElementById('onboardingProgress').innerHTML = onboardingSteps.map((_,i)=>
    `<div class="onboarding-dot${i===onboardingStep?' active':''}"></div>`
  ).join('');
  // Buttons
  document.getElementById('onboardingPrev').style.display = onboardingStep === 0 ? 'none' : '';
  document.getElementById('onboardingNext').textContent = onboardingStep === onboardingSteps.length - 1 ? '开始体验' : '下一步';
}

function nextOnboarding(){
  if(onboardingStep < onboardingSteps.length - 1){
    onboardingStep++;
    renderOnboarding();
  } else {
    finishOnboarding();
  }
}

function prevOnboarding(){
  if(onboardingStep > 0){
    onboardingStep--;
    renderOnboarding();
  }
}

function skipOnboarding(){
  finishOnboarding();
}

function finishOnboarding(){
  document.getElementById('onboardingOverlay').classList.remove('active');
  Store.set('onboarded', true);
}

function renderCheckin(){
  const data = Store.get('checkin', {streak:0, lastDate:'', total:0, checked:false});
  const today = new Date().toDateString();
  data.checked = (data.lastDate === today);
  Store.set('checkin', data);
  document.getElementById('streakNum').textContent = data.streak;
  const btn = document.getElementById('checkinBtn');
  if(data.checked) btn.classList.add('done');
}

function doCheckin(){
  const data = Store.get('checkin', {streak:0, lastDate:'', total:0, checked:false, bestStreak:0, totalDays:0});
  const today = new Date().toDateString();
  if(data.lastDate === today){ toast('今天已经签到过了哦～'); return; }
  const yesterday = new Date(Date.now()-86400000).toDateString();
  if(data.lastDate === yesterday) data.streak++;
  else data.streak = 1;

  // 连签递增奖励机制
  const streakBonuses = [
    {day:100, bonus:500, label:'百日传奇'},
    {day:50, bonus:200, label:'五十日成就'},
    {day:30, bonus:100, label:'月度坚持'},
    {day:21, bonus:60, label:'习惯养成'},
    {day:14, bonus:50, label:'两周坚持'},
    {day:7, bonus:20, label:'一周坚持'},
  ];
  let baseReward = 5 + Math.min(data.streak - 1, 10); // 基础奖励递增：第1天5星，第2天6星...封顶15星
  let bonus = 0, bonusLabel = '';
  for(const sb of streakBonuses){
    if(data.streak === sb.day){ bonus = sb.bonus; bonusLabel = sb.label; break; }
  }
  // 双倍星星卡
  const isDouble = Store.get('doubleStarsUntil', 0) > Date.now();
  const multiplier = isDouble ? 2 : 1;
  const totalReward = (baseReward + bonus) * multiplier;

  data.lastDate = today;
  data.total = (data.total||0) + totalReward;
  data.checked = true;
  data.totalDays = (data.totalDays||0) + 1;
  data.bestStreak = Math.max(data.bestStreak||0, data.streak);
  Store.set('checkin', data);
  document.getElementById('streakNum').textContent = data.streak;
  document.getElementById('checkinBtn').classList.add('done');

  if(bonus > 0){
    toast(`签到成功！+${baseReward*multiplier}⭐ 连签${data.streak}天额外奖励+${bonus*multiplier}⭐「${bonusLabel}」${isDouble?' ⚡双倍':''}`, 4000);
  } else {
    toast(`签到成功！+${totalReward}⭐ 已连续签到 ${data.streak} 天${isDouble?' ⚡双倍':''}`);
  }
  checkReward('checkin');
  updateStarDisplay();
}

function tryEnterBrowserFullscreen(){
  const el = document.documentElement;
  try{
    if(el.requestFullscreen && !document.fullscreenElement){ el.requestFullscreen().catch(function(){}); }
  }catch(e){}
}
function tryExitBrowserFullscreen(){
  try{
    if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(function(){}); }
  }catch(e){}
}

  starry:'烦恼消散', catchstar:'捕获星空', doodle:'涂鸦炸毁', woodfish:'功德木鱼',

  burn:'虚拟烧纸', shredder:'碎纸机', plan:'学习计划', fragment:'情绪碎片盒',
  icepomo:'冰块番茄钟', noise:'白噪音', tarot:'解忧塔罗', transformer:'压力变形记',
  answerbook:'答案之书', tomorrow:'明日盒子', driftbottle:'心事漂流瓶', future:'未来邮箱',
  slime:'捏捏史莱姆', fruitslice:'切水果大师', stackblock:'叠叠乐', sandart:'重力沙画',
  waterflow:'水流壶铃', leafsweep:'落叶清扫', glowpuzzle:'微光拼图',
};
const POINTS_PER_USE = 5;
const MAX_USES_PER_DAY = 3;

function earnFeaturePoints(featureId){
  const today = new Date().toDateString();
  let usage = Store.get('featureUsage', {date:'', counts:{}});
  // 日重置
  if(usage.date !== today){
    usage = {date:today, counts:{}};
  }
  const count = usage.counts[featureId] || 0;
  if(count >= MAX_USES_PER_DAY){
    toast(`「${FEATURE_NAMES[featureId]||featureId}」今日积分已满，明天再来吧～`);
    return;
  }
  // 加积分
  const checkinData = Store.get('checkin', {total:0});
  checkinData.total = (checkinData.total||0) + POINTS_PER_USE;
  Store.set('checkin', checkinData);
  // 更新使用次数
  usage.counts[featureId] = count + 1;
  Store.set('featureUsage', usage);
  // 提示
  const remaining = MAX_USES_PER_DAY - count - 1;
  if(remaining > 0){
    toast(`+${POINTS_PER_USE}⭐ 「${FEATURE_NAMES[featureId]||featureId}」今日剩余 ${remaining} 次积分机会`);
  } else {
    toast(`+${POINTS_PER_USE}⭐ 「${FEATURE_NAMES[featureId]||featureId}」今日积分已满！明天再来～`);
  }
  updateStarDisplay();
  checkReward('feature');
}

function getFeatureUsageInfo(featureId){
  const today = new Date().toDateString();
  const usage = Store.get('featureUsage', {date:'', counts:{}});
  if(usage.date !== today) return {used:0, remaining:MAX_USES_PER_DAY};
  const used = usage.counts[featureId] || 0;
  return {used, remaining:Math.max(0, MAX_USES_PER_DAY - used)};
}

function renderMoodTrend(){
  const canvas = document.getElementById('trendCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,w,h);

  const data = getMoodData();
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000);
    const dStr = d.toLocaleDateString('zh-CN');
    const rec = data.find(r=>r.date===dStr);
    days.push({date:dStr, label:['日','一','二','三','四','五','六'][d.getDay()], val: rec?rec.val:null, emoji:rec?rec.emoji:null});
  }

  const pad = {l:30,r:15,t:15,b:25};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  // Grid lines
  ctx.strokeStyle = 'rgba(108,142,239,0.1)';
  ctx.lineWidth = 1;
  for(let i=1;i<=5;i++){
    const y = pad.t + ch*(1-i/5);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
  }
  // Points & line
  const pts = days.map((d,i)=>{
    const x = pad.l + (cw/(days.length-1))*i;
    const y = d.val!==null ? pad.t + ch*(1-d.val/5) : null;
    return {x,y,d};
  });
  // Draw line
  ctx.strokeStyle = '#6c8eef'; ctx.lineWidth = 2.5; ctx.lineJoin='round';
  let started = false;
  ctx.beginPath();
  pts.forEach(p=>{
    if(p.y!==null){
      if(!started){ ctx.moveTo(p.x,p.y); started=true; }
      else ctx.lineTo(p.x,p.y);
    }
  });
  ctx.stroke();
  // Fill area
  ctx.lineTo(pts[pts.length-1].x, pad.t+ch);
  ctx.lineTo(pts[0].x, pad.t+ch);
  ctx.closePath();
  ctx.fillStyle = 'rgba(108,142,239,0.12)';
  ctx.fill();
  // Draw points
  pts.forEach(p=>{
    if(p.y!==null){
      ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2);
      ctx.fillStyle='#6c8eef'; ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill();
      // Emoji label
      if(p.d.emoji){
        ctx.font='14px sans-serif'; ctx.textAlign='center';
        ctx.fillText(p.d.emoji, p.x, p.y-10);
      }
    } else {
      ctx.beginPath(); ctx.arc(p.x,pad.t+ch,3,0,Math.PI*2);
      ctx.fillStyle='rgba(108,142,239,0.3)'; ctx.fill();
    }
    // Day label

// 获取当前时间描述 — 用于注入 AI 提示和本地兜底
function getTimeContext(){
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const hm = `${h}点${m > 0 ? m + '分' : ''}`;
  let label, vibe;
  if(h >= 0 && h < 5){
    label = `现在是凌晨${hm}`;
    vibe = '深夜（0-5点），用户大概率失眠或熬夜，语气要更轻柔';
  } else if(h >= 5 && h < 8){
    label = `现在${hm}，天都快亮了`;
    vibe = '凌晨接近天亮（5-8点），用户可能熬了一整夜，可以提醒天快亮了';
  } else if(h >= 8 && h < 12){
    label = `现在${hm}，上午`;
    vibe = '上午（8-12点），用户白天聊天，语气可以轻快一点';
  } else if(h >= 12 && h < 14){
    label = `现在${hm}，中午`;
    vibe = '中午（12-14点），午休时间，可以提一句吃没吃饭';
  } else if(h >= 14 && h < 18){
    label = `现在${hm}，下午`;
    vibe = '下午（14-18点），白天，语气自然随性即可';
  } else if(h >= 18 && h < 22){
    label = `现在${hm}，傍晚`;
    vibe = '傍晚（18-22点），晚上，可以提到一天快结束了';
  } else {
    label = `现在${hm}，夜深了`;
    vibe = '深夜（22-24点），用户可能准备睡了或睡不着，语气温柔';
  }
  return { label, vibe, hour: h, minute: m };
}

async function submitComplaint(){
  const ta = document.getElementById('complaintInput');
  if(!ta) return;
  const content = ta.value.trim();
  if(!content){ toast('请先填写或选择投诉意见'); return; }
  // 先发给后端
  let ok = false;
  try{
    const res = await fetch(API_BASE + '/api/complaints', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ content }),
    });
    const json = await res.json().catch(()=>({}));
    ok = res.ok ? true : (json && json.code === 0);
  }catch(e){ ok = false; }
  if(ok){
    toast('已收到投诉，AI 下次会立刻改正 🙇');
  } else {
    // 后端不可用 → 本地缓存，保证功能仍然生效
    localPendingComplaints.push(content);
    toast('已记录（离线），AI 下次会改正 🙇');
  }
  closeModal();
}

// 取回待应用的投诉（先取后端的，后端的没有就用本地缓存），取完即清空
async function pullPendingComplaints(){
  const list = [];
  try{
    const res = await fetch(API_BASE + '/api/complaints/pending');
    const json = await res.json().catch(()=>({}));
    if(json && Array.isArray(json.complaints)){
      list.push(...json.complaints);
    }
  }catch(e){ /* 后端离线，忽略 */ }
  if(localPendingComplaints.length){
    list.push(...localPendingComplaints);
    localPendingComplaints = [];
  }
  return list;
}

// 把投诉拼成一段追加到 system 提示词末尾的指令
async function buildComplaintSuffix(){
  const complaints = await pullPendingComplaints();
  if(!complaints.length) return '';
  return complaints.map(c=>`\n用户刚刚投诉了你：${c}，请你在接下来的回答中立刻改正！`).join('');
}

    if(/骄傲|自豪|做到了|成功了|考过了|拿到了|赢了|搞定|完成/.test(t)) return 'proud';
    if(/谢谢|感谢|感恩|幸亏|多亏|谢谢你/.test(t)) return 'grateful';
    if(/喜欢|爱|心动|暗恋|crush|想你|舍不得|在乎/.test(t)) return 'love';

    if(/气|烦|暴躁|怒|骂|讨厌|恨|恶心|无语|烦死/.test(t)) return 'angry';
    if(/空虚|无聊|没意思|发呆|不知道干什么|刷手机/.test(t)) return 'empty';
    if(/累|疲惫|撑不住|不想动|精疲|耗尽/.test(t)) return 'tired';
    if(/孤|一个人|没人|没人懂|寂寞|冷清/.test(t)) return 'lonely';
    if(/失败|没用|废|不行|做不到|loser|差劲|无能/.test(t)) return 'fail';
    if(/睡|失眠|睡不着|熬夜|困|犯困/.test(t)) return 'sleep';
    if(/压力|焦虑|紧张|考试|工作|deadline|内卷|卷|panic|慌/.test(t)) return 'stress';
    if(/迷茫|困惑|不知道|想不通|纠结|矛盾|烦心事/.test(t)) return 'confused';
    return 'generic';
  };
  const key = pick();
  const r = reps[key];
  const pickOne = arr => arr[Math.floor(Math.random()*arr.length)];
  const comfort = pickOne(r.c);
  const question = pickOne(r.q);
  const rawS = r.s;
  // 建议不每次都给，约四成概率给，避免死板
  const useSuggestion = Math.random() < 0.4;
  const suggestion = useSuggestion ? pickOne(rawS) : '';

  // 少部分时候，把用户自己的话回过去，显得在认真听，避免套模板
  let echo = '';
  if(Math.random() < 0.3){
    const cleaned = text.replace(/[，。！？、,.!?～…\s]+/g, ' ').trim();
    if(cleaned.length >= 2){
      // 取一句短一点的原话做回声
      echo = `你说的「${cleaned.slice(0, 10)}」我记下了。`;
    }
  }

  // 拼成 2~3 句话：可选的"Ing回你原话" + 安慰 + 提问 + 偶尔的建议
  const body = `${comfort} ${question}${suggestion ? ' ' + suggestion : ''}`;
  return echo ? `${echo} ${body}` : body;
}

// 异步获取 AI 回复（纯文本，短超时）
// 成功返回 string，失败/超时返回 null
async function fetchAIReply(text, timeoutMs){
  timeoutMs = timeoutMs || 4000;
  const controller = new AbortController();
  const tid = setTimeout(()=>controller.abort(), timeoutMs);
  const hasApiKey = API_KEY && API_KEY !== '在这里填入我的Key' && BASE_URL && BASE_URL !== 'API链接';

  try{
    // 取回用户的投诉并拼进下一次提示词（无投诉时为空字符串）
    const complaintSuffix = await buildComplaintSuffix();

    let res;
    if(hasApiKey){
      // 方式 1：用户配置的 API — 把投诉追加到 system 提示词末尾
      const messages = CHAT_HISTORY.map(m=>{
        if(m.role === 'system'){
          return {role:'system', content: SYSTEM_PROMPT + complaintSuffix};
        }
        return m;
      });
      res = await fetch(BASE_URL, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':`Bearer ${API_KEY}`,
        },
        signal: controller.signal,
        body: JSON.stringify({
          model: CHAT_MODEL,
          messages: messages,
          stream: false,
          max_tokens: 200,
          temperature: 0.85,
        }),
      });
    } else {
      // 方式 2：Pollinations AI（GET，纯文本，无需 Key）
      const MINI_PROMPT = `你是深夜疗愈师，说话自然随性，拒绝套话。你要认真听用户说的每一句话，每次回复都要紧扣用户刚说的具体内容，句句有回应，不能敷衍。语气要自然松弛、带点真性情，可以有轻微毒舌或调侃，不要每句都温柔软绵绵的那样死板。重要：不要擅自给用户贴情绪标签，比如对方说"空虚"不要自动当成"孤独"来安慰，先顺着ta原话确认或提问，别猜错意思。你每次回答控制在3句话以内，按顺序：先一句话接住对方情绪并共情认可（尽量用ta自己的话）；再用一个开放式问题引导对方多说；最后建议只是偶尔给，不要每次都在最后推销去看某个功能。给的时候可以是具体的缓解小建议或某个解压功能，例如心情日记、白噪音、解压小游戏、放松指南、明日盒子、情绪碎片盒。不要三句全是建议也不要三句全是安慰。不要说加油，不要列条目，不要emoji开头，像深夜发微信的朋友。不要每次都提到现在几点了或时间相关的话，除非用户主动问。把注意力完全放在用户说的话上。`;
      const combined = `${MINI_PROMPT}${complaintSuffix}\n\n用户说：${text}`;
      const url = `https://text.pollinations.ai/${encodeURIComponent(combined)}?model=${CHAT_MODEL}&referrer=stress-relief-planet`;
      res = await fetch(url, {signal: controller.signal});
    }

    clearTimeout(tid);
    if(!res.ok) return null;

    if(hasApiKey){
      const json = await res.json();
      const content = json.choices?.[0]?.message?.content || '';
      return content.trim() || null;
    } else {
      let txt = await res.text();
      txt = txt.replace(/^```[\w]*\n?/,'').replace(/\n?```$/,'').trim();
      return txt || null;
    }
  }catch(e){
    clearTimeout(tid);
    return null;
  }
}

// === streamChat：先想想再回 ===
// 用户发消息后先显示思考动画 ~1 秒（模拟"认真听了你在说什么"）
// 思考期间后台并发请求 AI，思考结束后优先用 AI 回复，AI 没回来就用本地兜底
async function streamChat(text){
  const sendBtn = document.getElementById('chatSendBtn');
  if(sendBtn) sendBtn.disabled = true;
  chatStreaming = true;

  // 添加用户消息到历史
  CHAT_HISTORY.push({role:'user', content:text});
  if(CHAT_HISTORY.length > 21){
    CHAT_HISTORY.splice(1, CHAT_HISTORY.length - 21);
  }

  // 1. 显示"思考中"动画 — 让用户感觉 AI 在认真读你说的话
  appendThinking();

  // 2. 后台并发请求 AI（思考期间也在跑）
  const aiPromise = fetchAIReply(text, 5000);

  // 3. 停顿 800~1200ms（随机，更像真人节奏）
  const thinkTime = 800 + Math.floor(Math.random() * 400);
  await new Promise(r=>setTimeout(r, thinkTime));

  // 4. 思考结束，看 AI 回来了没有
  let aiText = null;
  try { aiText = await aiPromise; } catch(e) { aiText = null; }

  removeThinking();

  // 5. 选定回复内容：AI 优先，没回来用本地兜底
  const localReply = localFallbackReply(text);
  const reply = (aiText && aiText.length > 5) ? aiText : localReply;

  // 6. 创建气泡，打字机输出（40ms/字，比纯本地稍快一点但也不至于太快）
  const msgEl = appendChatMsg('bot', '');
  const bubble = msgEl.querySelector('.chat-bubble');
  const tw = typewriterEffect(bubble, reply, 40);
  const result = await tw.promise;

  CHAT_HISTORY.push({role:'assistant', content: result.typed || reply});

  // 7. 本地兜底情况下，AI 之后回来了就非阻塞追加
  if(!aiText || aiText.length <= 5){
    aiPromise.then(t=>{
      if(t && t.length > 5 && t !== result.typed){
        const br = document.createElement('br');
        bubble.appendChild(br);
        const tw2 = typewriterEffect(bubble, t, 35, true);
        tw2.promise.then(r2=>{
          const idx = CHAT_HISTORY.findIndex(h=>h.role==='assistant' && h.content===result.typed);
          if(idx >= 0){
            CHAT_HISTORY[idx] = {role:'assistant', content: result.typed + '\n' + (r2.typed || t)};
          }
        });
      }
    }).catch(()=>{});
  }

  chatStreaming = false;
  if(sendBtn) sendBtn.disabled = false;
}

// 打字机效果（可取消，用于本地先回 + AI 异步增强）
// 返回 { promise, cancel } — cancel() 中途打断并返回已打出的文本
// append=true 时不清空已有内容（用于追加 AI 回复）
function typewriterEffect(bubble, text, speed, append){
  speed = speed || 35;  // 默认 35ms/字，比原来的 80ms 快一倍多
  let cancelled = false;
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'chat-cursor';
  if(!append){
    bubble.innerHTML = '';
  }
  bubble.appendChild(cursor);

  const promise = new Promise(resolve=>{
    const timer = setInterval(()=>{
      if(cancelled){
        clearInterval(timer);
        cursor.remove();
        resolve({cancelled: true, typed: text.slice(0, i)});
        return;
      }
      if(i >= text.length){
        clearInterval(timer);
        cursor.remove();
        resolve({cancelled: false, typed: text});
        return;
      }
      bubble.insertBefore(document.createTextNode(text[i]), cursor);
      i++;
      scrollChatBottom();
    }, speed);
  });

  return {
    promise,
    cancel(){
      cancelled = true;
    }
  };
}

// 旧版兼容（其他地方可能调用旧接口）
function typewriterEffectOld(bubble, text){
  return typewriterEffect(bubble, text, 35).promise;
}

function sendChat(){
  if(chatStreaming) return;
  const input = document.getElementById('chatInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  appendChatMsg('user', text);
  input.value = '';
  scrollChatBottom();
  streamChat(text);
}

let breath478Running = false;
let breath478Timers = [];

function toggleBreathing478(){
  const wrap = document.getElementById('breath478Wrap');
  if(!wrap) return;
  wrap.classList.toggle('hidden');
  if(!wrap.classList.contains('hidden') && !breath478Running){
    // 刚展开，重置
    const circle = document.getElementById('breath478Circle');
    const label = document.getElementById('breath478Label');
    const count = document.getElementById('breath478Count');
    const cycle = document.getElementById('breath478Cycle');
    const btn = document.getElementById('breath478Start');
    if(circle) circle.className = 'breath-478-circle';
    if(label) label.textContent = '准备好了吗？';
    if(count) count.textContent = '';
    if(cycle) cycle.textContent = '';
    if(btn){ btn.textContent = '开始呼吸'; btn.disabled = false; }
  }
  if(wrap.classList.contains('hidden') && breath478Running){
    stopBreathing478();
  }
}

function startBreathing478(){
  if(breath478Running){
    stopBreathing478();
    return;
  }
  breath478Running = true;
  const circle = document.getElementById('breath478Circle');
  const label = document.getElementById('breath478Label');
  const countEl = document.getElementById('breath478Count');
  const cycleEl = document.getElementById('breath478Cycle');
  const btn = document.getElementById('breath478Start');
  if(btn){ btn.textContent = '⏹ 停止'; }

  let cycle = 0;
  const totalCycles = 4;

  function runCycle(){
    if(cycle >= totalCycles){
      if(circle) circle.className = 'breath-478-circle';
      if(label) label.textContent = '完成了，感受一下现在的自己 🌿';
      if(countEl) countEl.textContent = '';
      if(cycleEl) cycleEl.textContent = '';
      if(btn){ btn.textContent = '再来一次'; btn.disabled = false; }
      breath478Running = false;
      return;
    }
    cycle++;
    if(cycleEl) cycleEl.textContent = `第 ${cycle} / ${totalCycles} 轮`;

    // 吸气 4秒
    if(circle) circle.className = 'breath-478-circle inhaling';
    if(label) label.textContent = '🌬️ 吸气...';
    let t = 4;
    if(countEl) countEl.textContent = `${t}s`;
    const inhaleTimer = setInterval(()=>{
      t--;
      if(countEl) countEl.textContent = t > 0 ? `${t}s` : '';
      if(t <= 0) clearInterval(inhaleTimer);
    }, 1000);
    breath478Timers.push(inhaleTimer);

    // 屏住 7秒
    breath478Timers.push(setTimeout(()=>{
      if(circle) circle.className = 'breath-478-circle holding';
      if(label) label.textContent = '⏸ 屏住...';
      t = 7;
      if(countEl) countEl.textContent = `${t}s`;
      const holdTimer = setInterval(()=>{
        t--;
        if(countEl) countEl.textContent = t > 0 ? `${t}s` : '';
        if(t <= 0) clearInterval(holdTimer);
      }, 1000);
      breath478Timers.push(holdTimer);

      // 呼气 8秒
      breath478Timers.push(setTimeout(()=>{
        if(circle) circle.className = 'breath-478-circle exhaling';
        if(label) label.textContent = '💨 呼气...';
        t = 8;
        if(countEl) countEl.textContent = `${t}s`;
        const exhaleTimer = setInterval(()=>{
          t--;
          if(countEl) countEl.textContent = t > 0 ? `${t}s` : '';
          if(t <= 0) clearInterval(exhaleTimer);
        }, 1000);
        breath478Timers.push(exhaleTimer);

        // 下一轮
        breath478Timers.push(setTimeout(runCycle, 8000));
      }, 7000));
    }, 4000));
  }

  runCycle();
}

function stopBreathing478(){
  breath478Running = false;
  breath478Timers.forEach(t=>{ clearTimeout(t); clearInterval(t); });
  breath478Timers = [];
  const circle = document.getElementById('breath478Circle');
  const label = document.getElementById('breath478Label');
  const countEl = document.getElementById('breath478Count');
  const cycleEl = document.getElementById('breath478Cycle');
  const btn = document.getElementById('breath478Start');
  if(circle) circle.className = 'breath-478-circle';
  if(label) label.textContent = '已停止';
  if(countEl) countEl.textContent = '';
  if(cycleEl) cycleEl.textContent = '';
  if(btn){ btn.textContent = '重新开始'; btn.disabled = false; }
}

// 柔和钢琴曲 — Ambient 风格琶音循环（参考 Pixel Thoughts）
// C 大调五声音阶 + 下行旋律 + 柔和低音和弦伴奏 + 混响感
function startPixelPiano(){
  try{
    const ctx = getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();

    // C4=261.63, D4=293.66, E4=329.63, G4=392.00, A4=440.00
    // C5=523.25, D5=587.33, E5=659.25, G5=783.99, A5=880.00
    // 旋律（五声音阶，32 音符循环）— 缓慢、空灵、有呼吸感
    const melody = [
      // phrase 1: 上行问句
      523.25, 0, 587.33, 0, 783.99, 0, 0, 0,
      659.25, 0, 0, 0, 587.33, 0, 0, 0,
      // phrase 2: 下行回应
      523.25, 0, 440.00, 0, 392.00, 0, 0, 0,
      329.63, 0, 0, 0, 392.00, 0, 0, 0,
      // phrase 3: 跳跃
      587.33, 0, 783.99, 0, 880.00, 0, 0, 0,
      783.99, 0, 659.25, 0, 0, 0, 0, 0,
      // phrase 4: 归落
      523.25, 0, 0, 0, 392.00, 0, 329.63, 0,
      261.63, 0, 0, 0, 0, 0, 0, 0,
    ];
    // 低音和弦（每 8 拍换一次）
    const chords = [
      [130.81, 196.00, 261.63],   // C3 G3 C4
      [146.83, 220.00, 293.66],   // D3 A3 D4
      [196.00, 246.94, 392.00],   // G3 B3 G4
      [130.81, 196.00, 261.63],   // C3 G3 C4
    ];

    let step = 0;
    const noteInterval = 500; // 0.5s per step, ~30 BPM feel

    const playPianoNote = (freq, vol, duration, detune=0) => {
      if(freq === 0) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.detune.value = detune;

      const now = ctx.currentTime;
      // 软起音，长延音
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.08);
      gain.gain.linearRampToValueAtTime(vol * 0.5, now + 0.5);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      // 低通滤波模拟柔和音色
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2500;
      filter.Q.value = 0.5;

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration);

      // 泛音（增加钢琴质感）
      if(vol > 0.05){
        const harm = ctx.createOscillator();
        const harmGain = ctx.createGain();
        harm.type = 'sine';
        harm.frequency.value = freq * 2;
        harmGain.gain.setValueAtTime(0, now);
        harmGain.gain.linearRampToValueAtTime(vol * 0.15, now + 0.1);
        harmGain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.7);
        harm.connect(harmGain);
        harmGain.connect(ctx.destination);
        harm.start(now);
        harm.stop(now + duration);
      }
    };

    const tick = () => {
      if(!pixelPiano) return;
      // 旋律音
      const note = melody[step % melody.length];
      if(note > 0) playPianoNote(note, 0.14, 2.5);

      // 每 8 步播一次低音和弦（持续 4 秒）
      if(step % 8 === 0){
        const chord = chords[Math.floor(step / 8) % chords.length];
        chord.forEach(f => playPianoNote(f, 0.05, 4.0));
      }

      step++;
    };

    pixelPiano = {
      stop: () => { step = -100; } // 标记停止
    };
    tick();
    const interval = setInterval(tick, noteInterval);
    pixelPiano.stop = () => { clearInterval(interval); };
    pixelTimers.push(interval);
  }catch(e){ /* 静默失败 */ }
}

function startPixel(){
  const input = document.getElementById('pixelInput');
  const text = input.value.trim();
  if(!text){ toast('写下你的烦恼再交给星空吧～'); return; }
  const wrap = document.getElementById('pixelInputWrap');
  wrap.classList.add('fade-out');
  setTimeout(()=>{ wrap.style.display='none'; }, 800);
  // 创建气泡
  const area = document.getElementById('pixelArea');
  // 先撒星星
  createPixelStars(area);
  // 创建圆润的圆形烦恼星星
  const bubble = document.createElement('div');
  bubble.className = 'pixel-bubble';
  bubble.textContent = text;
  bubble.style.left = '50%';
  bubble.style.top = '42%';
  bubble.style.transform = 'translate(-50%,-50%)';
  bubble.style.transition = 'all .5s linear';
  area.appendChild(bubble);
  // 引导文字
  const guide = document.createElement('div');
  guide.className = 'pixel-guide';
  guide.textContent = '深呼吸，看着你的烦恼...';
  area.appendChild(guide);
  // 计时器
  const timerEl = document.getElementById('pixelTimer');
  // 开始钢琴曲
  startPixelPiano();
  // 60秒动画
  let elapsed = 0;
  const total = 60;
  const guides = [
    {t:0,  msg:'深呼吸，看着你的烦恼...'},
    {t:8,  msg:'你在宇宙中很渺小，这个烦恼也是。'},
    {t:18, msg:'看着它慢慢变小、变远...'},
    {t:28, msg:'宇宙很大，而烦恼正在消散...'},
    {t:38, msg:'你正在抽离，烦恼只是一段思绪，不是你。'},
    {t:48, msg:'它已经很小了，马上就要消失...'},
    {t:56, msg:'最后几秒... 让它去吧。'},
    {t:60, msg:'✨ 烦恼已消散在星空中。你自由了。'},
  ];
  let guideIdx = 0;
  const tick = setInterval(()=>{
    elapsed++;
    timerEl.textContent = elapsed < total ? (total-elapsed)+'s' : '';
    // 更新引导文字
    while(guideIdx < guides.length-1 && elapsed >= guides[guideIdx+1].t){
      guideIdx++;
      guide.style.opacity = '0';
      setTimeout(()=>{
        guide.textContent = guides[guideIdx].msg;
        guide.style.opacity = '1';
      }, 800);
    }
    // 气泡缩小 + 飘远
    const progress = elapsed / total;
    const scale = 1 - progress * 0.92;  // 从1缩到0.08
    const yOffset = -progress * 120;     // 向上飘
    const xOffset = Math.sin(progress*3)*progress*30; // 轻微左右飘
    const opacity = elapsed > 50 ? Math.max(0, 1-(elapsed-50)/10) : 1;
    bubble.style.transform = `translate(calc(-50% + ${xOffset}px), calc(-50% + ${yOffset}px)) scale(${scale})`;
    bubble.style.opacity = opacity;
    if(elapsed >= total){
      clearInterval(tick);
      bubble.style.transition = 'all 1s ease';
      bubble.style.opacity = '0';
      bubble.style.transform = `translate(calc(-50% + ${xOffset}px), calc(-50% + ${yOffset-60}px)) scale(0.02)`;
      setTimeout(()=>bubble.remove(), 1000);
      stopPixelPiano();
    }
  }, 1000);
  pixelTimers.push(tick);
}

function stopPixelPiano(){

}

function createPixelStars(area){

let fragCurrentType = 'good';

function getFragments(){
  return Store.get('fragments', {stars:[], sealed:[]});
}

function setFragments(data){
  Store.set('fragments', data);
}

function setFragType(type){
  fragCurrentType = type;
  const goodBtn = document.getElementById('fragTypeGood');
  const badBtn = document.getElementById('fragTypeBad');
  const submitBtn = document.getElementById('fragSubmitBtn');
  const textarea = document.getElementById('fragInput');
  if(type === 'good'){
    goodBtn.classList.add('active'); badBtn.classList.remove('active');
    submitBtn.className = 'frag-submit good';
    textarea.placeholder = '写下此刻让你开心的小事...';
  } else {
    badBtn.classList.add('active'); goodBtn.classList.remove('active');
    submitBtn.className = 'frag-submit bad';
    textarea.placeholder = '写下此刻让你烦恼的小事...';
  }
}

function switchFragTab(tab, btn){
  document.querySelectorAll('.frag-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.frag-tab-content').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='record') document.getElementById('fragRecord').classList.add('active');
  if(tab==='stars') { document.getElementById('fragStars').classList.add('active'); renderFragStars(); }
  if(tab==='sealed') { document.getElementById('fragSealed').classList.add('active'); renderFragSealed(); }
}

function addFragment(){
  const input = document.getElementById('fragInput');
  const text = input.value.trim();
  if(!text){ toast('写点什么再收纳吧～'); return; }

  const data = getFragments();
  const now = new Date();
  const dateStr = `${now.getMonth()+1}月${now.getDate()}日 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  if(fragCurrentType === 'good'){
    data.stars.push({text, date:dateStr, id:Date.now()});
    toast('✨ 美好碎片已收藏，变成了一颗星！');
  } else {
    data.sealed.push({text, date:dateStr, id:Date.now(), unsealed:false});
    toast('🌑 烦恼已封存。它被安全地收着了。');
  }
  setFragments(data);
  input.value = '';
  // 更新统计
  const stats = document.querySelector('.frag-stats');
  if(stats){
    stats.innerHTML = `
      <div class="frag-stat"><div class="num" style="color:var(--accent-gold)">✨${data.stars.length}</div><div class="label">美好碎片</div></div>
      <div class="frag-stat"><div class="num" style="color:var(--accent-pink)">🌑${data.sealed.length}</div><div class="label">封存烦恼</div></div>
      <div class="frag-stat"><div class="num" style="color:var(--primary)">🫙${data.stars.length + data.sealed.length}</div><div class="label">碎片总数</div></div>
    `;
  }
  renderFragStars();
  renderFragSealed();
  checkReward('fragment');
}

function renderFragStars(){
  const el = document.getElementById('starGrid');
  if(!el) return;
  const data = getFragments();
  if(data.stars.length === 0){
    el.innerHTML = '<div style="text-align:center;opacity:.5;padding:40px 0;font-size:14px;">还没有美好碎片。记录一个开心的小事，它就会变成一颗星 ✨</div>';
    return;
  }
  const starEmojis = ['✨','⭐','🌟','💫','⚡','🔮'];
  el.innerHTML = data.stars.map((s, i)=>{
    const star = starEmojis[i % starEmojis.length];
    return `<div class="star-item">
      <div class="star-icon">${star}</div>
      <div class="star-text">${escapeHtml(s.text)}</div>
      <div style="font-size:9px;opacity:.4;margin-top:4px;">${s.date}</div>
    </div>`;
  }).join('');
}

function renderFragSealed(){
  const el = document.getElementById('sealedList');
  if(!el) return;
  const data = getFragments();
  if(data.sealed.length === 0){
    el.innerHTML = '<div style="text-align:center;opacity:.5;padding:40px 0;font-size:14px;">没有封存的烦恼。如果今天有不好的事，记录下来封存它吧</div>';
    return;
  }
  el.innerHTML = data.sealed.map(s=>`
    <div class="sealed-item">
      <span class="sealed-icon">${s.unsealed?'🔓':'🌑'}</span>
      <span class="sealed-text">${s.unsealed?escapeHtml(s.text):'<i style="opacity:.5">（已封存，点击查看）</i>'}</span>
      <span class="sealed-date">${s.date}</span>
      <button class="unseal-btn" onclick="toggleSeal(${s.id})">${s.unsealed?'封存':'查看'}</button>
      <button class="unseal-btn" onclick="delFragment(${s.id}, 'sealed')" style="color:var(--accent-pink);">删除</button>
    </div>
  `).join('');
}

function toggleSeal(id){
  const data = getFragments();
  const item = data.sealed.find(s=>s.id===id);
  if(item){ item.unsealed = !item.unsealed; setFragments(data); renderFragSealed(); }
}

function delFragment(id, type){
  const data = getFragments();
  if(type === 'sealed') data.sealed = data.sealed.filter(s=>s.id!==id);
  else data.stars = data.stars.filter(s=>s.id!==id);
  setFragments(data);
  renderFragStars();
  renderFragSealed();
  toast('已删除');
}
