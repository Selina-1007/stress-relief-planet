/* ---- 黑洞星云 Canvas 动画 ---- */
let bhAnimId = null;
let bhNebulaParticles = [];
let bhStartTime = 0;

function initBlackHoleCanvas(){
  const canvas = document.getElementById('bhCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = 320;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.scale(dpr, dpr);

  const cx = size / 2;
  const cy = size / 2;
  const eventHorizonR = 38; // 事件视界半径

  // 生成星云粒子
  bhNebulaParticles = [];
  for(let i = 0; i < 180; i++){
    const angle = Math.random() * Math.PI * 2;
    const dist = eventHorizonR + 10 + Math.random() * 120;
    bhNebulaParticles.push({
      angle: angle,
      dist: dist,
      baseDist: dist,
      speed: 0.008 + Math.random() * 0.02,
      size: 0.5 + Math.random() * 2.5,
      hue: Math.random() < 0.55 ? (260 + Math.random() * 40) : (210 + Math.random() * 30), // 紫色/蓝色
      alpha: 0.3 + Math.random() * 0.6,
      twinkle: Math.random() * Math.PI * 2,
    });
  }

  bhStartTime = performance.now();

  function draw(){
    const t = (performance.now() - bhStartTime) / 1000;
    ctx.clearRect(0, 0, size, size);

    // 外层光晕
    const glow = ctx.createRadialGradient(cx, cy, eventHorizonR, cx, cy, size/2);
    glow.addColorStop(0, 'rgba(76,29,149,0.3)');
    glow.addColorStop(0.3, 'rgba(109,40,217,0.15)');
    glow.addColorStop(0.6, 'rgba(59,130,246,0.08)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, size/2, 0, Math.PI*2);
    ctx.fill();

    // 吸积盘 — 旋转扭曲的色带
    ctx.save();
    ctx.translate(cx, cy);
    for(let layer = 0; layer < 3; layer++){
      ctx.rotate(t * (0.3 + layer * 0.15));
      const ringR = eventHorizonR + 20 + layer * 25;
      const grad = ctx.createRadialGradient(0, 0, ringR - 15, 0, 0, ringR + 20);
      const hueShift = layer === 0 ? 280 : (layer === 1 ? 250 : 220);
      grad.addColorStop(0, `hsla(${hueShift},80%,60%,0)`);
      grad.addColorStop(0.5, `hsla(${hueShift},80%,55%,${0.12 - layer*0.03})`);
      grad.addColorStop(1, `hsla(${hueShift},80%,40%,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, ringR + 20, ringR * 0.35, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // 星云粒子
    bhNebulaParticles.forEach(p=>{
      p.angle += p.speed; // 顺时针旋转
      p.twinkle += 0.05;
      const tw = 0.5 + Math.sin(p.twinkle) * 0.5;
      const x = cx + Math.cos(p.angle) * p.dist;
      const y = cy + Math.sin(p.angle) * p.dist * 0.4; // 椭圆轨道
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},80%,65%,${p.alpha * tw})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = `hsla(${p.hue},80%,60%,0.8)`;
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // 事件视界 — 纯黑核心
    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, eventHorizonR + 8);
    coreGrad.addColorStop(0, '#000000');
    coreGrad.addColorStop(0.7, '#000000');
    coreGrad.addColorStop(0.85, 'rgba(20,5,40,0.9)');
    coreGrad.addColorStop(1, 'rgba(76,29,149,0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, eventHorizonR + 8, 0, Math.PI*2);
    ctx.fill();

    // 视界边缘高光环
    ctx.strokeStyle = `rgba(168,85,247,${0.3 + Math.sin(t*2)*0.15})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, eventHorizonR + 2, 0, Math.PI*2);
    ctx.stroke();

    bhAnimId = requestAnimationFrame(draw);
  }
  draw();
}

/* ---- 文字粒子吞噬动画 ---- */
let bhParticles = [];
let bhParticleAnimId = null;
let bhOverlayCanvas = null;

function blackHoleDevour(){
  const ta = document.getElementById('bhText');
  const text = ta.value.trim();
  if(!text){
    const status = document.getElementById('bhStatus');
    status.textContent = '黑洞在等待...先写点什么吧';
    status.style.color = 'rgba(251,191,36,.6)';
    setTimeout(()=>{ status.style.color='rgba(255,255,255,.35)'; }, 2000);
    return;
  }

  const btn = document.getElementById('bhBtn');
  btn.disabled = true;
  btn.textContent = '吞噬中...';

  // 播放音效
  playBlackHoleSound();

  // 创建全屏粒子覆盖 canvas
  if(bhOverlayCanvas) bhOverlayCanvas.remove();
  bhOverlayCanvas = document.createElement('canvas');
  bhOverlayCanvas.className = 'bh-particle-overlay';
  document.body.appendChild(bhOverlayCanvas);
  const pctx = bhOverlayCanvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  bhOverlayCanvas.width = vw * dpr;
  bhOverlayCanvas.height = vh * dpr;
  bhOverlayCanvas.style.width = vw + 'px';
  bhOverlayCanvas.style.height = vh + 'px';
  pctx.scale(dpr, dpr);

  // 获取 textarea 和黑洞的位置（屏幕坐标）
  const taRect = ta.getBoundingClientRect();
  const bhCanvas = document.getElementById('bhCanvas');
  const bhRect = bhCanvas.getBoundingClientRect();

  // 黑洞中心屏幕坐标
  const bhCenterX = bhRect.left + bhRect.width / 2;
  const bhCenterY = bhRect.top + bhRect.height / 2;

  // 文字区域中心屏幕坐标
  const taCenterX = taRect.left + taRect.width / 2;
  const taCenterY = taRect.top + taRect.height / 2;

  // 将文字转为粒子
  bhParticles = [];
  const chars = text.split('');

  chars.forEach((ch, i)=>{
    if(ch === ' ' || ch === '\n') return;
    // 从文字区域随机位置出发
    const startX = taCenterX + (Math.random() - 0.5) * taRect.width * 0.7;
    const startY = taCenterY + (Math.random() - 0.5) * taRect.height * 0.7;
    const dx = bhCenterX - startX;
    const dy = bhCenterY - startY;
    const dist = Math.sqrt(dx*dx + dy*dy) + 1;
    // 初始切向速度（顺时针）
    const perpX = -dy / dist;
    const perpY = dx / dist;

    bhParticles.push({
      x: startX,
      y: startY,
      vx: perpX * (0.3 + Math.random() * 0.5),
      vy: perpY * (0.3 + Math.random() * 0.5),
      char: ch,
      size: 8 + Math.random() * 6,
      hue: Math.random() < 0.5 ? (270 + Math.random() * 30) : (210 + Math.random() * 30),
      alpha: 1,
      scale: 1,
      life: 0,
      maxLife: 120 + Math.random() * 60,
      delay: i * 2,
    });
  });

  // 清空文本框
  ta.value = '';
  document.getElementById('bhCharNum').textContent = '0';

  const status = document.getElementById('bhStatus');
  status.textContent = '粒子正在被引力捕获...';
  status.style.color = 'rgba(168,85,247,.6)';

  // 启动粒子动画
  let frame = 0;
  function animateParticles(){
    pctx.clearRect(0, 0, vw, vh);
    let alive = 0;

    bhParticles.forEach(p=>{
      if(frame < p.delay) { alive++; return; }
      p.life++;

      const dx = bhCenterX - p.x;
      const dy = bhCenterY - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 1;

      // 引力加速度
      const gravity = 0.15 + (1 / Math.max(dist, 20)) * 50;
      p.vx += (dx / dist) * gravity * 0.3;
      p.vy += (dy / dist) * gravity * 0.3;

      // 切向力（顺时针旋转）
      const tx = -dy / dist;
      const ty = dx / dist;
      const tangForce = 0.08 + (1 / Math.max(dist, 30)) * 20;
      p.vx += tx * tangForce;
      p.vy += ty * tangForce;

      // 阻尼
      p.vx *= 0.97;
      p.vy *= 0.97;

      p.x += p.vx;
      p.y += p.vy;

      // 接近中心时缩小、消失
      if(dist < 45){
        p.scale *= 0.9;
        p.alpha *= 0.88;
      }

      if(p.life > p.maxLife) p.alpha *= 0.92;
      if(p.alpha > 0.02 && p.scale > 0.05) alive++;

      // 绘制粒子
      pctx.save();
      pctx.globalAlpha = p.alpha;
      pctx.translate(p.x, p.y);
      pctx.scale(p.scale, p.scale);
      pctx.font = `${p.size}px sans-serif`;
      pctx.textAlign = 'center';
      pctx.textBaseline = 'middle';
      pctx.shadowBlur = 12;
      pctx.shadowColor = `hsla(${p.hue},80%,60%,0.9)`;
      pctx.fillStyle = `hsla(${p.hue},80%,75%,${p.alpha})`;
      pctx.fillText(p.char, 0, 0);
      pctx.restore();
    });

    frame++;
    if(alive > 0 && frame < 400){
      bhParticleAnimId = requestAnimationFrame(animateParticles);
    } else {
      // 吞噬完成 — 清理覆盖canvas
      pctx.clearRect(0, 0, vw, vh);
      bhParticles = [];
      if(bhOverlayCanvas){ bhOverlayCanvas.remove(); bhOverlayCanvas = null; }

      // 中心闪烁
      const flash = document.getElementById('bhFlash');
      flash.classList.remove('active');
      void flash.offsetWidth; // 触发重绘
      flash.classList.add('active');

      // 更新计数
      bhCount++;
      Store.set('bh_count', bhCount);
      document.getElementById('bhCountText').textContent = `已吞噬 ${bhCount} 次烦恼`;

      // 更新状态文字
      const messages = [
        '吞噬完成。你的烦恼已化为宇宙尘埃。',
        '黑洞已将你的秘密封存在事件视界之内。',
        '完成了。那些文字在另一个维度已不再存在。',
        '引力收割完毕。你比刚才轻盈了一些。',
        '已吞噬。宇宙替你保管了这个秘密。',
      ];
      status.textContent = messages[Math.floor(Math.random() * messages.length)];
      status.style.color = 'rgba(168,85,247,.6)';

      btn.disabled = false;
      btn.textContent = '丢入黑洞';

      // 检查成就
      checkBlackHoleAchievement(bhCount);

      setTimeout(()=>{
        status.textContent = '黑洞在静静地旋转，等待你的烦恼...';
        status.style.color = 'rgba(255,255,255,.35)';
      }, 4000);
    }
  }
  animateParticles();
}

/* ---- Web Audio 音效（宇宙风暴 Whoosh）---- */
let bhAudioCtx = null;
function playBlackHoleSound(){
  // ==========================================
  // 音效说明：
  // 当前使用 Web Audio API 程序化生成"宇宙风暴吸入"音效，
  // 无需外部音频文件，完全前端运行。
  //
  // 如需替换为真实音频文件，取消下方注释并替换 URL：
  // const audio = new Audio('https://your-cdn.com/blackhole-whoosh.mp3');
  // audio.volume = 0.5;
  // audio.play();
  // return;
  // ==========================================

  try{
    if(!bhAudioCtx) bhAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = bhAudioCtx;
    if(ctx.state === 'suspended') ctx.resume();

    const now = ctx.currentTime;
    const duration = 2.5;

    // 主体：低频吸入 Whoosh（白噪声 + 低通滤波器扫描）
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufferSize; i++){
      // 淡入淡出包络
      const t = i / bufferSize;
      let env = 1;
      if(t < 0.1) env = t / 0.1;
      else if(t > 0.7) env = (1 - t) / 0.3;
      data[i] = (Math.random() * 2 - 1) * env * 0.6;
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    // 低通滤波器 — 频率从高到低扫描（模拟吸入感）
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2000, now);
    filter.frequency.exponentialRampToValueAtTime(80, now + duration);
    filter.Q.setValueAtTime(8, now);

    // 音量包络
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.4, now + 0.1);
    gain.gain.linearRampToValueAtTime(0.3, now + 1.0);
    gain.gain.linearRampToValueAtTime(0, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start(now);
    noise.stop(now + duration);

    // 叠加低频振荡 — 深邃的嗡鸣
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(55, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + duration);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0, now);
    oscGain.gain.linearRampToValueAtTime(0.15, now + 0.3);
    oscGain.gain.linearRampToValueAtTime(0, now + duration);
    osc.connect(oscGain);
    oscGain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration);

    // 吞噬完成时的"啵"声（短促低频脉冲）
    const popOsc = ctx.createOscillator();
    popOsc.type = 'sine';
    popOsc.frequency.setValueAtTime(120, now + 1.8);
    popOsc.frequency.exponentialRampToValueAtTime(40, now + 2.2);
    const popGain = ctx.createGain();
    popGain.gain.setValueAtTime(0, now + 1.8);
    popGain.gain.linearRampToValueAtTime(0.2, now + 1.85);
    popGain.gain.exponentialRampToValueAtTime(0.001, now + 2.3);
    popOsc.connect(popGain);
    popGain.connect(ctx.destination);
    popOsc.start(now + 1.8);
    popOsc.stop(now + 2.3);

  }catch(e){
    console.warn('Black hole sound failed:', e);
  }
}

/* ============================================================
   减压气泡膜 — 3D气泡网格 + Pop音效 + 漂浮文字 + 金气泡彩蛋
   ============================================================ */
const BUBBLE_PALETTES = [
  { color:'#a7f3d0', dark:'#68d391' }, // 薄荷绿
  { color:'#bfdbfe', dark:'#93c5fd' }, // 淡粉蓝
  { color:'#ddd6fe', dark:'#c4b5fd' }, // 芋泥紫
  { color:'#fbcfe8', dark:'#f9a8d4' }, // 淡粉色
  { color:'#fef3c7', dark:'#fde68a' }, // 暖黄色
];
const BUBBLE_FLOAT_TEXTS = ['呼~','放轻松','压力-1','啊~','舒服了','呼气','释放~','没事的','深呼吸','安静了','好多了','轻了'];
let bubblePopCount = 0;
let bubblePopSinceGold = 0;
let bubbleAudioCtx = null;
let bubbleFloatArea = null;

function initBubbleWrap(){
  bubblePopCount = 0;
  bubblePopSinceGold = 0;
  buildBubbleGrid();
  updateBubbleStats();
  // 创建漂浮文字容器
  if(!bubbleFloatArea || !document.body.contains(bubbleFloatArea)){
    bubbleFloatArea = document.createElement('div');
    bubbleFloatArea.className = 'bubble-float-area';
    bubbleFloatArea.id = 'bubbleFloatArea';
    document.body.appendChild(bubbleFloatArea);
  }
}

function buildBubbleGrid(){
  const grid = document.getElementById('bubbleGrid');
  if(!grid) return;
  grid.innerHTML = '';

  // 响应式：根据容器宽度计算列数和气泡大小
  const containerW = grid.parentElement.offsetWidth || 400;
  let cols, bubbleSize;
  if(containerW < 320){ cols = 6; bubbleSize = 36; }
  else if(containerW < 480){ cols = 8; bubbleSize = 42; }
  else if(containerW < 680){ cols = 10; bubbleSize = 48; }
  else { cols = 12; bubbleSize = 52; }

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.setProperty('--bw', bubbleSize + 'px');

  const rows = Math.ceil((cols * 5) / cols); // 约5行
  const total = cols * rows;

  for(let i = 0; i < total; i++){
    const palette = BUBBLE_PALETTES[Math.floor(Math.random() * BUBBLE_PALETTES.length)];
    const cell = document.createElement('div');
    cell.className = 'bubble-cell';
    cell.style.setProperty('--bubble-color', palette.color);
    cell.style.setProperty('--bubble-color-dark', palette.dark);
    cell.innerHTML = '<div class="bubble-dome"></div>';
    cell.addEventListener('click', ()=>popBubble(cell));
    grid.appendChild(cell);
  }
}

function popBubble(cell){
  if(cell.classList.contains('pop')) return;

  // 金气泡特殊处理
  const isGold = cell.classList.contains('gold');

  cell.classList.add('pop');

  // 播放音效
  playBubblePopSound(isGold);

  // 漂浮文字
  showBubbleFloatText(isGold);

  if(isGold){
    // 金气泡：满屏彩屑
    triggerConfetti();
    cell.classList.remove('gold');
  }

  bubblePopCount++;
  bubblePopSinceGold++;
  updateBubbleStats();

  // 每20个触发金气泡
  if(bubblePopSinceGold >= 20){
    bubblePopSinceGold = 0;
    spawnGoldBubble();
  }
}

function spawnGoldBubble(){
  const grid = document.getElementById('bubbleGrid');
  if(!grid) return;
  const cells = grid.querySelectorAll('.bubble-cell:not(.pop)');
  if(cells.length === 0) return;

/* ---- Pop 音效（3种清脆音调）---- */
function playBubblePopSound(isGold){
  // ==========================================
  // 音效说明：
  // 使用 Web Audio API 程序化生成清脆的 "Pop" 破裂声。
  // 无需外部音频文件，完全前端运行。
  //
  // 如需替换为真实音频文件，取消下方注释并替换 URL：
  // const audio = new Audio('https://your-cdn.com/pop-sound.mp3');
  // audio.volume = 0.4;
  // audio.play();
  // return;
  // ==========================================

  try{
    if(!bubbleAudioCtx) bubbleAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = bubbleAudioCtx;
    if(ctx.state === 'suspended') ctx.resume();

    const now = ctx.currentTime;

    if(isGold){
      // 金气泡：更华丽的音效
      // 主 Pop
      const osc1 = ctx.createOscillator();
      osc1.type = 'sine';
      const baseFreq = 800 + Math.random() * 200;
      osc1.frequency.setValueAtTime(baseFreq, now);
      osc1.frequency.exponentialRampToValueAtTime(baseFreq * 0.3, now + 0.08);
      const gain1 = ctx.createGain();
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.12);

      // 叠加叮当声
      const osc2 = ctx.createOscillator();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(1600, now);
      osc2.frequency.exponentialRampToValueAtTime(2400, now + 0.15);
      const gain2 = ctx.createGain();
      gain2.gain.setValueAtTime(0.15, now + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + 0.2);
      return;
    }

    // 普通 Pop：3种随机音调
    const pitches = [600, 800, 1000];
    const freq = pitches[Math.floor(Math.random() * pitches.length)] + Math.random() * 100;

    // 主体：快速下降的正弦波（模拟"啵"的弹性破裂感）
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.25, now + 0.06);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.25, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);

    // 叠加短促噪声（模拟塑料薄膜破裂的"沙"声）
    const bufferSize = ctx.sampleRate * 0.04;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufferSize; i++){
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3)) * 0.15;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 2000;
    const noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.1;
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start(now);
  }catch(e){
    console.warn('Bubble pop sound failed:', e);
  }
}

   烦恼黑洞（压力释放版）— 复用主黑洞逻辑
   ============================================================ */
let bhStressAnimId = null;
let bhStressNebula = [];
let bhStressParticles = [];
let bhStressParticleAnimId = null;
let bhStressOverlay = null;
let bhStressStartTime = 0;
let bhStressCount = 0;

function initBlackHoleStress(){

function initBlackHoleStressCanvas(){
  const canvas = document.getElementById('bhCanvasStress');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = 320;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2;
  const eventHorizonR = 38;

  bhStressNebula = [];
  for(let i = 0; i < 180; i++){
    const angle = Math.random() * Math.PI * 2;
    const dist = eventHorizonR + 10 + Math.random() * 120;
    bhStressNebula.push({
      angle, dist, speed: 0.008 + Math.random() * 0.02,
      size: 0.5 + Math.random() * 2.5,
      hue: Math.random() < 0.55 ? (260 + Math.random() * 40) : (210 + Math.random() * 30),
      alpha: 0.3 + Math.random() * 0.6,
      twinkle: Math.random() * Math.PI * 2,
    });
  }

  bhStressStartTime = performance.now();

  function draw(){
    const t = (performance.now() - bhStressStartTime) / 1000;
    ctx.clearRect(0, 0, size, size);

    // 外层光晕
    const glow = ctx.createRadialGradient(cx, cy, eventHorizonR, cx, cy, size/2);
    glow.addColorStop(0, 'rgba(76,29,149,0.3)');
    glow.addColorStop(0.3, 'rgba(109,40,217,0.15)');
    glow.addColorStop(0.6, 'rgba(59,130,246,0.08)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, size/2, 0, Math.PI*2);
    ctx.fill();

    // 吸积盘
    ctx.save();
    ctx.translate(cx, cy);
    for(let layer = 0; layer < 3; layer++){
      ctx.rotate(t * (0.3 + layer * 0.15));
      const ringR = eventHorizonR + 20 + layer * 25;
      const grad = ctx.createRadialGradient(0, 0, ringR - 15, 0, 0, ringR + 20);
      const hueShift = layer === 0 ? 280 : (layer === 1 ? 250 : 220);
      grad.addColorStop(0, `hsla(${hueShift},80%,60%,0)`);
      grad.addColorStop(0.5, `hsla(${hueShift},80%,55%,${0.12 - layer*0.03})`);
      grad.addColorStop(1, `hsla(${hueShift},80%,40%,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, ringR + 20, ringR * 0.35, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // 星云粒子
    bhStressNebula.forEach(p=>{
      p.angle += p.speed;
      p.twinkle += 0.05;
      const tw = 0.5 + Math.sin(p.twinkle) * 0.5;
      const x = cx + Math.cos(p.angle) * p.dist;
      const y = cy + Math.sin(p.angle) * p.dist * 0.4;
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},80%,65%,${p.alpha * tw})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = `hsla(${p.hue},80%,60%,0.8)`;
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // 事件视界
    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, eventHorizonR + 8);
    coreGrad.addColorStop(0, '#000000');
    coreGrad.addColorStop(0.7, '#000000');
    coreGrad.addColorStop(0.85, 'rgba(20,5,40,0.9)');
    coreGrad.addColorStop(1, 'rgba(76,29,149,0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, eventHorizonR + 8, 0, Math.PI*2);
    ctx.fill();

    // 视界边缘高光环
    ctx.strokeStyle = `rgba(168,85,247,${0.3 + Math.sin(t*2)*0.15})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, eventHorizonR + 2, 0, Math.PI*2);
    ctx.stroke();

    bhStressAnimId = requestAnimationFrame(draw);
  }
  draw();
}

function blackHoleDevourStress(){
  const ta = document.getElementById('bhTextStress');
  const text = ta.value.trim();
  if(!text){
    const status = document.getElementById('bhStatusStress');
    status.textContent = '黑洞在等待...先写点什么吧';
    status.style.color = 'rgba(251,191,36,.6)';
    setTimeout(()=>{ status.style.color='rgba(255,255,255,.35)'; }, 2000);
    return;
  }

  const btn = document.getElementById('bhBtnStress');
  btn.disabled = true;
  btn.textContent = '吞噬中...';

  playBlackHoleSound();

  // 创建全屏粒子覆盖 canvas
  if(bhStressOverlay) bhStressOverlay.remove();
  bhStressOverlay = document.createElement('canvas');
  bhStressOverlay.className = 'bh-particle-overlay';
  document.body.appendChild(bhStressOverlay);
  const pctx = bhStressOverlay.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const vw = window.innerWidth, vh = window.innerHeight;
  bhStressOverlay.width = vw * dpr;
  bhStressOverlay.height = vh * dpr;
  bhStressOverlay.style.width = vw + 'px';
  bhStressOverlay.style.height = vh + 'px';
  pctx.scale(dpr, dpr);

  const taRect = ta.getBoundingClientRect();
  const bhCanvas = document.getElementById('bhCanvasStress');
  const bhRect = bhCanvas.getBoundingClientRect();
  const bhCenterX = bhRect.left + bhRect.width / 2;
  const bhCenterY = bhRect.top + bhRect.height / 2;
  const taCenterX = taRect.left + taRect.width / 2;
  const taCenterY = taRect.top + taRect.height / 2;

  bhStressParticles = [];
  const chars = text.split('');

  chars.forEach((ch, i)=>{
    if(ch === ' ' || ch === '\n') return;
    const startX = taCenterX + (Math.random() - 0.5) * taRect.width * 0.7;
    const startY = taCenterY + (Math.random() - 0.5) * taRect.height * 0.7;
    const dx = bhCenterX - startX;
    const dy = bhCenterY - startY;
    const dist = Math.sqrt(dx*dx + dy*dy) + 1;
    const perpX = -dy / dist;
    const perpY = dx / dist;

    bhStressParticles.push({
      x: startX, y: startY,
      vx: perpX * (0.3 + Math.random() * 0.5),
      vy: perpY * (0.3 + Math.random() * 0.5),
      char: ch,
      size: 8 + Math.random() * 6,
      hue: Math.random() < 0.5 ? (270 + Math.random() * 30) : (210 + Math.random() * 30),
      alpha: 1, scale: 1, life: 0,
      maxLife: 120 + Math.random() * 60,
      delay: i * 2,
    });
  });

  ta.value = '';
  const cn = document.getElementById('bhCharNumStress');
  if(cn) cn.textContent = '0';

  const status = document.getElementById('bhStatusStress');
  status.textContent = '粒子正在被引力捕获...';
  status.style.color = 'rgba(168,85,247,.6)';

  let frame = 0;
  function animateParticles(){
    pctx.clearRect(0, 0, vw, vh);
    let alive = 0;

    bhStressParticles.forEach(p=>{
      if(frame < p.delay) { alive++; return; }
      p.life++;
      const dx = bhCenterX - p.x;
      const dy = bhCenterY - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 1;

      const gravity = 0.15 + (1 / Math.max(dist, 20)) * 50;
      p.vx += (dx / dist) * gravity * 0.3;
      p.vy += (dy / dist) * gravity * 0.3;

      const tx = -dy / dist, ty = dx / dist;
      const tangForce = 0.08 + (1 / Math.max(dist, 30)) * 20;
      p.vx += tx * tangForce;
      p.vy += ty * tangForce;

      p.vx *= 0.97;
      p.vy *= 0.97;
      p.x += p.vx;
      p.y += p.vy;

      if(dist < 45){ p.scale *= 0.9; p.alpha *= 0.88; }
      if(p.life > p.maxLife) p.alpha *= 0.92;
      if(p.alpha > 0.02 && p.scale > 0.05) alive++;

      pctx.save();
      pctx.globalAlpha = p.alpha;
      pctx.translate(p.x, p.y);
      pctx.scale(p.scale, p.scale);
      pctx.font = `${p.size}px sans-serif`;
      pctx.textAlign = 'center';
      pctx.textBaseline = 'middle';
      pctx.shadowBlur = 12;
      pctx.shadowColor = `hsla(${p.hue},80%,60%,0.9)`;
      pctx.fillStyle = `hsla(${p.hue},80%,75%,${p.alpha})`;
      pctx.fillText(p.char, 0, 0);
      pctx.restore();
    });

    frame++;
    if(alive > 0 && frame < 400){
      bhStressParticleAnimId = requestAnimationFrame(animateParticles);
    } else {
      pctx.clearRect(0, 0, vw, vh);
      bhStressParticles = [];
      if(bhStressOverlay){ bhStressOverlay.remove(); bhStressOverlay = null; }

      const flash = document.getElementById('bhFlashStress');
      flash.classList.remove('active');
      void flash.offsetWidth;
      flash.classList.add('active');

      bhStressCount++;
      Store.set('bh_count', bhStressCount);
      const countEl = document.getElementById('bhCountTextStress');
      if(countEl) countEl.textContent = `已吞噬 ${bhStressCount} 次烦恼`;

      const messages = [
        '吞噬完成。你的烦恼已化为宇宙尘埃。',
        '黑洞已将你的秘密封存在事件视界之内。',
        '完成了。那些文字在另一个维度已不再存在。',
        '引力收割完毕。你比刚才轻盈了一些。',
        '已吞噬。宇宙替你保管了这个秘密。',
      ];
      status.textContent = messages[Math.floor(Math.random() * messages.length)];
      status.style.color = 'rgba(168,85,247,.6)';

      btn.disabled = false;
      btn.textContent = '丢入黑洞';

      checkBlackHoleAchievement(bhStressCount);

      setTimeout(()=>{
        status.textContent = '黑洞在静静地旋转，等待你的烦恼...';
        status.style.color = 'rgba(255,255,255,.35)';
      }, 4000);
    }
  }
  animateParticles();
}

  csAnimId = requestAnimationFrame(csGameLoop);

  // 倒计时
  csTimerId = setInterval(()=>{
    csTimeLeft--;
    updateCSTimer();
    // 随机浮现温柔句子
    if(csTimeLeft > 0 && csTimeLeft % 12 === 0){
      showCSWhisper();
    }
    if(csTimeLeft <= 0){
      endCatchStar();
    }
  }, 1000);

  // 第一次浮现句子
  setTimeout(showCSWhisper, 5000);

  // 绑定输入
  bindCSControls();
}

function restartCatchStar(){
  document.getElementById('csEndOverlay').classList.remove('active');
  // 恢复 Lo-fi 音量
  if(csLoFiGain && csLoFiCtx){
    csLoFiGain.gain.linearRampToValueAtTime(0.12, csLoFiCtx.currentTime + 1);
  }
  startCatchStar();
}

function updateCSTimer(){
  const el = document.getElementById('csTimer');
  if(el) el.innerHTML = csTimeLeft + '<span class="unit">秒</span>';
}

function updateCSCaught(){
  const el = document.getElementById('csCaught');
  if(el) el.textContent = `已接住 ${csCaught} 颗星`;
}

function showCSWhisper(){
  const el = document.getElementById('csWhisper');
  if(!el) return;
  el.textContent = CS_WHISPERS[csWhisperIdx % CS_WHISPERS.length];
  csWhisperIdx++;
  el.classList.add('show');
  clearTimeout(csWhisperTimer);
  csWhisperTimer = setTimeout(()=>{
    el.classList.remove('show');
  }, 6000);
}

/* ---- 输入控制 ---- */
function bindCSControls(){
  const canvas = csCanvas;
  if(!canvas) return;

  // 鼠标移动
  canvas.addEventListener('mousemove', csOnMouseMove);
  // 触屏拖动
  canvas.addEventListener('touchmove', csOnTouchMove, {passive:false});
  canvas.addEventListener('touchstart', csOnTouchMove, {passive:false});
}

function csOnMouseMove(e){
  if(!csRunning) return;
  const rect = csCanvas.getBoundingClientRect();
  csTargetX = e.clientX - rect.left - csBasketW / 2;
}

function csOnTouchMove(e){
  if(!csRunning) return;
  e.preventDefault();
  const rect = csCanvas.getBoundingClientRect();
  const touch = e.touches[0];
  csTargetX = touch.clientX - rect.left - csBasketW / 2;
}

// 键盘控制
let csKeyLeft = false, csKeyRight = false;
document.addEventListener('keydown', csOnKeyDown);
document.addEventListener('keyup', csOnKeyUp);

function csOnKeyDown(e){
  if(!csRunning) return;
  if(e.key === 'ArrowLeft'){ csKeyLeft = true; e.preventDefault(); }
  if(e.key === 'ArrowRight'){ csKeyRight = true; e.preventDefault(); }
}
function csOnKeyUp(e){
  if(e.key === 'ArrowLeft') csKeyLeft = false;
  if(e.key === 'ArrowRight') csKeyRight = false;
}

/* ---- 游戏主循环 ---- */
let csStartTime = 0;
function csGameLoop(ts){
  if(!csRunning) return;

  // 键盘移动
  if(csKeyLeft) csTargetX -= 7;
  if(csKeyRight) csTargetX += 7;

  // 篮子平滑跟随（更快的响应）
  csBasketX += (csTargetX - csBasketX) * 0.3;
  csBasketX = Math.max(0, Math.min(csW - csBasketW, csBasketX));

  // 生成流星 — 更频繁
  if(ts - csLastMeteorTime > 300 + Math.random() * 400){
    csSpawnMeteor();
    csLastMeteorTime = ts;
  }

  // 更新流星
  csMeteors.forEach(m=>{
    m.y += m.vy;
    m.x += m.vx;
    m.rotation += m.rotSpeed;
    // 拖尾粒子
    if(Math.random() < 0.6){
      csTrails.push({
        x: m.x + (Math.random()-0.5)*4,
        y: m.y,
        size: m.size * (0.3 + Math.random()*0.4),
        alpha: 0.6,
        hue: m.hue,
        vy: -0.2 + Math.random()*0.3,
      });
    }
    // 碰撞检测（篮子接住）— 宽大的接住范围
    const basketTop = csH - 90;
    const basketLeft = csBasketX;
    const basketRight = csBasketX + csBasketW;
    if(m.y > basketTop && m.y < basketTop + 60 && m.x > basketLeft && m.x < basketRight && !m.caught){
      m.caught = true;
      csCaught++;
      updateCSCaught();
      playCSChime();
      // 融化暖光效果
      csCaughtGlows.push({
        x: m.x, y: basketTop + 10,
        radius: 0, maxRadius: 50,
        alpha: 1, hue: m.hue,
      });
    }
  });
  // 移除离开屏幕的流星（不扣分）
  csMeteors = csMeteors.filter(m => m.y < csH + 20 && !m.caught);

  // 更新拖尾
  csTrails.forEach(t=>{
    t.alpha *= 0.95;
    t.y += t.vy;
  });
  csTrails = csTrails.filter(t => t.alpha > 0.02);

  // 更新接住暖光
  csCaughtGlows.forEach(g=>{
    g.radius += 1.5;
    g.alpha *= 0.94;
  });
  csCaughtGlows = csCaughtGlows.filter(g => g.alpha > 0.02);

  drawCatchStarFrame();
  csAnimId = requestAnimationFrame(csGameLoop);
}

function csSpawnMeteor(){
  const hues = [45, 200, 260, 280, 320];
  // 星星和月亮等概率出现
  const isMoon = Math.random() < 0.5;
  csMeteors.push({
    x: 40 + Math.random() * (csW - 80),
    y: -20,
    vx: (Math.random() - 0.5) * 0.2,
    vy: 1.2 + Math.random() * 0.6,
    size: isMoon ? (5 + Math.random() * 3) : (3 + Math.random() * 4),
    hue: hues[Math.floor(Math.random() * hues.length)],
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.04,
    caught: false,
    type: isMoon ? 'moon' : 'star',
  });
}

/* ---- Canvas 绘制 ---- */
function drawCatchStarFrame(){
  if(!csCtx) return;
  const ctx = csCtx;

  // 清空（半透明叠加产生拖尾感）
  ctx.fillStyle = 'rgba(5,5,20,0.15)';
  ctx.fillRect(0, 0, csW, csH);

  // 背景星星
  csBgStars.forEach(s=>{
    s.twinkle += s.twinkleSpeed;
    const tw = 0.5 + Math.sin(s.twinkle) * 0.5;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.baseAlpha * tw})`;
    ctx.fill();
  });

  // 拖尾粒子
  csTrails.forEach(t=>{
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${t.hue},80%,70%,${t.alpha})`;
    ctx.shadowBlur = 6;
    ctx.shadowColor = `hsla(${t.hue},80%,60%,0.8)`;
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // 流星（星星 + 月亮）
  csMeteors.forEach(m=>{
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rotation);
    // 外光晕
    ctx.shadowBlur = m.type === 'moon' ? 25 : 18;
    ctx.shadowColor = `hsla(${m.hue},90%,60%,0.9)`;

    if(m.type === 'moon'){
      // 月亮 — 弯月造型 + 拖尾
      const r = m.size;
      // 月体（带渐变）
      const moonGrad = ctx.createRadialGradient(-r*0.3, -r*0.3, 0, 0, 0, r);
      moonGrad.addColorStop(0, `hsla(${m.hue},30%,95%,0.95)`);
      moonGrad.addColorStop(0.6, `hsla(${m.hue},40%,85%,0.9)`);
      moonGrad.addColorStop(1, `hsla(${m.hue},50%,65%,0.7)`);
      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI*2);
      ctx.fill();
      // 月牙暗面（弯月效果）
      ctx.fillStyle = `rgba(5,5,20,0.55)`;
      ctx.beginPath();
      ctx.arc(r * 0.35, 0, r * 0.9, 0, Math.PI*2);
      ctx.fill();
      // 月光高光
      ctx.fillStyle = `rgba(255,255,255,0.6)`;
      ctx.beginPath();
      ctx.arc(-r * 0.35, -r * 0.35, r * 0.25, 0, Math.PI*2);
      ctx.fill();
    } else {
      // 星形
      ctx.fillStyle = `hsla(${m.hue},90%,75%,0.95)`;
      ctx.beginPath();
      const r = m.size;
      for(let i = 0; i < 5; i++){
        const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
        const x1 = Math.cos(angle) * r;
        const y1 = Math.sin(angle) * r;
        const angle2 = ((i + 0.5) / 5) * Math.PI * 2 - Math.PI / 2;
        const x2 = Math.cos(angle2) * r * 0.4;
        const y2 = Math.sin(angle2) * r * 0.4;
        if(i === 0) ctx.moveTo(x1, y1);
        else ctx.lineTo(x1, y1);
        ctx.lineTo(x2, y2);
      }
      ctx.closePath();
      ctx.fill();
      // 中心亮点
      ctx.fillStyle = `rgba(255,255,255,0.9)`;
      ctx.beginPath();
      ctx.arc(0, 0, m.size * 0.3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });
  ctx.shadowBlur = 0;

  // 接住暖光
  csCaughtGlows.forEach(g=>{
    const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.radius);
    grad.addColorStop(0, `hsla(${g.hue},80%,80%,${g.alpha})`);
    grad.addColorStop(0.5, `hsla(${g.hue},70%,60%,${g.alpha*0.5})`);
    grad.addColorStop(1, `hsla(${g.hue},70%,40%,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius, 0, Math.PI*2);
    ctx.fill();
  });

  // 篮子（发光光圈风格）
  drawCSBasket(ctx);
}

function drawCSBasket(ctx){
  const x = csBasketX + csBasketW / 2;
  const y = csH - 65;
  const w = csBasketW;
  const h = 30;

  // 外光圈
  const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, w * 0.8);
  glowGrad.addColorStop(0, 'rgba(167,139,250,0.15)');
  glowGrad.addColorStop(0.5, 'rgba(109,40,217,0.08)');
  glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(x, y, w * 0.8, 0, Math.PI*2);
  ctx.fill();

  // 篮子主体 — 手绘风格弧形
  ctx.strokeStyle = 'rgba(196,181,253,0.7)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  // 底部弧
  ctx.beginPath();
  ctx.moveTo(x - w/2, y);
  ctx.quadraticCurveTo(x, y + h, x + w/2, y);
  ctx.stroke();
  // 顶部光弧
  ctx.strokeStyle = 'rgba(167,139,250,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x, y, w/2, 6, 0, 0, Math.PI*2);
  ctx.stroke();
  // 内部光弧
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - w/2 + 6, y + 2);
  ctx.quadraticCurveTo(x, y + h - 6, x + w/2 - 6, y + 2);
  ctx.stroke();
}

/* ---- 水晶敲击音效 ---- */
// 在用户手势内提前创建并解锁水晶音效的 AudioContext，避免第一次接住星星时不出声
function initCSChimeCtx(){
  try{
    if(!csChimeCtx) csChimeCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(csChimeCtx.state === 'suspended') csChimeCtx.resume();
  }catch(e){
    console.warn('Chime audio init failed:', e);
  }
}

function playCSChime(){
  // ==========================================
  // 音效说明：
  // 使用 Web Audio API 程序化生成空灵的水晶敲击声（Chime/Tinkle）。
  // 无需外部音频文件，完全前端运行。
  //
  // 如需替换为真实音频文件，取消下方注释并替换 URL：
  // const audio = new Audio('https://your-cdn.com/chime.mp3');
  // audio.volume = 0.3;
  // audio.play();
  // return;
  // ==========================================
  try{
    if(!csChimeCtx) csChimeCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = csChimeCtx;
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    // 随机选择音高（五声音阶高音区）
    const notes = [783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51];
    const freq = notes[Math.floor(Math.random() * notes.length)];

    // 主音 — 正弦波，较快起音 + 中等衰减（更清晰可闻，每颗星都能听到）
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.005); // 快速起音，确保立刻听到
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 2.2);

    // 泛音 — 高频共鸣（空灵感）
    const harm = ctx.createOscillator();
    harm.type = 'sine';
    harm.frequency.value = freq * 2.01;
    const harmGain = ctx.createGain();
    harmGain.gain.setValueAtTime(0, now);
    harmGain.gain.linearRampToValueAtTime(0.05, now + 0.008);
    harmGain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
    harm.connect(harmGain);
    harmGain.connect(ctx.destination);
    harm.start(now);
    harm.stop(now + 1.8);

    // 极轻的第二泛音（远处风铃声）
    const harm2 = ctx.createOscillator();
    harm2.type = 'sine';
    harm2.frequency.value = freq * 3.02;
    const harm2Gain = ctx.createGain();
    harm2Gain.gain.setValueAtTime(0, now);
    harm2Gain.gain.linearRampToValueAtTime(0.015, now + 0.01);
    harm2Gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
    harm2.connect(harm2Gain);
    harm2Gain.connect(ctx.destination);
    harm2.start(now);
    harm2.stop(now + 1.2);
  }catch(e){
    console.warn('Chime sound failed:', e);
  }
}

/* ---- Lo-fi 背景音乐 ---- */
function startCSLoFi(){
  // ==========================================
  // 音乐说明：
  // 使用 Web Audio API 程序化生成轻柔缓慢的 Lo-fi 伴奏。
  // 包含：柔和钢琴和弦循环 + 轻微黑胶底噪 + 低频 pad。
  // 无需外部音频文件，完全前端运行。
  //
  // 如需替换为真实 Lo-fi 音乐文件，取消下方注释并替换 URL：
  // const audio = new Audio('https://your-cdn.com/lofi-ambient.mp3');
  // audio.loop = true;
  // audio.volume = 0.15;
  // audio.play();
  // return;
  // ==========================================
  try{
    if(!csLoFiCtx) csLoFiCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = csLoFiCtx;
    if(ctx.state === 'suspended') ctx.resume();

    // 主增益（用于结束时渐弱）
    csLoFiGain = ctx.createGain();
    csLoFiGain.gain.value = 0;
    csLoFiGain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 2);
    // 低通滤波营造温暖感
    const masterFilter = ctx.createBiquadFilter();
    masterFilter.type = 'lowpass';
    masterFilter.frequency.value = 1800;
    masterFilter.Q.value = 0.3;
    csLoFiGain.connect(masterFilter);
    masterFilter.connect(ctx.destination);

    // Lo-fi 和弦进行（Cmaj7 → Am7 → Fmaj7 → G6）
    const chords = [
      [130.81, 164.81, 196.00, 246.94],  // C E G B = Cmaj7
      [110.00, 130.81, 164.81, 220.00],   // A C E A = Am7
      [87.31, 130.81, 174.61, 220.00],    // F A C F? → F A C E? → Fmaj7
      [98.00, 123.47, 146.83, 196.00],     // G B D G = G6
    ];

    let chordStep = 0;
    const chordDuration = 4; // 每和弦4秒

    const playChordPad = (freqs, vol) => {
      freqs.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.detune.value = (Math.random() - 0.5) * 8; // 轻微失谐
        const g = ctx.createGain();
        const now = ctx.currentTime;
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(vol, now + 1.5);
        g.gain.linearRampToValueAtTime(vol * 0.7, now + chordDuration - 1);
        g.gain.exponentialRampToValueAtTime(0.001, now + chordDuration);
        osc.connect(g);
        g.connect(csLoFiGain);
        osc.start(now);
        osc.stop(now + chordDuration);
      });
    };

    // 旋律点缀（五声音阶随机音符）
    const melodyNotes = [523.25, 587.33, 659.25, 783.99, 880.00];
    const playMelodyNote = () => {
      if(!csRunning) return;
      const freq = melodyNotes[Math.floor(Math.random() * melodyNotes.length)];
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const g = ctx.createGain();
      const now = ctx.currentTime;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.04, now + 0.3);
      g.gain.exponentialRampToValueAtTime(0.001, now + 2);
      osc.connect(g);
      g.connect(csLoFiGain);
      osc.start(now);
      osc.stop(now + 2);
    };

    // 黑胶底噪
    const playVinylNoise = () => {
      if(!csRunning) return;
      const bufSize = ctx.sampleRate * 2;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i = 0; i < bufSize; i++){
        data[i] = (Math.random() * 2 - 1) * 0.015;
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 3000;
      filter.Q.value = 0.5;
      src.connect(filter);
      filter.connect(g);
      g.connect(csLoFiGain);
      src.start();
      return src;
    };

    // 启动黑胶噪声
    const vinyl = playVinylNoise();

    // 和弦循环
    playChordPad(chords[0], 0.04);
    csLoFiId = setInterval(()=>{
      if(!csRunning) return;
      chordStep = (chordStep + 1) % chords.length;
      playChordPad(chords[chordStep], 0.04);
      // 随机旋律点缀
      if(Math.random() < 0.6){
        setTimeout(playMelodyNote, 500 + Math.random() * 2000);
      }
    }, chordDuration * 1000);

    // 保存 vinyl 引用用于清理
    csLoFiVinyl = vinyl;
  }catch(e){
    console.warn('Lo-fi music failed:', e);
  }
}

function stopCSLoFi(){
  if(csLoFiId){ clearInterval(csLoFiId); csLoFiId = null; }
  if(csLoFiVinyl){ try{ csLoFiVinyl.stop(); }catch(e){} csLoFiVinyl = null; }
}

/* ---- 游戏结束 ---- */
function endCatchStar(){
  csRunning = false;
  clearInterval(csTimerId);
  csTimerId = null;
  clearTimeout(csWhisperTimer);

  // 隐藏 whisper
  const w = document.getElementById('csWhisper');
  if(w) w.classList.remove('show');

  // 音乐渐弱
  if(csLoFiGain && csLoFiCtx){
    csLoFiGain.gain.linearRampToValueAtTime(0, csLoFiCtx.currentTime + 3);
  }
  setTimeout(()=>{
    stopCSLoFi();
  }, 3500);

  // 显示结束界面
  setTimeout(()=>{
    const overlay = document.getElementById('csEndOverlay');
    if(overlay) overlay.classList.add('active');
  }, 800);

  // 继续画几帧让动画自然停止
  setTimeout(()=>{
    if(csAnimId){ cancelAnimationFrame(csAnimId); csAnimId = null; }
  }, 1000);

  // 检查成就
  if(csCaught >= 1){
    toast('🌠 你接住了 ' + csCaught + ' 颗星，给自己的一分钟点赞！');
  }
}

/* ---- 清理函数 ---- */
function stopCatchStarAll(){
  csRunning = false;
  if(csAnimId){ cancelAnimationFrame(csAnimId); csAnimId = null; }
  if(csTimerId){ clearInterval(csTimerId); csTimerId = null; }
  clearTimeout(csWhisperTimer);
  stopCSLoFi();
  document.removeEventListener('keydown', csOnKeyDown);
  document.removeEventListener('keyup', csOnKeyUp);
  csMeteors = [];
  csTrails = [];
  csCaughtGlows = [];
  csBgStars = [];
}
