function saveFuture(){
  const date = document.getElementById('futureDate').value;
  const text = document.getElementById('futureText').value.trim();
  if(!date){ toast('请选择送达日期'); return; }
  if(!text){ toast('写点什么吧～'); return; }
  const list = Store.get('future', []);
  list.push({date, text, id:Date.now(), sent:false});
  Store.set('future', list);
  toast('信件已寄出，到时会送达 📮');
  document.getElementById('futureText').value = '';
  renderFuture();
}

function renderFuture(){
  const el = document.getElementById('futureList');
  if(!el) return;
  const list = Store.get('future', []).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const today = new Date().toISOString().split('T')[0];
  if(list.length===0){ el.innerHTML = '<div class="empty-state">还没有信件，写给未来的自己吧！</div>'; return; }
  el.innerHTML = list.map(f=>{
    const delivered = f.date <= today;
    return `<div class="future-item${delivered?'':' locked'}">
      <div class="date">📮 ${f.date} ${delivered?'✉️ 已送达':'🔒 未到时间'}</div>
      <div class="content">${escapeHtml(f.text)}</div>
      ${delivered?'':'<div style="font-size:11px;color:var(--text-light);margin-top:4px;">内容将在送达日期解锁</div>'}
    </div>`;
  }).join('');
}

/* ============================================================
   捏捏史莱姆 — 拖拽挤压史莱姆，释放压力
   ============================================================ */
function openSlime(){
  openModal(`
    <div class="modal-title"><span class="emoji">🟢</span>捏捏史莱姆</div>
    <div class="modal-desc">用手指或鼠标拖拽史莱姆，看它Q弹变形。捏一捏，烦恼消散～</div>
    <div class="slime-wrap">
      <canvas id="slimeCanvas" width="360" height="360"></canvas>
      <div class="slime-hint">拖拽史莱姆任意位置 😊</div>
      <button class="mood-save-btn" onclick="initSlime()" style="margin-top:12px;">🔄 重置</button>
    </div>
  `);
  initSlime();
}
function initSlime(){
  const cv = document.getElementById('slimeCanvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const cx = cv.width/2, cy = cv.height/2;
  const baseR = 80;
  let pts = [];
  const N = 48;
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2;
    pts.push({a, r:baseR, vr:0});
  }
  let drag = null;

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // shadow
    ctx.save();
    ctx.translate(cx, cy+6);
    ctx.scale(1, 0.25);
    ctx.beginPath();
    ctx.arc(0, 0, baseR*1.1, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(104,211,145,0.15)';
    ctx.fill();
    ctx.restore();

    // body
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    for(let i=0;i<=N;i++){
      const p = pts[i%N];
      const x = Math.cos(p.a)*p.r;
      const y = Math.sin(p.a)*p.r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    const grad = ctx.createRadialGradient(-20,-20,10,0,0,baseR*1.4);
    grad.addColorStop(0, '#9ae6b4');
    grad.addColorStop(0.6, '#68d391');
    grad.addColorStop(1, '#48bb78');
    ctx.fillStyle = grad;
    ctx.fill();
    // highlight
    ctx.beginPath();
    ctx.ellipse(-25,-28,18,12,-0.3,0,Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();
    // eyes
    ctx.fillStyle = '#2d3748';
    ctx.beginPath(); ctx.ellipse(-18,5,5,8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18,5,5,8,0,0,Math.PI*2); ctx.fill();
    // mouth
    ctx.strokeStyle = '#2d3748'; ctx.lineWidth = 2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,18,10,0.2,Math.PI-0.2); ctx.stroke();
    ctx.restore();
  }

  function physics(){
    for(let i=0;i<N;i++){
      const p = pts[i];
      const target = baseR;
      const force = (target - p.r) * 0.08;
      p.vr += force;
      p.vr *= 0.88;
      p.r += p.vr;
    }
    // smooth neighbors
    for(let pass=0;pass<2;pass++){
      for(let i=0;i<N;i++){
        const prev = pts[(i-1+N)%N].r;
        const next = pts[(i+1)%N].r;
        pts[i].r += (prev - pts[i].r)*0.08 + (next - pts[i].r)*0.08;
      }
    }
    draw();
    requestAnimationFrame(physics);
  }

  function getPos(e){
    const rect = cv.getBoundingClientRect();
    const sx = cv.width/rect.width, sy = cv.height/rect.height;
    const t = e.touches?e.touches[0]:e;
    return {x:(t.clientX-rect.left)*sx - cx, y:(t.clientY-rect.top)*sy - cy};
  }
  function onDown(e){
    e.preventDefault();
    const p = getPos(e);
    const dist = Math.hypot(p.x, p.y);
    if(dist < baseR*1.5) drag = p;
  }
  function onMove(e){
    if(!drag) return;
    e.preventDefault();
    const p = getPos(e);
    const dx = p.x - drag.x, dy = p.y - drag.y;
    const angle = Math.atan2(dy, dx);
    // find nearest points and push them
    for(let i=0;i<N;i++){
      const p2 = pts[i];
      let diff = Math.abs(((p2.a - angle + Math.PI*3) % (Math.PI*2)) - Math.PI);
      diff = Math.PI - diff;
      const influence = Math.max(0, 1 - diff/0.8);
      if(influence > 0){
        const pull = Math.hypot(dx,dy) * influence * 0.4;
        p2.vr -= pull;
      }
    }
    drag = p;
  }
  function onUp(){ drag = null; }

  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mouseup', onUp);
  cv.addEventListener('mouseleave', onUp);
  cv.addEventListener('touchstart', onDown, {passive:false});
  cv.addEventListener('touchmove', onMove, {passive:false});
  cv.addEventListener('touchend', onUp);

  // poke on click
  cv.addEventListener('click', (e)=>{
    const p = getPos(e);
    const dist = Math.hypot(p.x, p.y);
    if(dist < baseR*1.2){
      const angle = Math.atan2(p.y, p.x);
      for(let i=0;i<N;i++){
        const p2 = pts[i];
        let diff = Math.abs(((p2.a - angle + Math.PI*3) % (Math.PI*2)) - Math.PI);
        diff = Math.PI - diff;
        const influence = Math.max(0, 1 - diff/0.6);
        p2.vr -= 8 * influence;
      }
    }
  });

  physics();
}

/* ============================================================
   切水果大师 — 水果飞出，点击切开（Canvas 绘制，切开呈剖面两半效果）
   ============================================================ */
let fruitGame = null;
function openFruitSlice(){
  openModal(`
    <div class="modal-title"><span class="emoji">🍉</span>切水果大师</div>
    <div class="modal-desc">水果会从下方飞出，点击或滑动切开它们！纯粹解压，没有分数压力。</div>
    <div class="fruit-wrap">
      <canvas id="fruitCanvas" width="360" height="400"></canvas>
      <div class="fruit-hint">点击水果切开它！🔪✨</div>
    </div>
  `);
  const cv = document.getElementById('fruitCanvas');
  const ctx = cv.getContext('2d');

  // 水果类型：外皮色、果肉色、种子色、种子数、形状、尺寸
  const FRUIT_TYPES = [
    { name:'watermelon', skin:'#38a169', skinDark:'#276749', flesh:'#fc8181', seed:'#2d3748', seedCount:8,  size:48 },
    { name:'orange',     skin:'#f6ad55', skinDark:'#c05621', flesh:'#fed7aa', seed:'#c05621', seedCount:0,  size:40 },
    { name:'strawberry', skin:'#fc8181', skinDark:'#c53030', flesh:'#feb2b2', seed:'#2d3748', seedCount:10, size:38, topLeaf:true },
    { name:'lemon',      skin:'#ecc94b', skinDark:'#b7791f', flesh:'#fefcbf', seed:'#b7791f', seedCount:0,  size:36, shape:'oval' },
    { name:'kiwi',       skin:'#86c974', skinDark:'#5a8c4a', flesh:'#d6f5c9', seed:'#2d3748', seedCount:14, size:38 },
    { name:'peach',      skin:'#fbb6ce', skinDark:'#b83280', flesh:'#fed7e2', seed:'#b83280', seedCount:0,  size:40, shape:'oval' },
    { name:'grape',      skin:'#a78bfa', skinDark:'#553c9a', flesh:'#d6bcfa', seed:'#553c9a', seedCount:0,  size:32 },
  ];

  let fruits = [];     // 完整水果
  let halves = [];     // 切开的两半
  let juiceDrops = []; // 果汁飞溅粒子
  let running = true;

  // 绘制一整个水果（带清晰纹路/细节）
  function drawWholeFruit(f){
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);

    const r = f.size / 2;
    const type = f.type;
    const isOval = type.shape === 'oval';
    const rx = isOval ? r * 0.82 : r;
    const ry = r;

    // ===== 水果主体（外皮） =====
    ctx.save();
    ctx.beginPath();
    if(isOval){
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    } else {
      ctx.arc(0, 0, r, 0, Math.PI * 2);
    }

    // 外皮渐变
    const grad = ctx.createRadialGradient(-r*0.3, -r*0.35, r*0.1, 0, 0, r);
    grad.addColorStop(0, lightenColor(type.skin, 25));
    grad.addColorStop(1, type.skin);
    ctx.fillStyle = grad;
    ctx.fill();

    // ===== 纹路/细节（按水果类型区分） =====
    ctx.clip();

    if(type.name === 'watermelon'){
      // 西瓜：深绿色波浪条纹
      const stripes = 7;
      ctx.strokeStyle = type.skinDark;
      ctx.lineWidth = Math.max(2, r * 0.08);
      ctx.lineCap = 'round';
      for(let i = 0; i < stripes; i++){
        const t = (i / stripes) * 2 - 1; // -1 to 1
        const cx = t * rx * 0.85;
        ctx.beginPath();
        ctx.moveTo(cx - r*0.1, -ry*1.1);
        ctx.bezierCurveTo(cx + r*0.15, -ry*0.3, cx - r*0.15, ry*0.3, cx + r*0.1, ry*1.1);
        ctx.globalAlpha = 0.55;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    else if(type.name === 'orange'){
      // 橙子：表皮油胞（小凹点纹理）
      const dots = 30;
      ctx.fillStyle = type.skinDark;
      ctx.globalAlpha = 0.25;
      for(let i = 0; i < dots; i++){
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.sqrt(Math.random()) * rx * 0.9;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist * (isOval ? 1 : 1);
        const ds = 1 + Math.random() * 2;
        ctx.beginPath();
        ctx.arc(dx, dy, ds, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // 顶部小蒂
      ctx.fillStyle = '#5a8c4a';
      ctx.beginPath();
      ctx.arc(0, -ry*0.9, r*0.08, 0, Math.PI * 2);
      ctx.fill();
    }
    else if(type.name === 'strawberry'){
      // 草莓：表面布满种子（瘦果），呈螺旋分布
      ctx.fillStyle = '#ffd700';
      const seeds = 18;
      for(let i = 0; i < seeds; i++){
        const row = Math.floor(i / 5);
        const col = i % 5;
        const ang = (col / 5) * Math.PI * 2 + row * 0.5;
        const dist = (0.25 + row * 0.2) * rx;
        const dx = Math.cos(ang) * dist;
        const dy = Math.sin(ang) * dist * 0.75 - r*0.05;
        if(Math.hypot(dx / rx, dy / ry) < 0.92){
          ctx.beginPath();
          ctx.ellipse(dx, dy, r*0.04, r*0.03, ang, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    else if(type.name === 'lemon'){
      // 柠檬：两端突起 + 表皮油胞纹理
      const dots = 20;
      ctx.fillStyle = type.skinDark;
      ctx.globalAlpha = 0.2;
      for(let i = 0; i < dots; i++){
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.sqrt(Math.random()) * rx * 0.85;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        const ds = 0.8 + Math.random() * 1.5;
        ctx.beginPath();
        ctx.arc(dx, dy, ds, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // 两端突起（柠檬的尖头）
      ctx.fillStyle = type.skin;
      ctx.beginPath();
      ctx.ellipse(0, -ry*0.92, r*0.12, r*0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(0, ry*0.92, r*0.1, r*0.15, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    else if(type.name === 'kiwi'){
      // 猕猴桃：棕褐色毛茸茸外皮 + 细密短毛
      ctx.fillStyle = '#8B6F47';
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      if(isOval) ctx.ellipse(0, 0, rx*0.98, ry*0.98, 0, 0, Math.PI*2);
      else ctx.arc(0, 0, r*0.98, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
      // 短毛纹理（放射短线）
      ctx.strokeStyle = '#6B4423';
      ctx.lineWidth = 0.8;
      ctx.globalAlpha = 0.6;
      const hairs = 40;
      for(let i = 0; i < hairs; i++){
        const ang = (i / hairs) * Math.PI * 2 + Math.random() * 0.3;
        const r1 = r * (0.85 + Math.random() * 0.08);
        const r2 = r * (0.95 + Math.random() * 0.08);
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
        ctx.lineTo(Math.cos(ang) * r2, Math.sin(ang) * r2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    else if(type.name === 'peach'){
      // 水蜜桃：一道纵向桃缝 + 红晕渐变
      ctx.strokeStyle = type.skinDark;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.ellipse(-rx*0.05, 0, rx*0.92, ry*0.96, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // 右侧红晕
      const blush = ctx.createRadialGradient(rx*0.4, ry*0.1, 0, rx*0.4, ry*0.1, rx*0.6);
      blush.addColorStop(0, 'rgba(255,100,120,0.35)');
      blush.addColorStop(1, 'rgba(255,100,120,0)');
      ctx.fillStyle = blush;
      ctx.beginPath();
      ctx.arc(rx*0.4, ry*0.1, rx*0.6, 0, Math.PI * 2);
      ctx.fill();
      // 顶部小叶子
      ctx.fillStyle = '#48bb78';
      ctx.beginPath();
      ctx.ellipse(-r*0.1, -ry*0.95, r*0.12, r*0.06, -0.4, 0, Math.PI*2);
      ctx.fill();
    }
    else if(type.name === 'grape'){
      // 葡萄：光滑 + 底部反光 + 顶部小蒂
      // 底部渐变反光
      const bottomShine = ctx.createRadialGradient(0, ry*0.3, 0, 0, ry*0.3, rx*0.7);
      bottomShine.addColorStop(0, 'rgba(255,255,255,0.15)');
      bottomShine.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = bottomShine;
      ctx.beginPath();
      ctx.arc(0, ry*0.3, rx*0.7, 0, Math.PI * 2);
      ctx.fill();
      // 顶部果蒂
      ctx.fillStyle = '#5a8c4a';
      ctx.beginPath();
      ctx.arc(0, -ry*0.88, r*0.09, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#4a6b3a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -ry*0.95);
      ctx.quadraticCurveTo(r*0.1, -ry*1.05, r*0.05, -ry*1.12);
      ctx.stroke();
    }

    ctx.restore(); // 解除 clip

    // 草莓顶部绿叶（在 clip 外面画，不被裁）
    if(type.topLeaf){
      ctx.fillStyle = '#48bb78';
      ctx.beginPath();
      ctx.moveTo(-r*0.5, -r*0.72);
      ctx.lineTo(0, -r*1.12);
      ctx.lineTo(r*0.5, -r*0.72);
      ctx.closePath();
      ctx.fill();
      // 小叶子
      ctx.fillStyle = '#68d391';
      ctx.beginPath();
      ctx.moveTo(-r*0.2, -r*0.88);
      ctx.lineTo(-r*0.05, -r*1.02);
      ctx.lineTo(r*0.1, -r*0.88);
      ctx.closePath();
      ctx.fill();
    }

    // 高光
    ctx.beginPath();
    ctx.ellipse(-rx*0.35, -ry*0.35, rx*0.22, ry*0.12, -0.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();

    ctx.restore();
  }

  // 绘制半个水果（被切开的剖面）
  // side: 'left' 或 'right'
  function drawHalfFruit(h){
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);

    const r = h.size / 2;
    const type = h.type;

    ctx.save();
    // 只画半边：左半边或右半边
    ctx.beginPath();
    if(type.shape === 'oval'){
      if(h.side === 'left'){
        ctx.ellipse(0, 0, r * 0.85, r, 0, Math.PI/2, Math.PI * 1.5);
      } else {
        ctx.ellipse(0, 0, r * 0.85, r, 0, -Math.PI/2, Math.PI/2);
      }
    } else {
      if(h.side === 'left'){
        ctx.arc(0, 0, r, Math.PI/2, Math.PI * 1.5);
      } else {
        ctx.arc(0, 0, r, -Math.PI/2, Math.PI/2);
      }
    }
    ctx.closePath();

    // 外皮
    const grad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.1, 0, 0, r);
    grad.addColorStop(0, lightenColor(type.skin, 20));
    grad.addColorStop(1, type.skin);
    ctx.fillStyle = grad;
    ctx.fill();

    // 果肉（从切面向内缩进一点，模拟果皮厚度）
    ctx.clip();
    ctx.beginPath();
    const fleshR = r - r * 0.18;
    if(type.shape === 'oval'){
      ctx.ellipse(h.side === 'left' ? -r*0.08 : r*0.08, 0, fleshR * 0.85, fleshR, 0, 0, Math.PI * 2);
    } else {
      ctx.arc(h.side === 'left' ? -r*0.05 : r*0.05, 0, fleshR, 0, Math.PI * 2);
    }
    ctx.fillStyle = type.flesh;
    ctx.fill();

    // 种子（只画在果肉区域内）
    if(type.seedCount > 0){
      ctx.fillStyle = type.seed;
      const seedR = Math.max(1.5, r * 0.08);
      for(let i = 0; i < type.seedCount; i++){
        const angle = (i / type.seedCount) * Math.PI * 2 + 0.3;
        const sr = fleshR * 0.6;
        const sx = Math.cos(angle) * sr + (h.side === 'left' ? -r*0.05 : r*0.05);
        const sy = Math.sin(angle) * sr * 0.8;
        // 只画在半边内的种子
        if((h.side === 'left' && sx < 2) || (h.side === 'right' && sx > -2)){
          ctx.beginPath();
          ctx.ellipse(sx, sy, seedR, seedR * 0.6, angle, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.restore();

    // 切面边缘（一条线，模拟被切开的截面）
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(0, r);
    ctx.strokeStyle = type.flesh;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.stroke();
    // 切面内层淡淡的皮
    ctx.beginPath();
    ctx.moveTo(0, -r + r*0.12);
    ctx.lineTo(0, r - r*0.12);
    ctx.strokeStyle = lightenColor(type.skin, 10);
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.7;
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // 绘制果汁水滴
  function drawJuiceDrop(d){
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.beginPath();
    ctx.ellipse(0, 0, d.size, d.size * 0.8, d.rot, 0, Math.PI * 2);
    ctx.fillStyle = d.color;
    ctx.globalAlpha = Math.max(0, d.alpha);
    ctx.fill();
    // 高光
    ctx.beginPath();
    ctx.ellipse(-d.size*0.3, -d.size*0.3, d.size*0.3, d.size*0.2, -0.5, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();
    ctx.restore();
  }

  // 颜色变亮工具
  function lightenColor(hex, amount){
    const num = parseInt(hex.slice(1), 16);
    const r = Math.min(255, (num >> 16) + amount);
    const g = Math.min(255, ((num >> 8) & 0xff) + amount);
    const b = Math.min(255, (num & 0xff) + amount);
    return `rgb(${r},${g},${b})`;
  }

  function spawn(){
    if(!running) return;
    const type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
    const sizeMult = 0.85 + Math.random() * 0.35;
    fruits.push({
      x: 40 + Math.random() * (cv.width - 80),
      y: cv.height + 30,
      vx: (Math.random() - 0.5) * 3.5,
      vy: -(9 + Math.random() * 3.5),
      g: 0.2,
      type, size: type.size * sizeMult,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.06,
      sliced: false,
    });
    setTimeout(spawn, 650 + Math.random() * 700);
  }

  function sliceFruit(p){
    if(p.sliced) return;
    p.sliced = true;

    // 左半：向左飞并略微旋转
    halves.push({
      x: p.x, y: p.y,
      vx: p.vx - 3.5, vy: p.vy - 0.5,
      g: 0.25,
      type: p.type, size: p.size,
      rot: p.rot, vrot: -0.12,
      side: 'left',
    });
    // 右半：向右飞并略微旋转
    halves.push({
      x: p.x, y: p.y,
      vx: p.vx + 3.5, vy: p.vy - 0.5,
      g: 0.25,
      type: p.type, size: p.size,
      rot: p.rot, vrot: 0.12,
      side: 'right',
    });

    // 果汁飞溅粒子（用 Canvas 画，不是 emoji）
    const juiceColor = p.type.flesh;
    for(let i = 0; i < 12; i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5;
      juiceDrops.push({
        x: p.x, y: p.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.5,
        g: 0.3,
        size: 3 + Math.random() * 5,
        rot: Math.random() * Math.PI,
        alpha: 1,
        color: juiceColor,
      });
    }
  }

  function draw(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    // 背景
    ctx.fillStyle = 'rgba(240,244,255,0.5)';
    ctx.fillRect(0, 0, cv.width, cv.height);

    // 更新并绘制完整水果
    fruits = fruits.filter(f => f.y < cv.height + 50);
    fruits.forEach(f => {
      f.x += f.vx; f.y += f.vy; f.vy += f.g; f.rot += f.vrot;
      if(!f.sliced) drawWholeFruit(f);
    });

    // 更新并绘制两半水果
    halves = halves.filter(h => h.y < cv.height + 50);
    halves.forEach(h => {
      h.x += h.vx; h.y += h.vy; h.vy += h.g; h.rot += h.vrot;
      drawHalfFruit(h);
    });

    // 更新并绘制果汁粒子
    juiceDrops = juiceDrops.filter(d => d.alpha > 0.02 && d.y < cv.height + 30);
    juiceDrops.forEach(d => {
      d.x += d.vx; d.y += d.vy; d.vy += d.g;
      d.alpha *= 0.96;
      d.size *= 0.99;
      drawJuiceDrop(d);
    });

    if(running) requestAnimationFrame(draw);
  }

  // 点击切
  cv.addEventListener('click', (e) => {
    const rect = cv.getBoundingClientRect();
    const sx = cv.width / rect.width, sy = cv.height / rect.height;
    const x = (e.clientX - rect.left) * sx, y = (e.clientY - rect.top) * sy;
    fruits.forEach(f => {
      if(!f.sliced && Math.hypot(f.x - x, f.y - y) < f.size * 0.75){
        sliceFruit(f);
      }
    });
  });

  // 触屏滑动切
  let lastSwipe = null;
  cv.addEventListener('touchstart', (e) => {
    const rect = cv.getBoundingClientRect();
    const t = e.touches[0];
    lastSwipe = {
      x: (t.clientX - rect.left) * (cv.width / rect.width),
      y: (t.clientY - rect.top) * (cv.height / rect.height)
    };
  }, {passive: true});
  cv.addEventListener('touchmove', (e) => {
    if(!lastSwipe) return;
    const rect = cv.getBoundingClientRect();
    const t = e.touches[0];
    const x = (t.clientX - rect.left) * (cv.width / rect.width);
    const y = (t.clientY - rect.top) * (cv.height / rect.height);
    fruits.forEach(f => {
      if(!f.sliced){
        const d = Math.hypot(f.x - x, f.y - y);
        if(d < f.size * 0.85) sliceFruit(f);
      }
    });
    lastSwipe = {x, y};
  }, {passive: true});

  spawn();
  draw();

  // 关闭时清理
  const observer = new MutationObserver(() => {
    if(!document.getElementById('fruitCanvas')){
      running = false;
      observer.disconnect();
    }
  });
  observer.observe(document.body, {childList: true, subtree: true});
}

/* ============================================================
   叠叠乐 — 时机把握叠方块
   ============================================================ */
let stackGame = null;
function openStackBlock(){
  openModal(`
    <div class="modal-title"><span class="emoji">🧱</span>叠叠乐</div>
    <div class="modal-desc">方块来回滑动，点击放下。对齐越准叠得越高，歪了也没关系，重新来过就好。</div>
    <div class="stack-wrap">
      <canvas id="stackCanvas" width="320" height="440"></canvas>
      <div class="stack-hint">点击放下方块 🧱 高度：<span id="stackHeight">0</span></div>
      <button class="mood-save-btn" onclick="initStack()" style="margin-top:8px;">🔄 重新开始</button>
    </div>
  `);
  initStack();
}
function initStack(){
  const cv = document.getElementById('stackCanvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const BW = 100; // block width
  let blocks = [{x: cv.width/2 - BW/2, y: cv.height - 30, w: BW}];
  let current = {x: 0, y: cv.height - 60, w: BW, dir: 1, speed: 2.5};
  let gameOver = false;
  let cameraY = 0;

  function update(){
    if(gameOver) return;
    current.x += current.dir * current.speed;
    if(current.x < 0){ current.x = 0; current.dir = 1; }
    if(current.x + current.w > cv.width){ current.x = cv.width - current.w; current.dir = -1; }
    draw();
    requestAnimationFrame(update);
  }

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#f0f4ff';
    ctx.fillRect(0,0,cv.width,cv.height);

    const offset = cameraY;
    // draw stacked blocks
    blocks.forEach((b,i)=>{
      const y = b.y + offset;
      if(y > cv.height || y < -30) return;
      const hue = 180 + i * 12;
      ctx.fillStyle = `hsl(${hue%360}, 55%, 65%)`;
      ctx.fillRect(b.x, y, b.w, 24);
      ctx.fillStyle = `hsla(${hue%360}, 55%, 45%, 0.3)`;
      ctx.fillRect(b.x, y+18, b.w, 6);
    });

    // draw current moving block
    if(!gameOver){
      const y = current.y + offset;
      const hue = 180 + blocks.length * 12;
      ctx.fillStyle = `hsl(${hue%360}, 65%, 60%)`;
      ctx.fillRect(current.x, y, current.w, 24);
      ctx.fillStyle = `hsla(${hue%360}, 65%, 40%, 0.3)`;
      ctx.fillRect(current.x, y+18, current.w, 6);
    }

    // height display
    document.getElementById('stackHeight').textContent = blocks.length - 1;
  }

  function drop(){
    if(gameOver) return;
    const top = blocks[blocks.length-1];
    const overlap = Math.min(current.x + current.w, top.x + top.w) - Math.max(current.x, top.x);
    if(overlap <= 0){
      gameOver = true;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,cv.width,cv.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('叠了 ' + (blocks.length-1) + ' 层！', cv.width/2, cv.height/2 - 10);
      ctx.font = '14px sans-serif';
      ctx.fillText('点击「重新开始」再试', cv.width/2, cv.height/2 + 20);
      return;
    }
    const newX = Math.max(current.x, top.x);
    current.w = overlap;
    current.x = newX;
    blocks.push({...current, y: top.y - 26, w: overlap});
    // move camera up
    if(blocks.length > 8){
      cameraY += 26;
    }
    current = {
      x: current.dir > 0 ? 0 : cv.width - BW,
      y: blocks[blocks.length-1].y - 26,
      w: BW,
      dir: current.dir > 0 ? 1 : -1,
      speed: 2.5 + blocks.length * 0.15
    };
    draw();
  }

  cv.addEventListener('click', drop);
  cv.addEventListener('touchstart', (e)=>{ e.preventDefault(); drop(); }, {passive:false});
  update();
}

/* ============================================================
   重力沙画 — 沙粒受重力影响流动作画
   ============================================================ */
function openSandArt(){
  openModal(`
    <div class="modal-title"><span class="emoji">🏜️</span>重力沙画</div>
    <div class="modal-desc">按住鼠标或手指在画布上拖动，沙粒会受重力影响流动堆积，形成独特的沙画。</div>
    <div class="sand-wrap">
      <canvas id="sandCanvas" width="340" height="380"></canvas>
      <div class="sand-controls">
        <button class="doodle-tool sand-color active" data-c="#f6ad55" style="background:#f6ad55;"></button>
        <button class="doodle-tool sand-color" data-c="#68d391" style="background:#68d391;"></button>
        <button class="doodle-tool sand-color" data-c="#6c8eef" style="background:#6c8eef;"></button>
        <button class="doodle-tool sand-color" data-c="#fc8181" style="background:#fc8181;"></button>
        <button class="doodle-tool sand-color" data-c="#a78bfa" style="background:#a78bfa;"></button>
        <button class="doodle-tool sand-color" data-c="#4fd1c5" style="background:#4fd1c5;"></button>
        <button class="mood-save-btn" onclick="clearSand()" style="padding:6px 14px;font-size:13px;">🗑️ 清空</button>
      </div>
    </div>
  `);
  const cv = document.getElementById('sandCanvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  let grains = [];
  let sandColor = '#f6ad55';
  let drawing = false;

  // grid for collision
  const cellSize = 4;
  const cols = Math.floor(W / cellSize);
  const rows = Math.floor(H / cellSize);
  let grid = new Array(cols * rows).fill(null);

  document.querySelectorAll('.sand-color').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.sand-color').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      sandColor = btn.dataset.c;
    });
  });

  function spawn(x, y){
    for(let i=0;i<3;i++){
      const px = x + (Math.random()-0.5)*6;
      const py = y + (Math.random()-0.5)*6;
      if(px>=0 && px<W && py>=0 && py<H){
        grains.push({x:px, y:py, vx:0, vy:0, c:sandColor, settled:false});
      }
    }
  }

  function update(){
    // fade canvas
    ctx.fillStyle = 'rgba(240,244,255,0.0)';
    ctx.fillRect(0,0,W,H);

    const newGrains = [];
    for(let g of grains){
      if(g.settled){
        newGrains.push(g);
        continue;
      }
      g.vy += 0.3; // gravity
      g.vy = Math.min(g.vy, 5);
      const ny = g.y + g.vy;
      const nx = g.x + g.vx;
      // check below
      const col = Math.floor(nx / cellSize);
      const row = Math.floor(ny / cellSize);
      let blocked = false;
      if(ny >= H - 1 || (col >= 0 && col < cols && row >= 0 && row < rows && grid[row*cols+col])){
        blocked = true;
        // try slide
        const slideDir = Math.random() < 0.5 ? -1 : 1;
        const sx = g.x + slideDir * cellSize;
        const sCol = Math.floor(sx / cellSize);
        if(sx >= 0 && sx < W && !(sCol >= 0 && sCol < cols && row >= 0 && row < rows && grid[row*cols+sCol])){
          g.x = sx;
          g.vx = slideDir * 0.5;
          g.vy = 0;
        } else {
          g.settled = true;
          const sc = Math.floor(g.x / cellSize);
          const sr = Math.floor(g.y / cellSize);
          if(sc >= 0 && sc < cols && sr >= 0 && sr < rows){
            grid[sr*cols+sc] = g.c;
          }
        }
      }
      if(!blocked && !g.settled){
        g.x = Math.max(0, Math.min(W-1, nx));
        g.y = Math.max(0, Math.min(H-1, ny));
      }
      // draw
      ctx.fillStyle = g.c;
      ctx.fillRect(g.x, g.y, 3, 3);
      if(!g.settled) newGrains.push(g);
    }
    grains = newGrains;
    requestAnimationFrame(update);
  }

  function getPos(e){
    const rect = cv.getBoundingClientRect();
    const sx = W/rect.width, sy = H/rect.height;
    const t = e.touches?e.touches[0]:e;
    return {x:(t.clientX-rect.left)*sx, y:(t.clientY-rect.top)*sy};
  }
  cv.addEventListener('mousedown', (e)=>{ drawing=true; const p=getPos(e); spawn(p.x,p.y); });
  cv.addEventListener('mousemove', (e)=>{ if(drawing){ const p=getPos(e); spawn(p.x,p.y); } });
  cv.addEventListener('mouseup', ()=>{ drawing=false; });
  cv.addEventListener('mouseleave', ()=>{ drawing=false; });
  cv.addEventListener('touchstart', (e)=>{ e.preventDefault(); drawing=true; const p=getPos(e); spawn(p.x,p.y); }, {passive:false});
  cv.addEventListener('touchmove', (e)=>{ e.preventDefault(); if(drawing){ const p=getPos(e); spawn(p.x,p.y); } }, {passive:false});
  cv.addEventListener('touchend', ()=>{ drawing=false; });

  window.clearSand = function(){
    grains = [];
    grid = new Array(cols * rows).fill(null);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#f8f9fa';
    ctx.fillRect(0,0,W,H);
  };
  ctx.fillStyle = '#f8f9fa';
  ctx.fillRect(0,0,W,H);
  update();
}

/* ============================================================
   水流壶铃 — 倒水模拟，水流堆积
   ============================================================ */
function openWaterFlow(){
  openModal(`
    <div class="modal-title"><span class="emoji">💧</span>水流壶铃</div>
    <div class="modal-desc">按住按钮倒水，看水滴受重力流动堆积。拖动杯子可以接水，放松又解压。</div>
    <div class="water-wrap">
      <canvas id="waterCanvas" width="340" height="380"></canvas>
      <div class="water-controls">
        <button class="mood-save-btn" id="waterPourBtn" style="font-size:13px;">💧 按住倒水</button>
        <button class="mood-save-btn" onclick="clearWater()" style="padding:6px 14px;font-size:13px;background:var(--accent-sky);">🗑️ 清空</button>
      </div>
    </div>
  `);
  const cv = document.getElementById('waterCanvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  let drops = [];
  let pooled = [];
  let pouring = false;
  let cupX = W/2, cupY = H - 60, cupW = 100, cupH = 70;
  let cupDrag = false;

  function update(){
    ctx.clearRect(0,0,W,H);
    // bg
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, '#e8edff');
    grad.addColorStop(1, '#f0f4ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // pour
    if(pouring){
      for(let i=0;i<2;i++){
        drops.push({
          x: W/2 + (Math.random()-0.5)*8,
          y: 20,
          vy: 1 + Math.random(),
          r: 3 + Math.random()*2
        });
      }
    }

    // update drops
    drops = drops.filter(d=>{
      d.vy += 0.25;
      d.y += d.vy;
      // check cup collision
      if(d.x > cupX - cupW/2 && d.x < cupX + cupW/2 && d.y > cupY - cupH && d.y < cupY){
        pooled.push({x: cupX - cupW/2 + (d.x - (cupX - cupW/2)), level: 0});
        return false;
      }
      // check pool
      if(d.y > H - 20){
        return false;
      }
      return d.y < H;
    });

    // draw drops
    drops.forEach(d=>{
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(108,142,239,0.7)';
      ctx.fill();
    });

    // draw cup
    ctx.strokeStyle = 'rgba(108,142,239,0.4)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cupX - cupW/2, cupY - cupH);
    ctx.lineTo(cupX - cupW/2, cupY);
    ctx.lineTo(cupX + cupW/2, cupY);
    ctx.lineTo(cupX + cupW/2, cupY - cupH);
    ctx.stroke();
    // cup water
    const fillRatio = Math.min(1, pooled.length / 60);
    if(fillRatio > 0){
      const fillH = cupH * fillRatio;
      ctx.fillStyle = 'rgba(108,142,239,0.3)';
      ctx.fillRect(cupX - cupW/2 + 2, cupY - fillH, cupW - 4, fillH);
    }

    // faucet
    ctx.fillStyle = '#a0aec0';
    ctx.fillRect(W/2 - 15, 0, 30, 20);
    ctx.beginPath();
    ctx.arc(W/2, 20, 8, 0, Math.PI*2);
    ctx.fillStyle = '#cbd5e0';
    ctx.fill();

    requestAnimationFrame(update);
  }

  const pourBtn = document.getElementById('waterPourBtn');
  pourBtn.addEventListener('mousedown', ()=>{ pouring = true; pourBtn.textContent = '💧 倒水中...'; });
  pourBtn.addEventListener('mouseup', ()=>{ pouring = false; pourBtn.textContent = '💧 按住倒水'; });
  pourBtn.addEventListener('mouseleave', ()=>{ pouring = false; pourBtn.textContent = '💧 按住倒水'; });
  pourBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); pouring = true; }, {passive:false});
  pourBtn.addEventListener('touchend', ()=>{ pouring = false; });

  // drag cup
  function getCupPos(e){
    const rect = cv.getBoundingClientRect();
    const sx = W/rect.width;
    const t = e.touches?e.touches[0]:e;
    return (t.clientX-rect.left)*sx;
  }
  cv.addEventListener('mousedown', (e)=>{ const x=getCupPos(e); if(x > cupX-cupW/2-20 && x < cupX+cupW/2+20) cupDrag = true; });
  cv.addEventListener('mousemove', (e)=>{ if(cupDrag){ cupX = Math.max(cupW/2, Math.min(W-cupW/2, getCupPos(e))); } });
  cv.addEventListener('mouseup', ()=>{ cupDrag = false; });
  cv.addEventListener('touchstart', (e)=>{ const x=getCupPos(e); if(x > cupX-cupW/2-20 && x < cupX+cupW/2+20) cupDrag = true; }, {passive:true});
  cv.addEventListener('touchmove', (e)=>{ if(cupDrag){ cupX = Math.max(cupW/2, Math.min(W-cupW/2, getCupPos(e))); } }, {passive:true});
  cv.addEventListener('touchend', ()=>{ cupDrag = false; });

  window.clearWater = function(){
    drops = [];
    pooled = [];
  };
  update();
}

/* ============================================================
   落叶清扫 — 落叶飘下，用手指/鼠标扫开
   ============================================================ */
function openLeafSweep(){
  openModal(`
    <div class="modal-title"><span class="emoji">🍂</span>落叶清扫</div>
    <div class="modal-desc">秋叶缓缓飘落，用手指或鼠标扫走它们。看着叶子被吹散，心也静下来。</div>
    <div class="leaf-wrap">
      <canvas id="leafCanvas" width="340" height="380"></canvas>
      <div class="leaf-hint">移动鼠标/手指扫落叶 🍂🍁</div>
    </div>
  `);
  const cv = document.getElementById('leafCanvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const leafEmojis = ['🍂','🍁','🍃','🍂','🍁'];
  let leaves = [];
  let mouseX = -100, mouseY = -100;
  let prevX = -100, prevY = -100;

  function spawn(){
    leaves.push({
      x: Math.random() * W,
      y: -20,
      vx: (Math.random()-0.5)*0.5,
      vy: 0.5 + Math.random()*0.8,
      rot: Math.random() * Math.PI*2,
      vrot: (Math.random()-0.5)*0.04,
      size: 18 + Math.random()*12,
      emoji: leafEmojis[Math.floor(Math.random()*leafEmojis.length)],
      vx2: 0, vy2: 0, // sweep velocity
      alpha: 1
    });
    setTimeout(spawn, 400 + Math.random()*600);
  }

  function update(){
    // bg gradient
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, '#fef9c3');
    grad.addColorStop(0.5, '#fef3c7');
    grad.addColorStop(1, '#fde68a');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // ground
    ctx.fillStyle = 'rgba(180,140,80,0.15)';
    ctx.fillRect(0, H-15, W, 15);

    leaves = leaves.filter(l=>l.y < H + 30 && l.alpha > 0.05);
    leaves.forEach(l=>{
      // gravity
      l.vy += 0.01;
      l.vy = Math.min(l.vy, 1.5);
      // wind
      l.vx += Math.sin(Date.now()*0.001 + l.x*0.01) * 0.02;

      // sweep effect
      const dx = l.x - mouseX, dy = l.y - mouseY;
      const dist = Math.hypot(dx, dy);
      if(dist < 60){
        const force = (60 - dist) / 60 * 3;
        l.vx2 += (dx/dist) * force;
        l.vy2 += (dy/dist) * force;
      }
      l.vx2 *= 0.92;
      l.vy2 *= 0.92;

      l.x += l.vx + l.vx2;
      l.y += l.vy + l.vy2;
      l.rot += l.vrot;

      // bounds
      if(l.x < -20) l.x = W + 20;
      if(l.x > W + 20) l.x = -20;
      if(l.y > H - 10){
        l.alpha *= 0.96;
      }

      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rot);
      ctx.globalAlpha = l.alpha;
      ctx.font = l.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(l.emoji, 0, 0);
      ctx.restore();
    });

    // sweep indicator
    if(mouseX > 0){
      ctx.beginPath();
      ctx.arc(mouseX, mouseY, 50, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    requestAnimationFrame(update);
  }

  function getPos(e){
    const rect = cv.getBoundingClientRect();
    const sx = W/rect.width, sy = H/rect.height;
    const t = e.touches?e.touches[0]:e;
    return {x:(t.clientX-rect.left)*sx, y:(t.clientY-rect.top)*sy};
  }
  cv.addEventListener('mousemove', (e)=>{ const p=getPos(e); mouseX=p.x; mouseY=p.y; });
  cv.addEventListener('mouseleave', ()=>{ mouseX=-100; mouseY=-100; });
  cv.addEventListener('touchmove', (e)=>{ e.preventDefault(); const p=getPos(e); mouseX=p.x; mouseY=p.y; }, {passive:false});
  cv.addEventListener('touchend', ()=>{ mouseX=-100; mouseY=-100; });

  spawn();
  update();
}

/* ============================================================
   微光拼图 — 滑块拼图，完成时发光
   ============================================================ */
function openGlowPuzzle(){
  const size = 3; // 3x3
  openModal(`
    <div class="modal-title"><span class="emoji">🔲</span>微光拼图</div>
    <div class="modal-desc">点击与空格相邻的方块来移动它们。拼好后方块会发光～</div>
    <div class="glow-puzzle-wrap">
      <div class="glow-grid" id="glowGrid"></div>
      <div class="glow-stats">移动次数：<span id="glowMoves">0</span></div>
      <button class="mood-save-btn" onclick="initGlowPuzzle()" style="margin-top:8px;">🔄 打乱</button>
    </div>
  `);
  window.initGlowPuzzle = function(){
    const grid = document.getElementById('glowGrid');
    if(!grid) return;
    let tiles = [];
    for(let i=1;i<size*size;i++) tiles.push(i);
    tiles.push(0); // 0 = empty
    // shuffle
    for(let i=tiles.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [tiles[i],tiles[j]] = [tiles[j],tiles[i]];
    }
    // ensure solvable
    let inv = 0;
    const flat = tiles.filter(t=>t!==0);
    for(let i=0;i<flat.length;i++)
      for(let j=i+1;j<flat.length;j++)
        if(flat[i]>flat[j]) inv++;
    if(inv % 2 !== 0){
      [tiles[0],tiles[1]] = [tiles[1],tiles[0]];
    }

    let moves = 0;
    const movesEl = document.getElementById('glowMoves');

    function render(){
      grid.innerHTML = '';
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      grid.style.gap = '6px';
      grid.style.maxWidth = '300px';
      grid.style.margin = '0 auto';
      tiles.forEach((val, idx)=>{
        const cell = document.createElement('div');
        cell.className = 'glow-tile';
        cell.dataset.idx = idx;
        if(val === 0){
          cell.classList.add('empty');
        } else {
          cell.textContent = val;
          cell.style.background = `linear-gradient(135deg, hsl(${(val-1)*40},60%,65%), hsl(${(val-1)*40+20},55%,55%))`;
          cell.onclick = ()=>move(idx);
        }
        grid.appendChild(cell);
      });
    }

    function move(idx){
      const row = Math.floor(idx/size), col = idx%size;
      const emptyIdx = tiles.indexOf(0);
      const er = Math.floor(emptyIdx/size), ec = emptyIdx%size;
      if((Math.abs(row-er)===1 && col===ec) || (Math.abs(col-ec)===1 && row===er)){
        [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
        moves++;
        movesEl.textContent = moves;
        render();
        checkWin();
      }
    }

    function checkWin(){
      for(let i=0;i<tiles.length-1;i++){
        if(tiles[i] !== i+1) return;
      }
      // win!
      document.querySelectorAll('.glow-tile:not(.empty)').forEach((t,i)=>{
        setTimeout(()=>{
          t.classList.add('glow-win');
        }, i * 80);
      });
      setTimeout(()=>{
        toast('🎉 拼图完成！用了 ' + moves + ' 步');
      }, 800);
    }

    render();
  };
  initGlowPuzzle();
}

// ===== 自动检测模式 =====
let communityModeDetected = false;
let communityModePromise = null;

async function detectCommunityMode(){
  if (communityModePromise) return communityModePromise;
  communityModePromise = (async () => {
    try {
      const ctrl = new AbortController();
      const timeout = setTimeout(()=>ctrl.abort(), 1500);
      // 用 /api/health 探测后端是否在线（无需认证，返回纯 JSON）
      const res = await fetch(API_BASE + '/api/health', { signal: ctrl.signal });
      clearTimeout(timeout);
      // 验证响应是 JSON 且来自我们的后端
      const ct = res.headers.get('content-type') || '';
      if(res.ok && ct.includes('application/json')){
        communityMode = 'server';
      } else {
        communityMode = 'local';
      }
    } catch(e) {
      communityMode = 'local';
    }
    communityModeDetected = true;
    return communityMode;
  })();
  return communityModePromise;
}

// ===== 统一入口 =====
async function openCommunity() {
  if (!communityModeDetected) {
    await detectCommunityMode();
  }
  if (communityMode === 'server') {
    const token = localStorage.getItem('community_token');
    if (token) {
      try {
        const data = await apiFetch('/api/me');
        currentUser = data.user;
      } catch(e) {
        currentUser = null;
      }
    }
  } else {
    // 本地模式：自动以"我"的身份进入
    const saved = localStorage.getItem('local_user');
    if(saved){
      currentUser = JSON.parse(saved);
    } else {
      currentUser = { id: 999, username: '我', avatar: '😊', bio: '还没有签名~' };
      localStorage.setItem('local_user', JSON.stringify(currentUser));
    }
  }
  renderCommunity();
}

// 时间格式化
function formatTime(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
  if (diff < 604800) return Math.floor(diff / 86400) + '天前';
  return d.toLocaleDateString();
}

// API 请求（仅服务端模式用）
async function apiFetch(path, options = {}) {
  const token = localStorage.getItem('community_token');
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(API_BASE + path, { ...options, headers });
  // 安全解析 JSON：先读文本，再 try parse，避免非 JSON 响应导致崩溃
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch(e) {
    // 后端返回了非 JSON 内容（可能是 HTML 错误页或纯文本）
    console.error('非JSON响应:', path, text.substring(0, 200));
    throw new Error('服务器响应格式错误，请确认后端服务已启动');
  }
  if (!res.ok) throw new Error(data.error || `请求失败 (${res.status})`);
  return data;
}

async function doAuth(mode) {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  const btn = document.querySelector('.auth-btn');
  if (!username || !password) {
    if (errEl) { errEl.textContent = '请填写用户名和密码'; errEl.style.display = 'block'; }
    return;
  }
  if (errEl) { errEl.style.display = 'none'; }
  if (btn) { btn.disabled = true; btn.textContent = mode === 'login' ? '登录中...' : '注册中...'; }
  try {
    const data = await apiFetch(`/api/${mode}`, {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });
    localStorage.setItem('community_token', data.token);
    currentUser = data.user;
    toast(mode === 'login' ? '登录成功！' : '注册成功！');
    renderCommunity();
  } catch (e) {
    if (errEl) { errEl.textContent = e.message; errEl.style.display = 'block'; }
    else toast(e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = mode === 'login' ? '登 录' : '注 册'; }
  }
}

async function toggleLike(postId) {
  const post = communityPosts.find(p => p.id === postId);
  if (!post) return;

  if (communityMode === 'server') {
    try {
      const data = await apiFetch(`/api/posts/${postId}/like`, { method: 'POST' });
      post.liked = data.liked;
      post.likes_count = data.likesCount;
    } catch (e) {
      toast(e.message);
      return;
    }
  } else {
    post.liked = !post.liked;
    post.likes_count = (post.likes_count || 0) + (post.liked ? 1 : -1);
    const localPosts = JSON.parse(localStorage.getItem('local_posts') || '[]');
    const idx = localPosts.findIndex(p=>p.id === postId);
    if (idx >= 0) {
      localPosts[idx].liked = post.liked;
      localPosts[idx].likes_count = post.likes_count;
      localStorage.setItem('local_posts', JSON.stringify(localPosts));
    }
  }
  renderPostList();
}

async function toggleComments(postId) {
  const section = document.getElementById(`comments-${postId}`);
  if (!section) return;
  if (section.style.display === 'none') {
    section.style.display = 'block';
    let comments = [];
    if (communityMode === 'server') {
      try {
        const data = await apiFetch(`/api/posts/${postId}/comments`);
        comments = data.comments;
      } catch (e) {
        toast(e.message);
        return;
      }
    } else {
      const localComments = JSON.parse(localStorage.getItem(`local_comments_${postId}`) || '[]');
      comments = [...(mockComments[postId] || []), ...localComments];
    }
    renderComments(postId, comments);
  } else {
    section.style.display = 'none';
  }
}

function renderComments(postId, comments) {
  const el = document.getElementById(`commentList-${postId}`);
  if (!el) return;
  if (comments.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:10px;font-size:12px;color:var(--text-light);">暂无评论，来说点什么吧</div>';
    return;
  }
  el.innerHTML = comments.map(c => `
    <div class="comment-item">
      <div class="c-avatar">${c.avatar}</div>
      <div class="c-body">
        <div class="c-name">${escapeHtml(c.username)}</div>
        <div class="c-content">${escapeHtml(c.content)}</div>
        <div class="c-time">${formatTime(c.created_at)}</div>
      </div>
    </div>
  `).join('');

async function submitComment(postId) {
  const input = document.getElementById(`commentInput-${postId}`);
  const content = input?.value.trim();
  if (!content) return;
  const post = communityPosts.find(p => p.id === postId);
  if (!post) return;

  let comments = [];
  if (communityMode === 'server') {
    try {
      await apiFetch(`/api/posts/${postId}/comments`, {
        method: 'POST',
        body: JSON.stringify({ content })
      });
      const data = await apiFetch(`/api/posts/${postId}/comments`);
      comments = data.comments;
      post.comments_count = (post.comments_count || 0) + 1;
    } catch (e) {
      toast(e.message);
      return;
    }
  } else {
    const newComment = {
      id: Date.now(),
      user_id: currentUser.id,
      username: currentUser.username,
      avatar: currentUser.avatar,
      content: content,
      created_at: new Date().toISOString()
    };
    const key = `local_comments_${postId}`;
    const localComments = JSON.parse(localStorage.getItem(key) || '[]');
    localComments.push(newComment);
    localStorage.setItem(key, JSON.stringify(localComments));
    comments = [...(mockComments[postId] || []), ...localComments];
    post.comments_count = (mockComments[postId]?.length || 0) + localComments.length;
  }

  input.value = '';
  renderPostList();
  const section = document.getElementById(`comments-${postId}`);
  if (section) section.style.display = 'block';
  renderComments(postId, comments);
}

// 本地模拟群聊
function initLocalChat() {

  updateOnlineBar();

  if (countEl) countEl.textContent = `${onlineUsersList.length + 1} 人在线`;

function updateOnlineBar() {
  const bar = document.getElementById('onlineUsersBar');
  if (!bar) return;
  const users = [...onlineUsersList, currentUser];
  bar.innerHTML = users.map(u => `
    <div class="online-user">
      <span class="dot"></span>
      <span>${u.avatar} ${escapeHtml(u.username)}</span>
    </div>
  `).join('');
}

function sendLocalChatMsg(content) {
  const myMsg = {
    id: Date.now(),
    user_id: currentUser.id,
    username: currentUser.username,
    avatar: currentUser.avatar,
    content: content,
    type: 'text',
    created_at: new Date().toISOString()
  };
  chatMessages.push(myMsg);
  if (chatMessages.length > 100) chatMessages.shift();
  renderChatMessages();

  // 模拟随机回复
  const replyDelay = 2000 + Math.random() * 4000;
  localChatTimer = setTimeout(() => {
    const randomUser = mockUsers[Math.floor(Math.random() * mockUsers.length)];
    const randomReply = mockReplies[Math.floor(Math.random() * mockReplies.length)];
    const replyMsg = {
      id: Date.now() + 1,
      user_id: randomUser.id,
      username: randomUser.username,
      avatar: randomUser.avatar,
      content: randomReply,
      type: 'text',
      created_at: new Date().toISOString()
    };
    chatMessages.push(replyMsg);
    if (chatMessages.length > 100) chatMessages.shift();
    renderChatMessages();
  }, replyDelay);
}

function initSocket() {
  if (typeof io === 'undefined') {
    // 动态加载 socket.io
    const script = document.createElement('script');
    script.src = '/socket.io/socket.io.js';
    script.onload = () => connectSocket();
    script.onerror = () => {
      const el = document.getElementById('chatMessages');
      if (el) el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-sub);">无法连接到聊天服务器，请确保后端已启动</div>';
    };
    document.head.appendChild(script);
  } else {
    connectSocket();
  }
}

function connectSocket() {
  socket = io(API_BASE);

  socket.on('connect', () => {
    socket.emit('join-chat', currentUser);
    // 加载历史消息
    apiFetch('/api/chat/history').then(data => {
      chatMessages = data.messages;
      renderChatMessages();
    }).catch(e => {
      const el = document.getElementById('chatMessages');
      if (el) el.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-sub);">${e.message}</div>`;
    });
  });

  socket.on('online-users', (users) => {
    onlineUsersList = users;
    const bar = document.getElementById('onlineUsersBar');
    const countEl = document.getElementById('chatOnlineCount');
    if (countEl) countEl.textContent = `${users.length} 人在线`;
    if (bar) {
      bar.innerHTML = users.map(u => `
        <div class="online-user">
          <span class="dot"></span>
          <span>${u.avatar} ${escapeHtml(u.username)}</span>
        </div>
      `).join('');
    }
  });

  socket.on('chat-message', (msg) => {
    chatMessages.push(msg);
    if (chatMessages.length > 100) chatMessages.shift();
    renderChatMessages();
  });

  socket.on('user-joined', (data) => {
    chatMessages.push({
      id: 'sys-' + Date.now(),
      system: true,
      content: `${data.user.username} 加入了群聊`
    });
    renderChatMessages();
  });

  socket.on('user-left', (data) => {
    chatMessages.push({
      id: 'sys-' + Date.now(),
      system: true,
      content: `${data.user.username} 离开了群聊`
    });
    renderChatMessages();
  });

  socket.on('new-post', (post) => {
    if (communityTab === 'plaza') {
      communityPosts.unshift(post);
      if (communityPosts.length > 50) communityPosts.pop();
      renderPostList();
    }
  });

  socket.on('new-comment', (data) => {
    if (communityTab === 'plaza') {
      const post = communityPosts.find(p => p.id === data.postId);
      if (post) post.comments_count = (post.comments_count || 0) + 1;
      renderPostList();
    }
  });

  socket.on('disconnect', () => {
    const countEl = document.getElementById('chatOnlineCount');
    if (countEl) countEl.textContent = '连接断开';
  });
}

function renderChatMessages() {
  const el = document.getElementById('chatMessages');
  if (!el) return;
  if (chatMessages.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-sub);font-size:13px;">还没有消息，来说点什么吧～</div>';
    return;
  }
  el.innerHTML = chatMessages.map(m => {
    if (m.system) {
      return `<div class="chat-msg system"><div class="c-bubble">${escapeHtml(m.content)}</div></div>`;
    }
    const isSelf = currentUser && m.user_id === currentUser.id;
    return `
      <div class="chat-msg ${isSelf ? 'self' : ''}">
        <div class="c-avatar">${m.avatar}</div>
        <div class="c-body">
          ${!isSelf ? `<div class="c-name">${escapeHtml(m.username)}</div>` : ''}
          <div class="c-bubble">${escapeHtml(m.content)}</div>
        </div>
      </div>
    `;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function sendChatMsg() {
  const input = document.getElementById('chatInput');
  const content = input?.value.trim();
  if (!content) return;
  if (communityMode === 'server') {
    if (!socket) return;
    socket.emit('chat-message', { content, type: 'text' });
  } else {
    sendLocalChatMsg(content);
  }
  input.value = '';
}

/* ============================================================
   冰块融化 — 3D 冰块同步融化正念练习
   ============================================================ */
let iceMeltTimer = null;
let iceDropletInterval = null;
let iceMeltStartTime = 0;
let iceMeltElapsed = 0;
let iceMeltProgress = 0;
let iceMeltRunning = false;
let iceMeltSpeed = 1;
let iceDropletTimeouts = [];

const iceGuidanceTexts = [
  '从冰箱取一块冰块，握在手中。感受那份刺骨的凉意从指尖蔓延...',
  '冰块在你掌心慢慢变暖。注意水珠的触感，冰块边缘的柔软变化。',
  '冰块越来越小了。水从指缝滑落，每一滴都在带走压力。',
  '冰块快要消失了。感受手中残留的凉意，深深吸一口气。',
  '冰块已完全融化。手中的水渍是它的告别。呼气，松开手。'
];

function openIceMelt(){
  iceMeltElapsed = 0;
  iceMeltProgress = 0;
  iceMeltRunning = false;
  iceMeltSpeed = 1;
  openModal(`
    <div class="modal-title"><span class="emoji">🧊</span>冰块融化</div>
    <div class="modal-desc">从厨房取一块真正的冰块握在手中，点击开始，让数字冰块与手中的冰块同步融化。感受冰凉从指尖蔓延，让注意力完全集中在这一刻的触感上。</div>
    <div class="ice-scene" id="iceScene">
      <div class="ice-stage" id="iceStage">
        <div class="ice-cube" id="iceCube">
          <div class="ice-face front"></div>
          <div class="ice-face back"></div>
          <div class="ice-face left"></div>
          <div class="ice-face right"></div>
          <div class="ice-face top"></div>
          <div class="ice-face bottom"></div>
        </div>
        <div class="ice-droplets" id="iceDroplets"></div>
      </div>
      <div class="ice-puddle" id="icePuddle"></div>
      <div class="ice-timer" id="iceTimer">00:00</div>
      <div class="ice-progress-text" id="iceProgressText">准备开始</div>
    </div>
    <div class="ice-guidance" id="iceGuidance">从冰箱取一块冰块，握在手中。感受那份刺骨的凉意从指尖蔓延...</div>
    <div class="ice-speed-row">
      <label>融化速度</label>
      <input type="range" id="iceSpeedSlider" min="0.5" max="4" step="0.1" value="1" oninput="setIceMeltSpeed(this.value)">
      <span class="ice-speed-val" id="iceSpeedVal">1.0x</span>
    </div>
    <div class="ice-controls">
      <button class="ice-btn" id="iceStartBtn" onclick="startIceMelt()">🧊 开始融化</button>
      <button class="ice-btn secondary" onclick="resetIceMelt()">重置</button>
    </div>
    <div class="ice-complete" id="iceCompleteMsg">
      <span class="emoji">💧</span>
      <p>冰块已完全融化。<br>感受手中残留的水渍和凉意，深呼吸三次，让这份清凉陪你走过接下来的时光。</p>
    </div>
  `);
}

function startIceMelt(){
  if(iceMeltRunning) return;
  iceMeltRunning = true;
  iceMeltStartTime = Date.now() - iceMeltElapsed;
  const btn = document.getElementById('iceStartBtn');
  if(btn){ btn.textContent = '⏸ 暂停'; btn.onclick = pauseIceMelt; }
  const cube = document.getElementById('iceCube');
  if(cube) cube.classList.remove('paused');

  iceMeltTimer = setInterval(()=>{
    iceMeltElapsed = Date.now() - iceMeltStartTime;
    updateIceTimer();
    updateIceMeltVisual();
  }, 100);

  iceDropletInterval = setInterval(()=>{
    if(iceMeltProgress > 0.08) createIceDroplet();
  }, 700);
}

function pauseIceMelt(){
  iceMeltRunning = false;
  clearInterval(iceMeltTimer);
  clearInterval(iceDropletInterval);
  const btn = document.getElementById('iceStartBtn');
  if(btn){ btn.textContent = '🧊 继续'; btn.onclick = startIceMelt; }
  const cube = document.getElementById('iceCube');
  if(cube) cube.classList.add('paused');
}

function updateIceTimer(){
  const totalSec = Math.floor(iceMeltElapsed / 1000);
  const min = String(Math.floor(totalSec / 60)).padStart(2,'0');
  const sec = String(totalSec % 60).padStart(2,'0');
  const timerEl = document.getElementById('iceTimer');
  if(timerEl) timerEl.textContent = min + ':' + sec;
  const progressEl = document.getElementById('iceProgressText');
  if(progressEl){
    const pct = Math.round(iceMeltProgress * 100);
    progressEl.textContent = pct < 100 ? '已融化 ' + pct + '%' : '完全融化';
  }
}

function updateIceMeltVisual(){
  const totalMeltTime = 120000 / iceMeltSpeed;
  iceMeltProgress = Math.min(1, iceMeltElapsed / totalMeltTime);

  const stage = document.getElementById('iceStage');
  const puddle = document.getElementById('icePuddle');
  const guidance = document.getElementById('iceGuidance');
  if(!stage) return;

  const scale = Math.max(0.05, 1 - iceMeltProgress * 0.9);
  const sink = iceMeltProgress * 70;
  const opacity = Math.max(0, 1 - iceMeltProgress * 0.85);

  stage.style.transform = `translateY(${sink}px) scale(${scale})`;
  stage.style.opacity = opacity;

  if(puddle){
    puddle.style.width = (iceMeltProgress * 220) + 'px';
    puddle.style.height = (8 + iceMeltProgress * 8) + 'px';
    puddle.style.opacity = iceMeltProgress * 0.7;
  }

  // Update guidance text based on progress
  if(guidance){
    const idx = Math.min(iceGuidanceTexts.length - 1, Math.floor(iceMeltProgress * iceGuidanceTexts.length));
    if(guidance.dataset.idx != idx){
      guidance.dataset.idx = idx;
      guidance.style.opacity = '0';
      setTimeout(()=>{ guidance.textContent = iceGuidanceTexts[idx]; guidance.style.opacity = '1'; }, 200);
    }
  }

  if(iceMeltProgress >= 1){
    pauseIceMelt();
    const msg = document.getElementById('iceCompleteMsg');
    const btn = document.getElementById('iceStartBtn');
    if(msg) msg.style.display = 'block';
    if(btn) btn.style.display = 'none';
  }
}

function createIceDroplet(){
  const container = document.getElementById('iceDroplets');
  if(!container) return;
  const droplet = document.createElement('div');
  droplet.className = 'ice-droplet';
  droplet.style.left = (Math.random() * 160 + 20) + 'px';
  droplet.style.top = '180px';
  const dur = 1.5 + Math.random() * 1.2;
  droplet.style.setProperty('--dur', dur + 's');
  droplet.style.setProperty('--fall', (180 + Math.random() * 40) + 'px');
  container.appendChild(droplet);
  const t = setTimeout(()=>{ if(droplet.parentNode) droplet.remove(); }, dur * 1000 + 200);
  iceDropletTimeouts.push(t);
}

function setIceMeltSpeed(val){
  iceMeltSpeed = parseFloat(val);
  const el = document.getElementById('iceSpeedVal');
  if(el) el.textContent = iceMeltSpeed.toFixed(1) + 'x';
}

function resetIceMelt(){
  stopIceMeltAll();
  iceMeltElapsed = 0;
  iceMeltProgress = 0;
  iceMeltRunning = false;
  const stage = document.getElementById('iceStage');
  const puddle = document.getElementById('icePuddle');
  const timer = document.getElementById('iceTimer');
  const progressEl = document.getElementById('iceProgressText');
  const msg = document.getElementById('iceCompleteMsg');
  const btn = document.getElementById('iceStartBtn');
  const guidance = document.getElementById('iceGuidance');
  const droplets = document.getElementById('iceDroplets');
  const cube = document.getElementById('iceCube');
  if(stage){ stage.style.transform = ''; stage.style.opacity = '1'; }
  if(puddle){ puddle.style.width = '0px'; puddle.style.height = '10px'; puddle.style.opacity = '0'; }
  if(timer) timer.textContent = '00:00';
  if(progressEl) progressEl.textContent = '准备开始';
  if(msg) msg.style.display = 'none';
  if(btn){ btn.style.display = ''; btn.textContent = '🧊 开始融化'; btn.onclick = startIceMelt; }
  if(guidance){ guidance.textContent = iceGuidanceTexts[0]; guidance.dataset.idx = '0'; guidance.style.opacity = '1'; }
  if(droplets) droplets.innerHTML = '';
  if(cube) cube.classList.remove('paused');
}

function stopIceMeltAll(){
  clearInterval(iceMeltTimer);
  clearInterval(iceDropletInterval);
  iceDropletTimeouts.forEach(t=>clearTimeout(t));
  iceDropletTimeouts = [];
  iceMeltTimer = null;
  iceDropletInterval = null;
  iceMeltRunning = false;
}

function playWoodfishSound(){
  try{
    if(!woodfishAudioCtx) woodfishAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = woodfishAudioCtx;
    const now = ctx.currentTime;
    // Main "笃" sound: short percussive tone
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(280, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
    // Add a click component
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(600, now);
    gain2.gain.setValueAtTime(0.1, now);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.start(now);
    osc2.stop(now + 0.03);
  }catch(e){}
}

function stopWoodfishAll(){
  if(woodfishComboTimer){ clearTimeout(woodfishComboTimer); woodfishComboTimer = null; }
  woodfishFloatTimeouts.forEach(t=>clearTimeout(t));
  woodfishFloatTimeouts = [];
  woodfishCombo = 0;

}

function initSmashCanvas(){
  smashCanvas = document.getElementById('smashCanvas');
  if(!smashCanvas) return;
  smashCtx2d = smashCanvas.getContext('2d');
  resizeSmashCanvas();
  if(smashAnimId) cancelAnimationFrame(smashAnimId);
  smashAnimId = requestAnimationFrame(smashAnimLoop);
}

function resizeSmashCanvas(){
  if(!smashCanvas) return;
  const scene = document.getElementById('smashSceneEl');
  if(!scene) return;
  const rect = scene.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  smashCanvas.width = rect.width * dpr;
  smashCanvas.height = rect.height * dpr;
  smashCanvas.style.width = rect.width + 'px';
  smashCanvas.style.height = rect.height + 'px';
  smashCtx2d.scale(dpr, dpr);
}

function smashAnimLoop(){
  if(!smashCtx2d || !smashCanvas){ smashAnimId = null; return; }
  const w = smashCanvas.width / (window.devicePixelRatio||1);
  const h = smashCanvas.height / (window.devicePixelRatio||1);
  smashCtx2d.clearRect(0, 0, w, h);
  for(let i = smashParticles.length - 1; i >= 0; i--){
    const p = smashParticles[i];
    p.vx *= 0.99;
    p.vy += p.gravity || 0.35;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vrot;
    p.life -= 1;
    if(p.life <= 0 || p.y > h + 50){
      smashParticles.splice(i, 1);
      continue;
    }
    const alpha = Math.min(1, p.life / p.maxLife);
    smashCtx2d.save();
    smashCtx2d.translate(p.x, p.y);
    smashCtx2d.rotate(p.rot);
    smashCtx2d.globalAlpha = alpha;
    if(p.type === 'spark'){
      smashCtx2d.fillStyle = p.color;
      smashCtx2d.shadowBlur = 6;
      smashCtx2d.shadowColor = p.color;
      smashCtx2d.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    } else if(p.type === 'fragment'){
      smashCtx2d.fillStyle = p.color;
      smashCtx2d.beginPath();
      const s = p.size;
      smashCtx2d.moveTo(-s/2, -s/3);
      smashCtx2d.lineTo(s/2, -s/2);
      smashCtx2d.lineTo(s/3, s/2);
      smashCtx2d.lineTo(-s/3, s/3);
      smashCtx2d.closePath();
      smashCtx2d.fill();
    } else if(p.type === 'dust'){
      smashCtx2d.fillStyle = p.color;
      smashCtx2d.globalAlpha = alpha * 0.4;
      smashCtx2d.beginPath();
      smashCtx2d.arc(0, 0, p.size, 0, Math.PI*2);
      smashCtx2d.fill();
    }
    smashCtx2d.restore();
  }
  if(smashParticles.length > 0){
    smashAnimId = requestAnimationFrame(smashAnimLoop);
  } else {
    smashAnimId = null;
  }
}

function smashHit(e){
  if(smashFinished) return;
  smashCount++;
  const countEl = document.getElementById('smashCount');
  if(countEl) countEl.textContent = smashCount;
  const fillEl = document.getElementById('smashProgressFill');
  if(fillEl) fillEl.style.width = (smashCount/smashMax*100) + '%';
  const stage = document.getElementById('smashStage');
  const scene = document.getElementById('smashSceneEl');
  if(stage){ stage.classList.remove('shaking'); void stage.offsetWidth; stage.classList.add('shaking'); }
  if(scene){ scene.classList.remove('global-shake'); void scene.offsetWidth; scene.classList.add('global-shake'); }
  const item = document.getElementById('smashItem');
  if(item){ item.classList.remove('hit'); void item.offsetWidth; item.classList.add('hit'); }
  const rect = smashCanvas ? smashCanvas.getBoundingClientRect() : null;
  if(rect && e){
    const cx = (e.clientX || rect.left + rect.width/2) - rect.left;
    const cy = (e.clientY || rect.top + rect.height/2) - rect.top;
    spawnSmashSparks(cx, cy);
  }
  addSmashCrackPath(smashCount);
  playSmashHitSound();
  if(item){
    const dim = 1 - (smashCount / smashMax) * 0.35;
    item.style.filter = `brightness(${dim})`;
  }
  if(smashCount >= smashMax){
    setTimeout(()=>smashExplode(), 100);
  }
}

function spawnSmashSparks(cx, cy){
  const sparkColors = ['#ffffff','#ffe9a0','#ffd060','#ffaa30','#ccc','#aaa'];
  const numSparks = 12 + Math.floor(Math.random() * 8);
  for(let i = 0; i < numSparks; i++){
    const angle = (Math.PI * 2 * i / numSparks) + (Math.random() - 0.5) * 0.5;
    const speed = 3 + Math.random() * 7;
    const isDust = Math.random() > 0.7;
    smashParticles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      gravity: 0.35,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.4,
      size: isDust ? (1 + Math.random()*2) : (1.5 + Math.random()*3),
      color: sparkColors[Math.floor(Math.random()*sparkColors.length)],
      type: isDust ? 'dust' : 'spark',
      life: 30 + Math.random() * 30,
      maxLife: 50,
    });
  }
  if(!smashAnimId) smashAnimId = requestAnimationFrame(smashAnimLoop);
}

function addSmashCrackPath(step){
  const overlay = document.getElementById('smashCrackOverlay');
  if(!overlay) return;
  const numCracks = step <= 6 ? 1 : (step <= 12 ? 2 : 3);
  for(let c = 0; c < numCracks; c++){
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 200 200');
    svg.style.position = 'absolute';
    svg.style.inset = '0';
    svg.style.width = '100%';
    svg.style.height = '100%';
    const startX = 30 + Math.random() * 140;
    const startY = 30 + Math.random() * 140;
    const endX = startX + (Math.random() - 0.5) * 100;
    const endY = startY + (Math.random() - 0.5) * 100;
    let d = 'M ' + startX + ' ' + startY;
    let px = startX, py = startY;
    const segs = 3 + Math.floor(Math.random() * 4);
    for(let s = 0; s < segs; s++){
      const t = (s + 1) / segs;
      const tx = startX + (endX - startX) * t + (Math.random() - 0.5) * 25;
      const ty = startY + (endY - startY) * t + (Math.random() - 0.5) * 25;
      d += ' L ' + tx + ' ' + ty;
      px = tx; py = ty;
      if(Math.random() > 0.4 && s < segs - 1){
        const bx = px + (Math.random() - 0.5) * 35;
        const by = py + (Math.random() - 0.5) * 35;
        d += ' M ' + px + ' ' + py + ' L ' + bx + ' ' + by + ' M ' + px + ' ' + py;
      }
    }
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', 'rgba(255,255,255,0.85)');
    path.setAttribute('stroke-width', '1.2');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.style.filter = 'drop-shadow(0 0 3px rgba(255,255,255,0.6))';
    path.style.opacity = '0';
    path.style.transition = 'opacity .3s ease';
    svg.appendChild(path);
    const glowPath = document.createElementNS(svgNS, 'path');
    glowPath.setAttribute('d', d);
    glowPath.setAttribute('stroke', 'rgba(255,255,255,0.3)');
    glowPath.setAttribute('stroke-width', '3');
    glowPath.setAttribute('fill', 'none');
    glowPath.setAttribute('stroke-linecap', 'round');
    glowPath.style.opacity = '0';
    glowPath.style.transition = 'opacity .4s ease';
    svg.appendChild(glowPath);
    overlay.appendChild(svg);
    requestAnimationFrame(()=>{
      path.style.opacity = '1';
      glowPath.style.opacity = '1';
    });
    smashCrackPaths.push(svg);
  }
}

function playSmashHitSound(){
  try{
    if(!smashAudioCtx) smashAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = smashAudioCtx;
    const now = ctx.currentTime;
    const bufSize = ctx.sampleRate * 0.12;
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufSize; i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufSize, 1.8);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.18, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(2500 + Math.random()*1000, now);
    bp.Q.value = 3;
    noise.connect(bp); bp.connect(noiseGain); noiseGain.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.12);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140 + Math.random()*30, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.12);
  }catch(e){}
}

function smashExplode(){
  smashFinished = true;
  const item = document.getElementById('smashItem');
  const stage = document.getElementById('smashStage');
  const scene = document.getElementById('smashSceneEl');
  const flash = document.getElementById('smashFlash');

  for(let i = 0; i < numFrags; i++){
    const angle = (Math.PI * 2 * i / numFrags) + (Math.random() - 0.5) * 0.8;
    const speed = 4 + Math.random() * 12;
    smashParticles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3 - Math.random() * 4,
      gravity: 0.3,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.5,
      size: 3 + Math.random() * 10,
      color: fragColors[Math.floor(Math.random()*fragColors.length)],
      type: 'fragment',
      life: 80 + Math.random() * 60,

    });
  }

    const angle = Math.random() * Math.PI * 2;
    const speed = 5 + Math.random() * 15;
    smashParticles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      gravity: 0.25,
      rot: 0, vrot: 0,
      size: 1.5 + Math.random() * 2.5,

      type: 'spark',

    });

function playSmashExplosionSound(){
  try{
    const ctx = smashAudioCtx;
    if(!ctx) return;
    const now = ctx.currentTime;
    const bufSize = ctx.sampleRate * 0.6;
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufSize; i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufSize, 1.2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.45, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1500, now);
    filter.frequency.exponentialRampToValueAtTime(150, now + 0.4);
    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.5);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
    gain.gain.setValueAtTime(0.55, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.5);
    for(let i = 0; i < 5; i++){
      const t = now + 0.1 + Math.random() * 0.3;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(800 + Math.random()*2000, t);
      g.gain.setValueAtTime(0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.15);
    }
  }catch(e){}
}

let icePomoRunning = false;
let icePomoDripInterval = null;
let icePomoDripTimeouts = [];

const icePomoModes = {focus:25*60, short:5*60, long:15*60};
const icePomoModeNames = {focus:'专注中', short:'短休息', long:'长休息'};

function openIcePomo(){
  icePomoRunning = false;
  icePomoMode = 'focus';
  icePomoTimeLeft = icePomoModes.focus;
  openModal(`
    <div class="modal-title"><span class="emoji">🧊</span>冰块番茄钟</div>
    <div class="modal-desc">冰块上显示专注时间，随着时间流逝冰块缓缓融化滴水。专注结束时冰块完全融化——那一刻的清凉，是你坚持的勋章。今天已完成 <b>${Store.get('pomodoroCount',0)}</b> 个番茄。</div>
    <div class="icepomo-scene">
      <div class="icepomo-modes">
        <button class="icepomo-mode-btn active" onclick="setIcePomoMode('focus')">专注 25min</button>
        <button class="icepomo-mode-btn" onclick="setIcePomoMode('short')">短休息 5min</button>
        <button class="icepomo-mode-btn" onclick="setIcePomoMode('long')">长休息 15min</button>
      </div>
      <div class="icepomo-stage">
        <div class="icepomo-block" id="icePomoBlock">
          <div class="icepomo-body" id="icePomoBody">
            <div class="icepomo-timer" id="icePomoTimer">25:00</div>
            <div class="icepomo-mode-label" id="icePomoModeLabel">专注中</div>
          </div>
          <div class="icepomo-droplets" id="icePomoDroplets"></div>
        </div>
        <div class="icepomo-puddle" id="icePomoPuddle"></div>
      </div>
      <div class="icepomo-controls">
        <button class="ice-btn" id="icePomoStartBtn" onclick="toggleIcePomo()">🧊 开始专注</button>
        <button class="ice-btn secondary" onclick="resetIcePomo()">重置</button>
      </div>
      <div class="icepomo-hint">冰块会随着专注时间慢慢融化、滴水。专注结束后冰块完全融化，那一刻感受清凉。</div>
    </div>
  `);
  updateIcePomoDisplay();
}

function setIcePomoMode(mode){
  icePomoMode = mode;
  icePomoTimeLeft = icePomoModes[mode];
  icePomoRunning = false;
  clearInterval(icePomoTimer);
  clearInterval(icePomoDripInterval);
  document.querySelectorAll('.icepomo-mode-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  updateIcePomoDisplay();
  resetIcePomoVisual();
  const btn = document.getElementById('icePomoStartBtn');
  if(btn) btn.textContent = '🧊 开始专注';
}

function toggleIcePomo(){
  if(icePomoRunning){
    icePomoRunning = false;
    clearInterval(icePomoTimer);
    clearInterval(icePomoDripInterval);
    const btn = document.getElementById('icePomoStartBtn');
    if(btn) btn.textContent = '🧊 继续';
  } else {
    icePomoRunning = true;
    const btn = document.getElementById('icePomoStartBtn');
    if(btn) btn.textContent = '⏸ 暂停';
    icePomoTimer = setInterval(()=>{
      icePomoTimeLeft--;
      updateIcePomoDisplay();
      updateIcePomoVisual();
      if(icePomoTimeLeft <= 0){
        clearInterval(icePomoTimer);
        clearInterval(icePomoDripInterval);
        icePomoRunning = false;
        const btn2 = document.getElementById('icePomoStartBtn');
        if(btn2) btn2.textContent = '🧊 再来一轮';
        if(icePomoMode === 'focus'){
          const count = Store.get('pomodoroCount',0)+1;
          Store.set('pomodoroCount', count);
          checkReward('pomodoro');
          showPomoCat('专注结束啦～冰块已完全融化，该休息了 🐱', count);
        } else {
          showPomoCat('休息结束啦～冰块重新凝结，准备好了就继续 🐱', null);
        }
        setIcePomoMode(icePomoMode==='focus'?'short':'focus');
      }
    }, 1000);
    // Drip water periodically
    icePomoDripInterval = setInterval(()=>{
      const progress = 1 - icePomoTimeLeft / icePomoModes[icePomoMode];
      if(progress > 0.05) createIcePomoDrip();
    }, 1200);
  }
}

function resetIcePomo(){
  icePomoRunning = false;
  clearInterval(icePomoTimer);
  clearInterval(icePomoDripInterval);
  icePomoTimeLeft = icePomoModes[icePomoMode];
  updateIcePomoDisplay();
  resetIcePomoVisual();
  const btn = document.getElementById('icePomoStartBtn');
  if(btn) btn.textContent = '🧊 开始专注';
}

function updateIcePomoDisplay(){
  const el = document.getElementById('icePomoTimer');
  if(el){
    const m = Math.floor(icePomoTimeLeft/60);
    const s = icePomoTimeLeft%60;
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  const label = document.getElementById('icePomoModeLabel');
  if(label) label.textContent = icePomoModeNames[icePomoMode];
}

function updateIcePomoVisual(){
  const total = icePomoModes[icePomoMode];
  const progress = Math.min(1, 1 - icePomoTimeLeft / total);
  const block = document.getElementById('icePomoBlock');
  const puddle = document.getElementById('icePomoPuddle');
  if(!block) return;
  const scale = Math.max(0.15, 1 - progress * 0.85);
  const sink = progress * 50;
  const opacity = Math.max(0.1, 1 - progress * 0.8);
  block.style.transform = `rotateX(8deg) rotateY(-15deg) translateY(${sink}px) scale(${scale})`;
  block.style.opacity = opacity;
  if(puddle){
    puddle.style.width = (progress * 200) + 'px';
    puddle.style.height = (6 + progress * 6) + 'px';
    puddle.style.opacity = progress * 0.6;
  }
}

function resetIcePomoVisual(){
  const block = document.getElementById('icePomoBlock');
  const puddle = document.getElementById('icePomoPuddle');
  const drops = document.getElementById('icePomoDroplets');
  if(block){ block.style.transform = 'rotateX(8deg) rotateY(-15deg)'; block.style.opacity = '1'; }
  if(puddle){ puddle.style.width = '0px'; puddle.style.height = '8px'; puddle.style.opacity = '0'; }
  if(drops) drops.innerHTML = '';
  icePomoDripTimeouts.forEach(t=>clearTimeout(t));
  icePomoDripTimeouts = [];
}

function createIcePomoDrip(){
  const container = document.getElementById('icePomoDroplets');
  if(!container) return;
  const drip = document.createElement('div');
  drip.className = 'icepomo-droplet';
  drip.style.left = (15 + Math.random() * 70) + '%';
  drip.style.top = '85%';
  const dur = 1.5 + Math.random();
  drip.style.setProperty('--dur', dur + 's');
  drip.style.setProperty('--fall', '120px');
  container.appendChild(drip);
  const t = setTimeout(()=>{ if(drip.parentNode) drip.remove(); }, dur * 1000 + 200);
  icePomoDripTimeouts.push(t);
}

function stopIcePomoAll(){
  clearInterval(icePomoTimer);
  clearInterval(icePomoDripInterval);
  icePomoDripTimeouts.forEach(t=>clearTimeout(t));
  icePomoDripTimeouts = [];
  icePomoTimer = null;
  icePomoDripInterval = null;
  icePomoRunning = false;
}
